name: Integrate DCEEM passive NLOS 2026

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/integrate-dceem-20260821.yml
  pull_request:
    branches: [master]
    paths:
      - 'updates/trigger-dceem-20260821*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Apply bounded DCEEM source integration
        run: |
          set -euo pipefail
          python3 scripts/integrate_dceem_20260821.py

      - name: Validate source-level synchronization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          doi='10.1016/j.optcom.2026.133626'
          key='wangDynamicChannelPNLOS2026'
          title='Enhancing passive non-line-of-sight imaging via dynamic channel optimization'
          readme=Path('README.md').read_text(encoding='utf-8')
          corpus=Path('data/papers-source.html').read_text(encoding='utf-8')
          passive=Path('article/3passive.tex').read_text(encoding='utf-8')
          bib=Path('egbib_merged_20260711.bib').read_text(encoding='utf-8')
          tex=Path('bare_jrnl.tex').read_text(encoding='utf-8')
          key_count=len(re.findall(r'@\w+\{'+re.escape(key)+r'\s*,',bib,re.I))
          doi_field_count=len(re.findall(r'doi\s*=\s*\{\s*'+re.escape(doi)+r'\s*\}',bib,re.I))
          checks=[
              (readme.lower().count(doi.lower())==1,'README contains one DCEEM DOI'),
              (corpus.lower().count(doi.lower())==1,'V2 corpus contains one DCEEM DOI'),
              (title in readme,'README title present'),
              (title in corpus,'V2 title present'),
              (key in passive,'passive survey citation present'),
              (key_count==1,f'one canonical BibTeX key (found {key_count})'),
              (doi_field_count==1,f'one canonical DOI field in merged bibliography (found {doi_field_count})'),
              ('21 August 2026' in tex,'survey date/provenance updated'),
              ('Updated 21 August 2026' in corpus and 'Last updated: 21 August 2026' in corpus,'V2 dates updated'),
              ('<b>311</b><span>tracked latest entries</span>' in corpus,'V2 tracked count incremented once'),
          ]
          bad=[]
          for ok,msg in checks:
              print(('PASS: ' if ok else 'FAIL: ')+msg)
              if not ok: bad.append(msg)
          if bad: raise AssertionError('; '.join(bad))
          PY

      - name: Build survey PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: bare_jrnl.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Validate citations, PDF semantics, and rendering
        run: |
          set -euo pipefail
          test -s bare_jrnl.pdf
          grep -q 'wangDynamicChannelPNLOS2026' bare_jrnl.aux
          grep -qi 'Enhancing passive non-line-of-sight imaging via dynamic channel optimization' bare_jrnl.bbl
          pdftotext bare_jrnl.pdf /tmp/nlos-dceem.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          txt=Path('/tmp/nlos-dceem.txt').read_text(encoding='utf-8',errors='ignore')
          norm=re.sub(r'[-‐‑–—\n\r\t ]+',' ',txt).lower()
          required=['dynamic channel enhancement','bayesian','light transport','vector quantization']
          missing=[x for x in required if x not in norm]
          print('PDF semantic checks:', {x:(x in norm) for x in required})
          if missing: raise AssertionError('Missing PDF semantic tokens: '+', '.join(missing))
          if Path('bare_jrnl.pdf').stat().st_size < 100000:
              raise AssertionError('rebuilt PDF unexpectedly small')
          PY
          pages=$(pdfinfo bare_jrnl.pdf | awk '/^Pages:/ {print $2}')
          test -n "$pages"
          mkdir -p /tmp/dceem-render
          pdftoppm -f 1 -singlefile -png -r 100 bare_jrnl.pdf /tmp/dceem-render/first
          pdftoppm -f "$pages" -singlefile -png -r 100 bare_jrnl.pdf /tmp/dceem-render/last
          test -s /tmp/dceem-render/first.png
          test -s /tmp/dceem-render/last.png

      - name: Record integrated status
        run: |
          cat > updates/2026-08-21-dceem-integrated.md <<'EOF'
          # DCEEM passive NLOS synchronized — 21 August 2026

          Integrated Xuefeng Wang, Xingsu Chen, Miao Xu, Lan Wang, Gulnaz Alimjan, and Li Zhao, “Enhancing passive non-line-of-sight imaging via dynamic channel optimization,” Optics Communications 620, 133626 (2026), DOI 10.1016/j.optcom.2026.133626.

          The survey positions DCEEM after diffuse-aware / light-transport-aware passive reconstruction as a low-SNR physics-aware channel-selection step: feature statistics and physical descriptors are fused through Bayesian multiplicative weighting, followed by hierarchical denoising/refinement and vector-quantization optimization.

          README, canonical V2 corpus/timeline, passive-survey prose, merged bibliography, and regenerated `bare_jrnl.pdf` were validated together. Citation resolution, PDF text semantics, and rendered first/last pages passed before commit.
          EOF

      - name: Commit synchronized public artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/integrate-dceem-20260821.yml scripts/integrate_dceem_20260821.py egbib_20260820_dceem_passive_gap.bib
          git add README.md data/papers-source.html article/3passive.tex egbib_merged_20260711.bib bare_jrnl.tex bare_jrnl.pdf updates/2026-08-20-dceem-passive-gap.md updates/2026-08-21-dceem-integrated.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Integrate DCEEM passive NLOS reconstruction'
          git push origin HEAD:master
