name: PR integration for SPAD timing and low-sampling NLOS papers

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/nlos_spad_sampling_pr_20260726.trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-build-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Integrate verified records
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +e
          python tools/run_spad_sampling_integration_20260726.py > /tmp/nlos-integration.log 2>&1
          status=$?
          cat /tmp/nlos-integration.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/nlos-integration.log .github/nlos_spad_sampling_20260726.failure.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/nlos_spad_sampling_20260726.failure.log
            git commit -m "Record SPAD sampling integration diagnostic"
            git push origin HEAD:"$HEAD_BRANCH"
            exit "$status"
          fi
          set -e
          python tools/synchronize_nlos_counts_20260726.py

      - name: Install LaTeX and PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            texlive-science texlive-publishers texlive-bibtex-extra poppler-utils

      - name: Clean-build survey PDF
        run: |
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log \
                bare_jrnl.out bare_jrnl.toc bare_jrnl.lof bare_jrnl.lot
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex

      - name: Validate synchronized sources and PDF
        shell: bash
        run: |
          set -euo pipefail
          test -s bare_jrnl.pdf
          ! grep -Eiq "undefined citations|Citation .* undefined|There were undefined references" bare_jrnl.log
          ! grep -Eiq "Repeated entry" bare_jrnl.blg
          pdfinfo bare_jrnl.pdf | tee /tmp/pdfinfo.txt
          pages=$(awk '/^Pages:/ {print $2}' /tmp/pdfinfo.txt)
          test -n "$pages" && test "$pages" -gt 0
          pdftotext bare_jrnl.pdf /tmp/bare_jrnl.txt
          test -s /tmp/bare_jrnl.txt
          grep -Fq "Papers-210+-green" README.md
          grep -Fq "210+ papers" article/0abstract.tex
          grep -Fq "210+ papers" index.html
          grep -Fq "spaettSPADTimingNLOS2026" article/2active.tex
          grep -Fq "yangPoissonLowSamplingNLOS2026" article/2active.tex
          grep -Fq "wangSemanticUndersamplingNLOS2026" article/2active.tex
          grep -Fq "10.1364/OE.584776" egbib_merged_20260711.bib
          grep -Fq "10.1117/12.3091668" egbib_merged_20260711.bib
          grep -Fq "10.1117/12.3094245" egbib_merged_20260711.bib

      - name: Verify updater is idempotent
        run: |
          python tools/run_spad_sampling_integration_20260726.py
          python tools/synchronize_nlos_counts_20260726.py
          git diff --exit-code -- README.md index.html article/2active.tex article/0abstract.tex bare_jrnl.tex egbib_merged_20260711.bib

      - name: Commit updates to pull-request branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/nlos_spad_sampling_20260726.failure.log
          git add README.md index.html article/2active.tex article/0abstract.tex \
                  bare_jrnl.tex egbib_merged_20260711.bib bare_jrnl.pdf \
                  .github/nlos_spad_sampling_20260726.failure.log
          if git diff --cached --quiet; then
            echo "No synchronized source or PDF changes were needed."
            exit 0
          fi
          git commit -m "Integrate SPAD timing and low-sampling NLOS lineage"
          git push origin HEAD:"$HEAD_BRANCH"
