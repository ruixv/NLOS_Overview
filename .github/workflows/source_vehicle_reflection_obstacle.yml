name: Source-only vehicle-reflection NLOS integration
on:
  push:
    branches: [master]
    paths:
      - updates/TRIGGER_2026-07-28_VEHICLE_REFLECTION_SOURCE.md
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate source updates
        shell: bash
        run: |
          python -m pip install bibtexparser
          python scripts/integrate_vehicle_reflection_obstacle.py
          python scripts/merge_nlos_bibliography.py
          git checkout -- updates/2026-07-11-bibliography-deduplication.md || true
          python - <<'PY'
          from pathlib import Path
          import re
          doi='10.1016/j.iatssr.2026.02.007'
          key='shengVehicleReflectionObstacle2026'
          readme=Path('README.md').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          passive=Path('article/3passive.tex').read_text(encoding='utf-8')
          bib=Path('egbib_merged_20260711.bib').read_text(encoding='utf-8')
          tex=Path('bare_jrnl.tex').read_text(encoding='utf-8')
          assert readme.count(doi)==1
          assert index.count(doi)==1
          assert passive.count(key)==1
          assert bib.count(doi)==1
          assert 'stereo vehicle-reflection NLOS obstacle localization synchronized' in tex
          count=len(re.findall(r'\{cat:"',index))
          assert f'<div class="stat"><b>{count}</b><span>tracked latest entries</span></div>' in index
          note=Path('updates/2026-07-28-vehicle-reflection-obstacle-localization.md')
          text=note.read_text(encoding='utf-8')
          text=text.replace('Updated README, website explorer and 2026 timeline, passive survey prose, dated and consolidated BibTeX, survey trace marker, and rebuilt PDF. The work is categorized as localization rather than hidden-scene reconstruction.', 'Updated README, website explorer and 2026 timeline, passive survey prose, dated and consolidated BibTeX, and the survey trace marker. PDF compilation is staged separately and is not claimed by this source-only commit. The work is categorized as localization rather than hidden-scene reconstruction.')
          note.write_text(text,encoding='utf-8')
          Path('updates/2026-07-28-vehicle-reflection-source-validation.txt').write_text(f'Validated source synchronization; website entries: {count}; PDF rebuild pending.\n',encoding='utf-8')
          PY
      - name: Commit synchronized source artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html article/3passive.tex bare_jrnl.tex \
            egbib_20260728_vehicle_reflection_obstacle.bib egbib_merged_20260711.bib \
            updates/2026-07-28-vehicle-reflection-obstacle-localization.md \
            updates/2026-07-28-vehicle-reflection-source-validation.txt
          git commit -m "Integrate vehicle-reflection NLOS source artifacts"
          git push origin master
