name: Diagnose vehicle-reflection integration preflight
on:
  push:
    branches: [master]
    paths:
      - updates/TRIGGER_2026-07-28_VEHICLE_REFLECTION_PREFLIGHT.md
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, traceback
          out=[]
          try:
              title="Feasibility study of non-line-of-sight obstacle location estimation using reflected images from in-vehicle sensors"
              doi="10.1016/j.iatssr.2026.02.007"
              key="shengVehicleReflectionObstacle2026"
              kozawa="Estimating the 3D Position of Hidden Humans Using Reflections on Vehicle Bodies"
              readme=Path('README.md').read_text(encoding='utf-8')
              out.append(f'readme_absent={title not in readme and doi not in readme}')
              lines=readme.splitlines(keepends=True)
              out.append(f'readme_row={[i for i,l in enumerate(lines) if l.startswith("| 2026 |") and kozawa in l]}')
              out.append(f'readme_timeline={[i for i,l in enumerate(lines) if l.lstrip().startswith("│     Kozawa et al.:") and "vehicle" in l.lower()]}')
              index=Path('index.html').read_text(encoding='utf-8')
              out.append(f'index_absent={title not in index and doi not in index}')
              out.append(f'index_object={[i for i,l in enumerate(index.splitlines()) if kozawa in l and "{cat:" in l]}')
              m=re.search(r'(<div class="tl"><div class="year">2026</div><div class="tl-body"><strong>.*?<p>)(.*?)(</p></div></div>)',index,re.S)
              out.append(f'index_2026_timeline={bool(m)}')
              passive=Path('article/3passive.tex').read_text(encoding='utf-8')
              anchor='The output is task-oriented passive NLOS localization rather than a complete hidden image or surface reconstruction.'
              out.append(f'passive_key_absent={key not in passive}')
              out.append(f'passive_anchor={anchor in passive}')
              out.append(f'supplement_absent={not Path("egbib_20260728_vehicle_reflection_obstacle.bib").exists()}')
              tex=Path('bare_jrnl.tex').read_text(encoding='utf-8')
              out.append(f'tex_anchor={"%% bare_jrnl.tex\\n" in tex}')
          except Exception:
              out.append(traceback.format_exc())
          Path('updates/2026-07-28-vehicle-reflection-preflight-diagnostic.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/2026-07-28-vehicle-reflection-preflight-diagnostic.txt
          git commit -m "Record vehicle-reflection integration preflight"
          git push origin master
