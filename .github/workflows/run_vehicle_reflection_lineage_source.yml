name: Run vehicle-reflection lineage source update
on:
  push:
    branches: [master]
    paths:
      - updates/TRIGGER_2026-07-28_VEHICLE_REFLECTION_MINIMAL.md
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          python scripts/integrate_vehicle_reflection_lineage.py
          python - <<'PY'
          from pathlib import Path
          p=Path('updates/2026-07-28-vehicle-reflection-nlos-lineage.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('The PDF is rebuilt and validated by the guarded workflow before the final integration commit is made.','PDF compilation is staged separately and is not claimed by this source-integration commit.')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html article/3passive.tex bare_jrnl.tex egbib_merged_20260711.bib updates/2026-07-28-vehicle-reflection-nlos-lineage.md
          git commit -m "Integrate automotive vehicle-reflection NLOS lineage sources"
          git push origin master
