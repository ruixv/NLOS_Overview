name: Integrate July 2026 NLOS citation-trace papers

on:
  push:
    branches: [master]
    paths:
      - scripts/run_ris_nlos_doa.py
      - scripts/run_adaptive_windowing_nlos.py
      - .github/workflows/integrate-visapp2026-passive-nlos.yml
  pull_request:
    branches: [master]
    paths:
      - .github/nlos-ris-final-venue-trigger.md
      - updates/TRIGGER_2026-07-27_ADAPTIVE_WINDOWING.md
      - scripts/run_ris_nlos_doa.py
      - scripts/run_adaptive_windowing_nlos.py
      - .github/workflows/integrate-visapp2026-passive-nlos.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-july2026-nlos-citation-trace
  cancel-in-progress: true

jobs:
  integrate-build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fail-closed literature corrections
        id: integrate
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/run_ris_nlos_doa.py 2>&1 | tee /tmp/ris_nlos_integration.log
          python3 scripts/run_adaptive_windowing_nlos.py 2>&1 | tee /tmp/adaptive_windowing_integration.log
          python3 -m py_compile scripts/run_ris_nlos_doa.py scripts/run_adaptive_windowing_nlos.py

      - name: Preserve source-integration diagnostics
        if: steps.integrate.outcome != 'success'
        run: |
          mkdir -p updates
          {
            echo '# NLOS source-integration failure'
            echo
            echo '## RIS correction'
            echo '```text'
            cat /tmp/ris_nlos_integration.log || true
            echo '```'
            echo
            echo '## Adaptive-windowing integration'
            echo '```text'
            cat /tmp/adaptive_windowing_integration.log || true
            echo '```'
          } > updates/2026-07-27_nlos_integration_failure.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/2026-07-27_nlos_integration_failure.md
          git commit -m 'Record NLOS source-integration diagnostics' || true
          target_branch="${GITHUB_HEAD_REF:-master}"
          git push origin "HEAD:${target_branch}" || true
          exit 1

      - name: Add bookmark compatibility shim for current TeX Live
        if: steps.integrate.outcome == 'success'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('bare_jrnl.tex')
          text = path.read_text(encoding='utf-8')
          shim = "\\makeatletter\n\\providecommand{\\HyperLocalCurrentHref}{\\@currentHref}\n\\makeatother\n"
          if shim not in text:
              anchor = "\\usepackage{hyperref}\n"
              if text.count(anchor) != 1:
                  raise RuntimeError('hyperref package anchor is not unique')
              text = text.replace(anchor, anchor + shim, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Clean generated LaTeX files
        if: steps.integrate.outcome == 'success'
        run: rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.fdb_latexmk bare_jrnl.fls bare_jrnl.log bare_jrnl.out bare_jrnl.toc bare_jrnl.pdf

      - name: Build survey with TeX Live container
        if: steps.integrate.outcome == 'success'
        id: latex
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: bare_jrnl.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Preserve failed-build diagnostics
        if: steps.integrate.outcome == 'success' && steps.latex.outcome != 'success'
        run: |
          mkdir -p updates
          {
            echo '# Adaptive-windowing NLOS survey build failure'
            echo
            echo 'The source transformation completed, but the LaTeX build failed.'
            echo
            echo '```text'
            if test -f bare_jrnl.log; then tail -n 300 bare_jrnl.log; else echo 'bare_jrnl.log was not generated'; fi
            echo '```'
          } > updates/2026-07-27_adaptive_windowing_build_failure.md
          git diff -- README.md index.html article/2active.tex bare_jrnl.tex egbib_merged_20260711.bib > updates/2026-07-27_adaptive_windowing_source.diff
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/2026-07-27_adaptive_windowing_build_failure.md updates/2026-07-27_adaptive_windowing_source.diff
          git commit -m 'Record adaptive-windowing LaTeX build diagnostics' || true
          target_branch="${GITHUB_HEAD_REF:-master}"
          git push origin "HEAD:${target_branch}" || true
          exit 1

      - name: Validate metadata, citations, PDF, and cross-artifact coverage
        if: steps.latex.outcome == 'success'
        run: |
          test -s bare_jrnl.pdf
          python3 - <<'PY'
          import re
          from pathlib import Path
          files = {
              'README': Path('README.md').read_text(encoding='utf-8'),
              'website': Path('index.html').read_text(encoding='utf-8'),
              'active': Path('article/2active.tex').read_text(encoding='utf-8'),
              'modalities': Path('article/5newscenes.tex').read_text(encoding='utf-8'),
              'bib': Path('egbib_merged_20260711.bib').read_text(encoding='utf-8'),
              'bbl': Path('bare_jrnl.bbl').read_text(encoding='utf-8', errors='ignore'),
              'log': Path('bare_jrnl.log').read_text(encoding='utf-8', errors='ignore'),
          }
          adaptive_doi = '10.1364/OE.575419'
          adaptive_key = 'miaoAdaptiveWindowingNLOS2025'
          adaptive_title = 'Adaptive windowing for photon-efficient non-line-of-sight imaging under high ambient light'
          for label in ('README', 'website', 'bib'):
              assert adaptive_doi in files[label], f'{label} missing adaptive-windowing DOI'
          assert files['README'].count(adaptive_title) == 1, 'README adaptive record missing or duplicated'
          assert files['website'].count('title:"' + adaptive_title + '"') == 1, 'website adaptive record missing or duplicated'
          assert files['active'].count(adaptive_key) >= 2, 'active survey must cite adaptive windowing in table and prose'
          assert files['bib'].count('{' + adaptive_key + ',') == 1, 'adaptive BibTeX key missing or duplicated'
          assert files['bib'].lower().count(adaptive_doi.lower()) == 2, 'adaptive DOI/url fields incomplete or duplicated'
          assert 'adaptive windowing' in files['bbl'].lower(), 'adaptive-windowing entry absent from compiled bibliography'
          assert not re.search(r'Citation.*undefined|undefined citations', files['log'], re.I), 'undefined citation remains'
          for doi, key in (
              ('10.1109/MAPCON61407.2024.10923061', 'yasmeenAroundCornerRIS2024'),
              ('10.1109/RadarConf2559087.2025.11205052', 'yasmeenDualBeamRIS2026'),
          ):
              assert doi in files['README'] and doi in files['website'] and doi in files['bib'], f'RIS final venue missing: {doi}'
              assert key in files['modalities'], f'RIS survey citation missing: {key}'
          count = len(re.findall(r'\{cat:"', files['website']))
          assert f'<div class="stat"><b>{count}</b><span>tracked latest entries</span></div>' in files['website'], 'website counter mismatch'
          assert Path('bare_jrnl.bbl').stat().st_size > 1000, 'bibliography output is unexpectedly small'
          assert Path('bare_jrnl.pdf').stat().st_size > 100000, 'rebuilt PDF is unexpectedly small'
          print(f'NLOS citation-trace validation passed; website tracks {count} unique entries')
          PY

      - name: Render first and last PDF pages for visual preflight
        if: steps.latex.outcome == 'success'
        run: |
          if command -v pdftoppm >/dev/null 2>&1 && command -v pdfinfo >/dev/null 2>&1; then
            pages=$(pdfinfo bare_jrnl.pdf | awk '/^Pages:/ {print $2}')
            test "$pages" -gt 0
            mkdir -p /tmp/nlos_pdf_render
            pdftoppm -f 1 -singlefile -png -r 120 bare_jrnl.pdf /tmp/nlos_pdf_render/first
            pdftoppm -f "$pages" -singlefile -png -r 120 bare_jrnl.pdf /tmp/nlos_pdf_render/last
            test -s /tmp/nlos_pdf_render/first.png
            test -s /tmp/nlos_pdf_render/last.png
          fi

      - name: Commit synchronized sources and rebuilt PDF
        if: steps.latex.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html article/2active.tex article/5newscenes.tex bare_jrnl.tex \
            egbib_20260727_adaptive_windowing.bib egbib_merged_20260711.bib bare_jrnl.pdf \
            updates/2026-07-27-adaptive-windowing-nlos.md scripts/run_ris_nlos_doa.py \
            scripts/run_adaptive_windowing_nlos.py .github/workflows/integrate-visapp2026-passive-nlos.yml
          if git diff --cached --quiet; then
            echo 'No source changes were necessary.'
            exit 0
          fi
          git commit -m 'Integrate adaptive-windowing NLOS under ambient light'
          target_branch="${GITHUB_HEAD_REF:-master}"
          git push origin "HEAD:${target_branch}"
