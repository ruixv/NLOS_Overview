name: Integrate July 2026 NLOS citation-trace papers

on:
  push:
    branches: [master]
    paths:
      - scripts/integrate_ris_nlos_doa.py
      - scripts/run_ris_nlos_doa.py
      - .github/workflows/integrate-visapp2026-passive-nlos.yml
  pull_request:
    branches: [master]
    paths:
      - .github/nlos-july2026-citation-trace-trigger.md
      - scripts/integrate_ris_nlos_doa.py
      - scripts/run_ris_nlos_doa.py
      - .github/workflows/integrate-visapp2026-passive-nlos.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-july2026-nlos-citation-trace
  cancel-in-progress: true

jobs:
  integrate-build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fail-closed RIS source integration
        id: integrate
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/run_ris_nlos_doa.py 2>&1 | tee /tmp/ris_nlos_integration.log
          python3 -m py_compile scripts/integrate_ris_nlos_doa.py scripts/run_ris_nlos_doa.py

      - name: Preserve source-integration diagnostics
        if: steps.integrate.outcome != 'success'
        run: |
          mkdir -p updates
          {
            echo '# RIS-assisted NLOS source-integration failure'
            echo
            echo '```text'
            cat /tmp/ris_nlos_integration.log
            echo '```'
          } > updates/2026-07-27_ris_nlos_integration_failure.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/2026-07-27_ris_nlos_integration_failure.md
          git commit -m 'Record RIS-assisted NLOS integration diagnostics' || true
          git push origin HEAD:automation/july27-ris-nlos-doa
          exit 1

      - name: Add bookmark compatibility shim for current TeX Live
        if: steps.integrate.outcome == 'success'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('bare_jrnl.tex')
          text = path.read_text(encoding='utf-8')
          shim = "\\makeatletter\n\\providecommand{\\HyperLocalCurrentHref}{\\@currentHref}\n\\makeatother\n"
          if shim not in text:
              anchor = "\\usepackage{hyperref}\n"
              if text.count(anchor) != 1:
                  raise RuntimeError('hyperref package anchor is not unique')
              text = text.replace(anchor, anchor + shim, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Clean generated LaTeX files
        if: steps.integrate.outcome == 'success'
        run: rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.fdb_latexmk bare_jrnl.fls bare_jrnl.log bare_jrnl.out bare_jrnl.toc bare_jrnl.pdf

      - name: Build survey with TeX Live container
        if: steps.integrate.outcome == 'success'
        id: latex
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: bare_jrnl.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Preserve failed-build diagnostics
        if: steps.integrate.outcome == 'success' && steps.latex.outcome != 'success'
        run: |
          mkdir -p updates
          {
            echo '# RIS-assisted NLOS survey build failure'
            echo
            echo 'The guarded source transformation completed, but the LaTeX build failed. Tail of bare_jrnl.log follows.'
            echo
            echo '```text'
            if test -f bare_jrnl.log; then tail -n 300 bare_jrnl.log; else echo 'bare_jrnl.log was not generated'; fi
            echo '```'
          } > updates/2026-07-27_ris_nlos_build_failure.md
          git diff -- README.md index.html article/5newscenes.tex bare_jrnl.tex egbib_merged_20260711.bib > updates/2026-07-27_ris_nlos_source.diff
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/2026-07-27_ris_nlos_build_failure.md updates/2026-07-27_ris_nlos_source.diff
          git commit -m 'Record RIS-assisted NLOS LaTeX build diagnostics' || true
          git push origin HEAD:automation/july27-ris-nlos-doa
          exit 1

      - name: Validate citations, metadata, PDF, and cross-artifact coverage
        if: steps.latex.outcome == 'success'
        run: |
          test -s bare_jrnl.pdf
          ! grep -Eqi 'undefined citations|Citation .* undefined|There were undefined references' bare_jrnl.log
          python3 - <<'PY'
          from pathlib import Path
          files = {
              'README': Path('README.md').read_text(encoding='utf-8'),
              'website': Path('index.html').read_text(encoding='utf-8'),
              'modalities': Path('article/5newscenes.tex').read_text(encoding='utf-8'),
              'bib': Path('egbib_merged_20260711.bib').read_text(encoding='utf-8'),
          }
          records = {
              '10.1016/j.sigpro.2025.109934': 'yuanRISGridlessDoA2025',
              '10.1016/j.sigpro.2026.110685': 'zhangRISMonostaticDOA2026',
          }
          for doi, key in records.items():
              for label in ('README', 'website', 'bib'):
                  assert doi in files[label], f'{label} missing {doi}'
              assert files['bib'].lower().count(doi.lower()) == 2, f'duplicate or incomplete DOI fields: {doi}'
              assert files['bib'].count('{' + key + ',') == 1, f'bibliography key mismatch: {key}'
              assert files['modalities'].count(key) >= 1, f'modalities survey missing {key}'
          bbl = Path('bare_jrnl.bbl').read_text(encoding='utf-8', errors='ignore').lower()
          for token in ('yuan', 'steering vector decoupling', 'root-music'):
              assert token in bbl or token in files['modalities'].lower(), f'missing compiled/source token: {token}'
          assert Path('bare_jrnl.pdf').stat().st_size > 100000, 'rebuilt PDF is unexpectedly small'
          print('RIS cross-artifact, bibliography, and PDF validation passed')
          PY

      - name: Render first and last PDF pages for visual preflight
        if: steps.latex.outcome == 'success'
        run: |
          if command -v pdftoppm >/dev/null 2>&1 && command -v pdfinfo >/dev/null 2>&1; then
            pages=$(pdfinfo bare_jrnl.pdf | awk '/^Pages:/ {print $2}')
            test "$pages" -gt 0
            mkdir -p /tmp/nlos_pdf_render
            pdftoppm -f 1 -singlefile -png -r 120 bare_jrnl.pdf /tmp/nlos_pdf_render/first
            pdftoppm -f "$pages" -singlefile -png -r 120 bare_jrnl.pdf /tmp/nlos_pdf_render/last
            test -s /tmp/nlos_pdf_render/first.png
            test -s /tmp/nlos_pdf_render/last.png
          fi

      - name: Commit synchronized sources and rebuilt PDF
        if: steps.latex.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html article/5newscenes.tex bare_jrnl.tex egbib_merged_20260711.bib bare_jrnl.pdf \
            scripts/integrate_ris_nlos_doa.py scripts/run_ris_nlos_doa.py .github/workflows/integrate-visapp2026-passive-nlos.yml
          if git diff --cached --quiet; then
            echo 'No source changes were necessary.'
            exit 0
          fi
          git commit -m 'Integrate RIS-assisted NLOS direction estimation'
          git push origin HEAD:master
