name: Integrate July 2026 NLOS citation-trace papers

on:
  push:
    branches: [master]
    paths:
      - scripts/run_ris_nlos_doa.py
      - .github/workflows/integrate-visapp2026-passive-nlos.yml
  pull_request:
    branches: [master]
    paths:
      - .github/nlos-ris-final-venue-trigger.md
      - scripts/run_ris_nlos_doa.py
      - .github/workflows/integrate-visapp2026-passive-nlos.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-july2026-nlos-citation-trace
  cancel-in-progress: true

jobs:
  integrate-build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fail-closed RIS final-venue correction
        id: integrate
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/run_ris_nlos_doa.py 2>&1 | tee /tmp/ris_nlos_integration.log
          python3 -m py_compile scripts/run_ris_nlos_doa.py

      - name: Preserve source-integration diagnostics
        if: steps.integrate.outcome != 'success'
        run: |
          mkdir -p updates
          {
            echo '# RIS final-venue source-integration failure'
            echo
            echo '```text'
            cat /tmp/ris_nlos_integration.log
            echo '```'
          } > updates/2026-07-27_ris_final_venue_failure.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/2026-07-27_ris_final_venue_failure.md
          git commit -m 'Record RIS final-venue integration diagnostics' || true
          git push origin HEAD:automation/july27-ris-final-venues
          exit 1

      - name: Add bookmark compatibility shim for current TeX Live
        if: steps.integrate.outcome == 'success'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('bare_jrnl.tex')
          text = path.read_text(encoding='utf-8')
          shim = "\\makeatletter\n\\providecommand{\\HyperLocalCurrentHref}{\\@currentHref}\n\\makeatother\n"
          if shim not in text:
              anchor = "\\usepackage{hyperref}\n"
              if text.count(anchor) != 1:
                  raise RuntimeError('hyperref package anchor is not unique')
              text = text.replace(anchor, anchor + shim, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Clean generated LaTeX files
        if: steps.integrate.outcome == 'success'
        run: rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.fdb_latexmk bare_jrnl.fls bare_jrnl.log bare_jrnl.out bare_jrnl.toc bare_jrnl.pdf

      - name: Build survey with TeX Live container
        if: steps.integrate.outcome == 'success'
        id: latex
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: bare_jrnl.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Preserve failed-build diagnostics
        if: steps.integrate.outcome == 'success' && steps.latex.outcome != 'success'
        run: |
          mkdir -p updates
          {
            echo '# RIS final-venue survey build failure'
            echo
            echo 'The source transformation completed, but the LaTeX build failed.'
            echo
            echo '```text'
            if test -f bare_jrnl.log; then tail -n 300 bare_jrnl.log; else echo 'bare_jrnl.log was not generated'; fi
            echo '```'
          } > updates/2026-07-27_ris_final_venue_build_failure.md
          git diff -- README.md index.html article/5newscenes.tex bare_jrnl.tex egbib_merged_20260711.bib > updates/2026-07-27_ris_final_venue_source.diff
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/2026-07-27_ris_final_venue_build_failure.md updates/2026-07-27_ris_final_venue_source.diff
          git commit -m 'Record RIS final-venue LaTeX build diagnostics' || true
          git push origin HEAD:automation/july27-ris-final-venues
          exit 1

      - name: Validate metadata, citations, PDF, and cross-artifact coverage
        if: steps.latex.outcome == 'success'
        run: |
          test -s bare_jrnl.pdf
          python3 - <<'PY'
          import re
          from pathlib import Path
          files = {
              'README': Path('README.md').read_text(encoding='utf-8'),
              'website': Path('index.html').read_text(encoding='utf-8'),
              'modalities': Path('article/5newscenes.tex').read_text(encoding='utf-8'),
              'bib': Path('egbib_merged_20260711.bib').read_text(encoding='utf-8'),
              'bbl': Path('bare_jrnl.bbl').read_text(encoding='utf-8', errors='ignore'),
              'log': Path('bare_jrnl.log').read_text(encoding='utf-8', errors='ignore'),
          }
          records = {
              '10.1109/MAPCON61407.2024.10923061': 'yasmeenAroundCornerRIS2024',
              '10.1109/RadarConf2559087.2025.11205052': 'yasmeenDualBeamRIS2026',
          }
          for doi, key in records.items():
              for label in ('README', 'website', 'bib'):
                  assert doi in files[label], f'{label} missing {doi}'
              assert files['bib'].lower().count(doi.lower()) == 2, f'duplicate or incomplete DOI fields: {doi}'
              assert files['bib'].count('{' + key + ',') == 1, f'bibliography key mismatch: {key}'
              assert key in files['modalities'], f'modalities survey missing {key}'
          for stale in ('https://arxiv.org/abs/2602.11471', 'https://arxiv.org/abs/2602.11473'):
              assert stale not in files['README'] + files['website'] + files['modalities'], f'stale public preprint link: {stale}'
          assert files['README'].count('Geometry-Constrained Non-Line-of-Sight Imaging') == 1
          assert files['website'].count('title:"Geometry-Constrained Non-Line-of-Sight Imaging"') == 1
          count = len(re.findall(r'\{cat:"', files['website']))
          assert f'<div class="stat"><b>{count}</b><span>tracked latest entries</span></div>' in files['website']
          assert 'Around-the-Corner Radar Sensing' in files['bbl']
          assert 'Dual-Beam Reconfigurable Intelligent Surface' in files['bbl']
          assert not re.search(r'Citation.*undefined|undefined citations', files['log'], re.I)
          assert Path('bare_jrnl.pdf').stat().st_size > 100000
          print(f'RIS final-venue validation passed; website tracks {count} unique entries')
          PY

      - name: Render first and last PDF pages for visual preflight
        if: steps.latex.outcome == 'success'
        run: |
          if command -v pdftoppm >/dev/null 2>&1 && command -v pdfinfo >/dev/null 2>&1; then
            pages=$(pdfinfo bare_jrnl.pdf | awk '/^Pages:/ {print $2}')
            test "$pages" -gt 0
            mkdir -p /tmp/nlos_pdf_render
            pdftoppm -f 1 -singlefile -png -r 120 bare_jrnl.pdf /tmp/nlos_pdf_render/first
            pdftoppm -f "$pages" -singlefile -png -r 120 bare_jrnl.pdf /tmp/nlos_pdf_render/last
            test -s /tmp/nlos_pdf_render/first.png
            test -s /tmp/nlos_pdf_render/last.png
          fi

      - name: Commit synchronized sources and rebuilt PDF
        if: steps.latex.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html article/5newscenes.tex bare_jrnl.tex egbib_merged_20260711.bib bare_jrnl.pdf scripts/run_ris_nlos_doa.py .github/workflows/integrate-visapp2026-passive-nlos.yml
          if git diff --cached --quiet; then
            echo 'No source changes were necessary.'
            exit 0
          fi
          git commit -m 'Correct RIS radar papers to final IEEE venues'
          target_branch="${GITHUB_HEAD_REF:-master}"
          git push origin "HEAD:${target_branch}"
