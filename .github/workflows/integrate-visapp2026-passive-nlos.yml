name: Integrate VISAPP 2026 passive NLOS papers

on:
  push:
    branches: [master]
    paths:
      - scripts/integrate_visapp2026_passive_nlos.py
      - scripts/run_visapp2026_passive_nlos.py
      - .github/workflows/integrate-visapp2026-passive-nlos.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-visapp2026-passive-nlos
  cancel-in-progress: false

jobs:
  integrate-build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LaTeX and PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science bibtex-extra poppler-utils

      - name: Apply fail-closed source integration
        run: python3 scripts/run_visapp2026_passive_nlos.py

      - name: Clean-build survey PDF
        run: |
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex

      - name: Validate citations, metadata, PDF, and cross-artifact coverage
        run: |
          test -s bare_jrnl.pdf
          pdfinfo bare_jrnl.pdf | grep -E '^Pages:[[:space:]]+[1-9][0-9]*$'
          pdftotext bare_jrnl.pdf /tmp/bare_jrnl.txt
          ! grep -Eqi 'undefined citations|Citation .* undefined|There were undefined references' bare_jrnl.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          files = {
              'README': Path('README.md').read_text(encoding='utf-8'),
              'website': Path('index.html').read_text(encoding='utf-8'),
              'survey': Path('article/3passive.tex').read_text(encoding='utf-8'),
              'bib': Path('egbib_merged_20260711.bib').read_text(encoding='utf-8'),
          }
          dois = ['10.5220/0014435000004084', '10.5220/0014434900004084']
          for label in ('README', 'website', 'bib'):
              for doi in dois:
                  assert doi in files[label], f'{label} missing {doi}'
          for doi in dois:
              assert files['bib'].lower().count(doi.lower()) == 2, f'duplicate or incomplete DOI fields: {doi}'
          for key in ['matsubaraJointThermalNLOS2026', 'kozawaVehicleReflectionNLOS2026']:
              assert files['bib'].count('@inproceedings{' + key + ',') == 1
              assert files['survey'].count(key) >= 2
          pdf = Path('/tmp/bare_jrnl.txt').read_text(encoding='utf-8', errors='ignore')
          pdf = re.sub(r'\s+', ' ', pdf.replace('\u00ad', '').replace('-\n', '')).lower()
          for token in ('matsubara', 'kozawa', 'opportunistic nlos mirrors'):
              assert token in pdf, f'PDF text is missing {token}'
          print('Cross-artifact, bibliography, and PDF validation passed')
          PY

      - name: Commit synchronized sources and rebuilt PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html article/0abstract.tex article/3passive.tex bare_jrnl.tex \
            egbib_merged_20260711.bib bare_jrnl.pdf
          if git diff --cached --quiet; then
            echo 'No source changes were necessary.'
            exit 0
          fi
          git commit -m 'Integrate passive thermal and specular-reflection NLOS sensing'
          git push origin HEAD:master
