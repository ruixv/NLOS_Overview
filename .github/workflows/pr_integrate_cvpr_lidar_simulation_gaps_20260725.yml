name: Validate and materialize NLOS cross-artifact update

on:
  pull_request:
    branches: [master]
    paths:
      - updates/pr-trigger-cvpr-lidar-simulation-gaps-20260725.txt

permissions:
  contents: write

jobs:
  synchronize-build-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            texlive-publishers texlive-science texlive-bibtex-extra poppler-utils

      - name: Apply guarded update
        run: python3 scripts/integrate_cvpr_lidar_simulation_gaps_20260725.py

      - name: Validate source consistency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          titles = [
              'Seeing through boxes: Non-Line-of-Sight 3D Reconstruction from Radar Signals',
              'DENALI: A Dataset Enabling Non-Line-of-Sight Spatial Reasoning with Low-Cost LiDARs',
              'Fast non-line-of-sight transient data simulation and an open benchmark dataset',
          ]
          keys = ['luSeeingThroughBoxes2026','behariDENALI2026','shiFastNLOSTransientSimulation2025']
          readme = Path('README.md').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')
          radar = Path('article/5newscenes.tex').read_text(encoding='utf-8')
          data = Path('article/4datadriven.tex').read_text(encoding='utf-8')
          bib = Path('egbib_merged_20260711.bib').read_text(encoding='utf-8')
          for title in titles:
              assert readme.lower().count(title.lower()) == 1, title
              assert index.lower().count(title.lower()) == 1, title
          for key in keys:
              assert len(re.findall(r'(?mi)^@\w+\{' + re.escape(key) + r',', bib)) == 1, key
          assert r'\cite{luSeeingThroughBoxes2026}' in radar
          assert r'\cite{behariDENALI2026}' in radar
          assert r'\cite{shiFastNLOSTransientSimulation2025}' in data
          print('Source consistency validation passed.')
          PY

      - name: Clean-build survey
        run: |
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc bare_jrnl.pdf
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex

      - name: Validate PDF and citations
        run: |
          test -s bare_jrnl.pdf
          for key in luSeeingThroughBoxes2026 behariDENALI2026 shiFastNLOSTransientSimulation2025; do
            grep -Fq "\\bibitem{$key}" bare_jrnl.bbl
          done
          ! grep -Eq 'Citation .* undefined|There were undefined citations|multiply defined' bare_jrnl.log
          pdfinfo bare_jrnl.pdf | tee /tmp/pdfinfo.txt
          pages=$(awk '/^Pages:/ {print $2}' /tmp/pdfinfo.txt)
          test -n "$pages" && test "$pages" -gt 0
          pdftotext bare_jrnl.pdf /tmp/survey.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('/tmp/survey.txt').read_text(encoding='utf-8', errors='ignore').lower()
          normalized = re.sub(r'[^a-z0-9]+', '', text)
          required = ('seeingthroughboxes', 'denali', 'fastnonlineofsighttransientdatasimulation')
          missing = [term for term in required if term not in normalized]
          assert not missing, missing
          print('Normalized PDF text validation passed.')
          PY
          rm -rf /tmp/render && mkdir -p /tmp/render
          pdftoppm -png -r 60 bare_jrnl.pdf /tmp/render/page >/dev/null 2>&1
          rendered=$(find /tmp/render -type f -name 'page-*.png' -size +0c | wc -l)
          test "$rendered" -eq "$pages"

      - name: Commit generated update to PR branch
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html article/5newscenes.tex bare_jrnl.tex bare_jrnl.pdf updates/2026-07-25-cvpr-radar-lidar-simulation-gaps.md
          if git diff --cached --quiet; then
            echo 'No generated update was needed.'
            exit 0
          fi
          git commit -m 'Integrate CVPR radar, LiDAR, and transient benchmark gaps [skip ci]'
          git push origin HEAD:${TARGET_BRANCH}
