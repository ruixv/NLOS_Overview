name: Diagnose measured multipath radar recognition synchronizer

on:
  pull_request:
    branches: [master]
    paths:
      - updates/2026-07-26-radar-recognition-debug-trigger.md
      - scripts/sync_nlos_radar_recognition_20260726_v2.py

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/radar-recognition-20260726
          fetch-depth: 1
      - name: Run synchronizer with compact diagnostics
        run: python3 scripts/sync_nlos_radar_recognition_20260726_v2.py
