name: Integrate semantic and passive NLOS citation gaps

on:
  push:
    branches: [master]
    paths:
      - updates/semantic_passive_gaps_20260815.trigger

permissions:
  contents: write

concurrency:
  group: integrate-semantic-passive-gaps-20260815
  cancel-in-progress: false

jobs:
  integrate-build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Install bibliography dependency
        run: python3 -m pip install --user bibtexparser

      - name: Apply synchronized source integration
        run: |
          python3 -m py_compile scripts/integrate_semantic_passive_gaps_20260815.py
          python3 scripts/integrate_semantic_passive_gaps_20260815.py
          python3 scripts/merge_nlos_bibliography.py
          rm -f egbib_20260815_semantic_passive_gaps.bib

      - name: Install LaTeX and PDF validation tools
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get -o Acquire::Retries=5 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-pictures texlive-publishers \
            ghostscript poppler-utils

      - name: Cleanly rebuild survey PDF
        run: |
          old_hash=$(git hash-object bare_jrnl.pdf)
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          new_hash=$(git hash-object bare_jrnl.pdf)
          echo "PDF blob: $old_hash -> $new_hash"
          test "$old_hash" != "$new_hash"

      - name: Validate public artifacts and survey consistency
        shell: bash
        run: |
          set -euo pipefail
          spotlight='Learning-Based Spotlight Position Optimization for Non-Line-of-Sight Human Localization and Posture Classification'
          passive='Deep-Learning-Based Real-Time Passive Non-Line-of-Sight Imaging for Room-Scale Scenes'
          multipose='Non-line-of-sight multi-person pose sensing'
          skey='chandranSpotlightWACV2024'
          pkey='liUSEENPassiveNLOS2024'
          hkey='houMultiPersonPose2025'

          # The two genuinely new papers must appear exactly once in public listings.
          test "$(grep -F -c "$spotlight" README.md)" -eq 1
          test "$(grep -F -c "$passive" README.md)" -eq 1
          test "$(grep -F -c "title:\"$spotlight\"" data/papers-source.html)" -eq 1
          test "$(grep -F -c "title:\"$passive\"" data/papers-source.html)" -eq 1

          # Hou et al. was already public; only require continued presence while repairing survey coverage.
          grep -F -q "$multipose" README.md
          grep -F -q "title:\"$multipose\"" data/papers-source.html

          # Literal-key checks avoid regex escaping mistakes while still detecting duplicates.
          test "$(grep -F -c "{$skey," egbib_merged_20260711.bib)" -eq 1
          test "$(grep -F -c "{$pkey," egbib_merged_20260711.bib)" -eq 1
          test "$(grep -F -c "{$hkey," egbib_merged_20260711.bib)" -eq 1
          grep -F -q '10.1109/WACV57701.2024.00417' egbib_merged_20260711.bib
          grep -F -q '10.3390/s24196480' egbib_merged_20260711.bib
          grep -F -q '10.1364/OE.570120' egbib_merged_20260711.bib

          grep -F -q "$skey" article/2active.tex
          grep -F -q "$hkey" article/2active.tex
          grep -F -q "$skey" article/4datadriven.tex
          grep -F -q "$hkey" article/4datadriven.tex
          grep -F -q "$pkey" article/3passive.tex
          grep -F -q "$skey" bare_jrnl.aux
          grep -F -q "$pkey" bare_jrnl.aux
          grep -F -q "$hkey" bare_jrnl.aux
          grep -F -q "$skey" bare_jrnl.bbl
          grep -F -q "$pkey" bare_jrnl.bbl
          grep -F -q "$hkey" bare_jrnl.bbl

          grep -F -q 'data/papers-source.html' assets/paper-graph-data.js
          ! grep -E -q 'Citation .* undefined|There were undefined citations|Repeated entry' bare_jrnl.log

          pdfinfo bare_jrnl.pdf | grep -q '^Pages:'
          pdftotext -layout bare_jrnl.pdf bare_jrnl.txt
          python3 - <<'PY'
          from pathlib import Path
          text = ''.join(ch for ch in Path('bare_jrnl.txt').read_text(errors='ignore').lower() if ch.isalnum())
          needles = [
              'spotlightpositionoptimization',
              'useen',
              'multipersonposesensing',
          ]
          missing = [n for n in needles if n not in text]
          print('PDF semantic checks:', 'ok' if not missing else f'missing {missing}')
          if missing:
              raise SystemExit(1)
          PY
          pages=$(pdfinfo bare_jrnl.pdf | awk '/^Pages:/ {print $2}')
          mkdir -p .pdf_render_check
          pdftoppm -f 1 -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/first >/dev/null 2>&1
          pdftoppm -f "$pages" -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/last >/dev/null 2>&1
          test -s .pdf_render_check/first.png
          test -s .pdf_render_check/last.png
          rm -rf .pdf_render_check bare_jrnl.txt

      - name: Commit and push validated public artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/papers-source.html article/2active.tex article/3passive.tex \
            article/4datadriven.tex bare_jrnl.tex egbib_merged_20260711.bib bare_jrnl.pdf \
            updates/2026-08-15-semantic-passive-gap.md
          git add -u egbib_20260815_semantic_passive_gaps.bib
          if git diff --cached --quiet; then
            echo "No generated public-artifact changes to commit"
            exit 1
          fi
          git commit -m "Integrate missing semantic and passive NLOS lineage"
          git push origin HEAD:master
