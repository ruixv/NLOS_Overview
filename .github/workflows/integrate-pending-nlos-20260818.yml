name: Integrate pending and citation-traced NLOS records

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/integrate-pending-nlos-20260818.yml'
      - 'scripts/integrate_backscatter_limits_20260818.py'
      - 'scripts/integrate_acoustic_liveness_20260818.py'

permissions:
  contents: write

jobs:
  integrate-build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Integrate verified ICPR citation-trace record
        run: |
          set -euo pipefail
          # The 18-Aug backscatter/acoustic records are already public on master
          # (commit 2788e5e); do not rerun their one-shot provenance validators.
          python scripts/integrate_nlos_mt_20260820.py

      - name: Validate synchronized source artifacts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '2607.03459' README.md
          grep -Fq '10.1109/ACCESS.2026.3692353' README.md
          grep -Fq '10.1007/978-3-032-31666-0_20' README.md
          grep -Fq '**Update run: 20 August 2026.**' README.md
          grep -Fq '2607.03459' data/papers-source.html
          grep -Fq '10.1109/ACCESS.2026.3692353' data/papers-source.html
          grep -Fq '10.1007/978-3-032-31666-0_20' data/papers-source.html
          grep -Fq 'yigitlerAmbientIoTBackscatter2026' article/5newscenes.tex
          grep -Fq 'cetinAcousticLivenessNLOS2026' article/5newscenes.tex
          grep -Fq 'jinNLOSMT2026' article/4datadriven.tex
          test "$(grep -Fic '{yigitlerAmbientIoTBackscatter2026,' egbib_merged_20260711.bib)" -eq 1
          test "$(grep -Fic '{cetinAcousticLivenessNLOS2026,' egbib_merged_20260711.bib)" -eq 1
          test "$(grep -Fic '{jinNLOSMT2026,' egbib_merged_20260711.bib)" -eq 1
          grep -Fq 'through 20 August 2026.' bare_jrnl.tex
          grep -Fq 'Updated 20 Aug 2026' index.html
          grep -Fq 'Updated 20 August 2026' data/papers-source.html
          grep -Fq 'Last updated: 20 August 2026' data/papers-source.html

      - name: Install LaTeX and PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            texlive-publishers texlive-science poppler-utils

      - name: Clean-build survey PDF
        shell: bash
        run: |
          set -euo pipefail
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          test -s bare_jrnl.pdf
          if grep -Eiq 'undefined citations|Citation .* undefined|There were undefined references|multiply defined' bare_jrnl.log; then
            echo 'LaTeX consistency check failed.' >&2
            grep -Ein 'undefined citations|Citation .* undefined|There were undefined references|multiply defined' bare_jrnl.log >&2 || true
            exit 1
          fi

      - name: Validate citations and PDF semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'yigitlerAmbientIoTBackscatter2026' bare_jrnl.aux
          grep -Fq 'cetinAcousticLivenessNLOS2026' bare_jrnl.aux
          grep -Fq 'jinNLOSMT2026' bare_jrnl.aux
          grep -Fq '\bibitem{yigitlerAmbientIoTBackscatter2026}' bare_jrnl.bbl
          grep -Fq '\bibitem{cetinAcousticLivenessNLOS2026}' bare_jrnl.bbl
          grep -Fq '\bibitem{jinNLOSMT2026}' bare_jrnl.bbl
          pdftotext -layout bare_jrnl.pdf /tmp/nlos-survey.txt
          python - <<'PY'
          from pathlib import Path
          import re

          raw = Path('/tmp/nlos-survey.txt').read_text(errors='ignore')
          raw = re.sub(r'-\s*\n\s*', '', raw)
          text = re.sub(r'\s+', ' ', raw).casefold()
          for token in ('backscatter', 'acoustic', 'multichannel', 'nlos-mt', 'mamba', '20 august 2026'):
              assert token in text, f'missing PDF smoke-test token: {token}'
          PY

      - name: Render-check first and last PDF pages
        shell: bash
        run: |
          set -euo pipefail
          pages="$(pdfinfo bare_jrnl.pdf | awk '/^Pages:/ {print $2}')"
          test -n "$pages"
          pdftoppm -f 1 -singlefile -png -r 90 bare_jrnl.pdf /tmp/nlos-first >/dev/null 2>&1
          pdftoppm -f "$pages" -singlefile -png -r 90 bare_jrnl.pdf /tmp/nlos-last >/dev/null 2>&1
          test -s /tmp/nlos-first.png
          test -s /tmp/nlos-last.png

      - name: Commit synchronized public artifacts and rebuilt PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nlos-update-bot'
          git config user.email 'nlos-update-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No public changes remain to commit.'
            exit 0
          fi
          git commit -m 'Integrate ICPR NLOS-MT hybrid Mamba-Transformer reconstruction'
          git push origin HEAD:master

# PR-triggered guarded integration; extended 2026-08-20 for NLOS-MT.
