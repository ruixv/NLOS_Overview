name: Integrate white-light NLOS precursor

on:
  push:
    branches: [master]
    paths:
      - updates/white_light_nlos_precursor_20260816.trigger

permissions:
  contents: write

concurrency:
  group: integrate-white-light-nlos-precursor-20260816
  cancel-in-progress: false

jobs:
  integrate-build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Install bibliography dependency
        run: python3 -m pip install --user bibtexparser

      - name: Apply synchronized source integration
        run: |
          python3 -m py_compile scripts/integrate_white_light_nlos_precursor_20260816.py
          python3 scripts/integrate_white_light_nlos_precursor_20260816.py
          python3 scripts/merge_nlos_bibliography.py
          rm -f egbib_20260816_white_light_precursor.bib

      - name: Install LaTeX and PDF validation tools
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get -o Acquire::Retries=5 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-pictures texlive-publishers \
            ghostscript poppler-utils

      - name: Cleanly rebuild survey PDF
        run: |
          old_hash=$(git hash-object bare_jrnl.pdf)
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          new_hash=$(git hash-object bare_jrnl.pdf)
          echo "PDF blob: $old_hash -> $new_hash"
          test "$old_hash" != "$new_hash"

      - name: Validate public artifacts and survey consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          title = 'Non-line-of-sight imaging under white-light illumination: a two-step deep learning approach'
          key = 'zhengWhiteLightTwoStepNLOS2021'
          doi = '10.1364/OE.443127'

          checks = {
              'README title': (Path('README.md'), title),
              'canonical corpus title': (Path('data/papers-source.html'), title),
              'passive survey citation': (Path('article/3passive.tex'), key),
              'merged bibliography key': (Path('egbib_merged_20260711.bib'), key),
              'merged bibliography DOI': (Path('egbib_merged_20260711.bib'), doi),
              'resolved aux citation': (Path('bare_jrnl.aux'), key),
              'V2 data source': (Path('assets/paper-graph-data.js'), 'data/papers-source.html'),
          }
          for label, (path, needle) in checks.items():
              text = path.read_text(encoding='utf-8', errors='ignore')
              if needle not in text:
                  raise SystemExit(f'FAILED {label}: {needle!r} not found in {path}')
              print('ok:', label)

          bib = Path('egbib_merged_20260711.bib').read_text(encoding='utf-8', errors='ignore')
          key_entries = re.findall(r'@[A-Za-z]+\{\s*' + re.escape(key) + r'\s*,', bib, flags=re.I)
          if len(key_entries) != 1:
              raise SystemExit(f'FAILED bibliography uniqueness: {len(key_entries)} entries for {key}')
          if bib.lower().count(doi.lower()) != 1:
              raise SystemExit(f'FAILED DOI uniqueness: {bib.lower().count(doi.lower())} occurrences of {doi}')

          log = Path('bare_jrnl.log').read_text(encoding='utf-8', errors='ignore')
          bad = ['There were undefined citations', 'Repeated entry']
          if any(x in log for x in bad) or re.search(r'Citation .* undefined', log):
              raise SystemExit('FAILED LaTeX citation validation')
          print('source/bibliography validation: ok')
          PY

          pdfinfo bare_jrnl.pdf | grep -q '^Pages:'
          pdftotext -layout bare_jrnl.pdf bare_jrnl.txt
          python3 - <<'PY'
          from pathlib import Path
          text = ''.join(ch for ch in Path('bare_jrnl.txt').read_text(errors='ignore').lower() if ch.isalnum())
          # Check robust semantic fragments that are present in survey prose, independent of line wrapping.
          needles = ['whitelight', 'specklecorrelation', 'zheng']
          missing = [n for n in needles if n not in text]
          print('PDF semantic checks:', 'ok' if not missing else f'missing {missing}')
          if missing:
              raise SystemExit(1)
          PY
          pages=$(pdfinfo bare_jrnl.pdf | awk '/^Pages:/ {print $2}')
          mkdir -p .pdf_render_check
          pdftoppm -f 1 -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/first >/dev/null 2>&1
          pdftoppm -f "$pages" -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/last >/dev/null 2>&1
          test -s .pdf_render_check/first.png
          test -s .pdf_render_check/last.png
          rm -rf .pdf_render_check bare_jrnl.txt

      - name: Commit and push validated public artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/papers-source.html article/3passive.tex \
            bare_jrnl.tex egbib_merged_20260711.bib bare_jrnl.pdf \
            updates/2026-08-16-white-light-nlos-precursor.md
          git add -u egbib_20260816_white_light_precursor.bib
          if git diff --cached --quiet; then
            echo "No generated public-artifact changes to commit"
            exit 1
          fi
          git commit -m "Integrate white-light learned NLOS precursor"
          git push origin HEAD:master
