name: Integrate automotive vehicle-reflection NLOS lineage
on:
  push:
    branches: [master]
    paths:
      - updates/TRIGGER_2026-07-28_VEHICLE_REFLECTION_LINEAGE.md
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate and validate source artifacts
        shell: bash
        run: |
          python scripts/integrate_vehicle_reflection_lineage.py
          python - <<'PY'
          from pathlib import Path
          import re
          titles=[
            'NLOS Obstacle Position Estimation from Reflected Image',
            'Estimation of NLOS Obstacle Position Using Reflected Image on Transparent Surface',
            'Object Detection Method for Non-Line-of-Sight Obstacles Reflected on Painted Surfaces',
            'Feasibility study of non-line-of-sight obstacle location estimation using reflected images from in-vehicle sensors',
          ]
          keys=[
            'takatoriReflectedImageNLOS2020',
            'nakamuraTransparentReflectionNLOS2022',
            'oyamaPaintedReflectionDetection2025',
            'shengVehicleReflectionObstacle2026',
          ]
          readme=Path('README.md').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          passive=Path('article/3passive.tex').read_text(encoding='utf-8')
          bib=Path('egbib_merged_20260711.bib').read_text(encoding='utf-8')
          tex=Path('bare_jrnl.tex').read_text(encoding='utf-8')
          for title in titles:
            assert readme.count(title)==1, title
            assert index.count(title)==1, title
          for key in keys:
            assert passive.count(key)==1, key
            assert bib.count(key)==1, key
          for doi in ['10.1109/IV47402.2020.9304553','10.1109/ITSC60802.2025.11423754','10.1016/j.iatssr.2026.02.007']:
            assert bib.lower().count(doi.lower())==1, doi
          assert 'automotive reflected-image passive NLOS lineage synchronized' in tex
          count=len(re.findall(r'\{cat:"',index))
          assert f'<div class="stat"><b>{count}</b><span>tracked latest entries</span></div>' in index
          note=Path('updates/2026-07-28-vehicle-reflection-nlos-lineage.md')
          text=note.read_text(encoding='utf-8')
          text=text.replace('README, the website explorer and timeline, passive-survey prose, and the consolidated bibliography are now synchronized for all four records. The PDF is rebuilt and validated by the guarded workflow before the final integration commit is made.', 'README, the website explorer and timeline, passive-survey prose, and the consolidated bibliography are now synchronized for all four records. PDF compilation is staged separately and is not claimed by this source-integration commit.')
          note.write_text(text,encoding='utf-8')
          Path('updates/2026-07-28-vehicle-reflection-lineage-source-validation.txt').write_text(f'Validated four-paper source synchronization; website entries: {count}; PDF rebuild pending.\n',encoding='utf-8')
          PY
      - name: Commit source synchronization before PDF build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html article/3passive.tex bare_jrnl.tex \
            egbib_merged_20260711.bib updates/2026-07-28-vehicle-reflection-nlos-lineage.md \
            updates/2026-07-28-vehicle-reflection-lineage-source-validation.txt
          git commit -m "Integrate automotive vehicle-reflection NLOS lineage sources"
          git push origin master
      - name: Install LaTeX and PDF validation dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra poppler-utils
      - name: Rebuild and validate survey PDF
        shell: bash
        run: |
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc bare_jrnl.pdf
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          keys=[
            'takatoriReflectedImageNLOS2020',
            'nakamuraTransparentReflectionNLOS2022',
            'oyamaPaintedReflectionDetection2025',
            'shengVehicleReflectionObstacle2026',
          ]
          bbl=Path('bare_jrnl.bbl').read_text(encoding='utf-8',errors='ignore')
          log=Path('bare_jrnl.log').read_text(encoding='utf-8',errors='ignore')
          for key in keys:
            assert key in bbl, key
          assert not re.search(r'Citation.*undefined|undefined citations',log,re.I)
          pdf=Path('bare_jrnl.pdf')
          assert pdf.stat().st_size>100000
          info=subprocess.check_output(['pdfinfo',str(pdf)],text=True)
          pages=int(re.search(r'Pages:\s+(\d+)',info).group(1))
          subprocess.run(['pdftotext',str(pdf),'bare_jrnl.txt'],check=True)
          text=Path('bare_jrnl.txt').read_text(encoding='utf-8',errors='ignore')
          assert 'Vehicle-body reflections as opportunistic automotive NLOS sensors' in text
          assert 'NLOS Obstacle Position Estimation from Reflected Image' in text
          assert 'Object Detection Method for Non-Line-of-Sight Obstacles' in text
          assert 'Feasibility Study of Non-Line-of-Sight Obstacle' in text or 'Feasibility study of non-line-of-sight obstacle' in text
          Path('_renders').mkdir(exist_ok=True)
          subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','110',str(pdf),'_renders/first'],check=True)
          subprocess.run(['pdftoppm','-f',str(pages),'-singlefile','-png','-r','110',str(pdf),'_renders/last'],check=True)
          assert Path('_renders/first.png').stat().st_size>10000
          assert Path('_renders/last.png').stat().st_size>10000
          note=Path('updates/2026-07-28-vehicle-reflection-nlos-lineage.md')
          note_text=note.read_text(encoding='utf-8').replace('PDF compilation is staged separately and is not claimed by this source-integration commit.', f'`bare_jrnl.pdf` was cleanly rebuilt and validated after all four citation keys resolved; the resulting survey has {pages} pages.')
          note.write_text(note_text,encoding='utf-8')
          Path('updates/2026-07-28-vehicle-reflection-lineage-pdf-validation.txt').write_text(f'Validated four-paper PDF integration; pages: {pages}; first and last pages rendered successfully.\n',encoding='utf-8')
          PY
          rm -rf _renders bare_jrnl.txt
      - name: Commit regenerated PDF and validation record
        shell: bash
        run: |
          git add bare_jrnl.pdf updates/2026-07-28-vehicle-reflection-nlos-lineage.md updates/2026-07-28-vehicle-reflection-lineage-pdf-validation.txt
          git commit -m "Rebuild survey for automotive vehicle-reflection NLOS lineage"
          git push origin master
      - name: Remove completed integration tooling and stale single-paper attempts
        shell: bash
        run: |
          git pull --ff-only origin master
          git rm -f --ignore-unmatch \
            updates/TRIGGER_2026-07-28_VEHICLE_REFLECTION_LINEAGE.md \
            updates/TRIGGER_2026-07-28_VEHICLE_REFLECTION_NODEPS.md \
            updates/TRIGGER_2026-07-28_VEHICLE_REFLECTION_SOURCE.md \
            updates/TRIGGER_2026-07-28_VEHICLE_REFLECTION_COMPLETE.md \
            updates/TRIGGER_2026-07-28_VEHICLE_REFLECTION_RECOVERY.md \
            updates/TRIGGER_2026-07-28_VEHICLE_REFLECTION_OBSTACLE.md \
            updates/TRIGGER_2026-07-28_VEHICLE_REFLECTION_DIAGNOSTIC.md \
            updates/TRIGGER_2026-07-28_VEHICLE_REFLECTION_PREFLIGHT.md \
            updates/TRIGGER_2026-07-28_VEHICLE_REFLECTION_SCRIPT_DIAGNOSTIC.md \
            updates/2026-07-28-vehicle-reflection-workflow-diagnostic.txt \
            updates/2026-07-28-vehicle-reflection-preflight-diagnostic.txt \
            updates/2026-07-28-vehicle-reflection-script-diagnostic.txt \
            scripts/integrate_vehicle_reflection_obstacle.py \
            scripts/append_vehicle_reflection_bib.py \
            scripts/integrate_vehicle_reflection_lineage.py \
            .github/workflows/integrate_vehicle_reflection_lineage.yml \
            .github/workflows/source_vehicle_reflection_no_deps.yml \
            .github/workflows/source_vehicle_reflection_obstacle.yml \
            .github/workflows/complete_vehicle_reflection_obstacle.yml \
            .github/workflows/recover_vehicle_reflection_obstacle.yml \
            .github/workflows/integrate_vehicle_reflection_obstacle.yml \
            .github/workflows/test_vehicle_reflection_trigger.yml \
            .github/workflows/diagnose_vehicle_reflection_integration.yml \
            .github/workflows/diagnose_vehicle_reflection_script.yml \
            egbib_20260728_vehicle_reflection_obstacle.bib \
            updates/2026-07-28-vehicle-reflection-obstacle-localization.md \
            updates/2026-07-28-vehicle-reflection-source-validation.txt
          git commit -m "Remove completed vehicle-reflection lineage integration tooling"
          git push origin master
