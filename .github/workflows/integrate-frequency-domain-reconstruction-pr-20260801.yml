name: Integrate frequency-domain NLOS citation trace via PR

on:
  pull_request:
    branches: [master]
    paths:
      - updates/frequency_domain_reconstruction_20260801_pr.trigger

permissions:
  contents: write

concurrency:
  group: integrate-frequency-domain-reconstruction-pr-20260801
  cancel-in-progress: false

jobs:
  integrate-build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply synchronized source integration
        run: |
          python3 -m pip install --user bibtexparser
          python3 -m py_compile scripts/integrate_frequency_domain_reconstruction_20260801.py
          python3 scripts/integrate_frequency_domain_reconstruction_20260801.py
          python3 scripts/merge_nlos_bibliography.py

      - name: Install LaTeX and PDF tools
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get -o Acquire::Retries=5 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-pictures texlive-publishers \
            ghostscript poppler-utils

      - name: Rebuild survey PDF
        run: |
          old_hash=$(git hash-object bare_jrnl.pdf)
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          new_hash=$(git hash-object bare_jrnl.pdf)
          echo "PDF blob: $old_hash -> $new_hash"
          test "$old_hash" != "$new_hash"

      - name: Validate public artifacts
        shell: bash
        run: |
          set -euo pipefail
          product='Fast non-line-of-sight imaging based on product-convolution expansions'
          rma='Non-line-of-sight virtual modulated range migration imaging based on super-resolution histograms'
          pkey='xuProductConvolutionNLOS2022'
          rkey='tianVirtualRMAHistograms2025'
          test "$(grep -F -c "$product" README.md)" -eq 1
          test "$(grep -F -c "$rma" README.md)" -eq 1
          test "$(grep -F -c "title:\"$product\"" index.html)" -eq 1
          test "$(grep -F -c "title:\"$rma\"" index.html)" -eq 1
          test "$(grep -E -c "^@article\\{$pkey," egbib_merged_20260711.bib)" -eq 1
          test "$(grep -E -c "^@article\\{$rkey," egbib_merged_20260711.bib)" -eq 1
          test "$(grep -F -c "$pkey" article/2active.tex)" -ge 2
          test "$(grep -F -c "$rkey" article/2active.tex)" -ge 2
          grep -F -q "$pkey" bare_jrnl.aux
          grep -F -q "$rkey" bare_jrnl.aux
          grep -F -q "$pkey" bare_jrnl.bbl
          grep -F -q "$rkey" bare_jrnl.bbl
          ! grep -E -q 'Citation .* undefined|There were undefined citations|Repeated entry' bare_jrnl.log
          actual=$(grep -o '{cat:' index.html | wc -l)
          declared=$(grep -oP '<b>\K[0-9]+(?=</b><span>tracked latest entries</span>)' index.html)
          test "$declared" -eq "$actual"
          pdfinfo bare_jrnl.pdf | grep -q '^Pages:'
          pdftotext -layout bare_jrnl.pdf bare_jrnl.txt
          python3 - <<'PY'
          from pathlib import Path
          text = ''.join(ch for ch in Path('bare_jrnl.txt').read_text(errors='ignore').lower() if ch.isalnum())
          needles = [
              'fastnonlineofsightimagingbasedonproductconvolutionexpansions',
              'virtualmodulatedrangemigration',
              'superresolutionhistograms',
          ]
          missing = [needle for needle in needles if needle not in text]
          if missing:
              raise SystemExit(f'PDF semantic checks missing: {missing}')
          PY
          pages=$(pdfinfo bare_jrnl.pdf | awk '/^Pages:/ {print $2}')
          mkdir -p .pdf_render_check
          pdftoppm -f 1 -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/first >/dev/null 2>&1
          pdftoppm -f "$pages" -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/last >/dev/null 2>&1
          test -s .pdf_render_check/first.png
          test -s .pdf_render_check/last.png
          rm -rf .pdf_render_check bare_jrnl.txt

      - name: Commit validated artifacts to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html article/2active.tex bare_jrnl.tex \
            egbib_merged_20260711.bib bare_jrnl.pdf \
            updates/2026-08-01-frequency-domain-reconstruction.md
          if git diff --cached --quiet; then
            echo "No public-artifact changes were generated"
            exit 1
          fi
          git commit -m "Integrate frequency-domain active NLOS citation trace"
          git push origin HEAD:master
