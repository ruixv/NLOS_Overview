name: Containerized vehicle-reflection lineage PDF build
on:
  push:
    branches: [master]
    paths:
      - updates/TRIGGER_2026-07-28_VEHICLE_REFLECTION_PDF_ACTION.md
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: bare_jrnl.tex
          latexmk_use_xelatex: false
      - shell: bash
        run: |
          test -s bare_jrnl.pdf
          grep -q "takatoriReflectedImageNLOS2020" bare_jrnl.bbl
          grep -q "shengVehicleReflectionObstacle2026" bare_jrnl.bbl
          ! grep -Eqi "Citation.*undefined|undefined citations" bare_jrnl.log
          pages=$(pdfinfo bare_jrnl.pdf 2>/dev/null | awk '/Pages:/ {print $2}')
          [ -n "$pages" ] || pages=unknown
          python - "$pages" <<'PY'
          from pathlib import Path
          import sys
          p=Path('updates/2026-07-28-vehicle-reflection-nlos-lineage.md')
          s=p.read_text(encoding='utf-8').replace('PDF compilation is staged separately and is not claimed by this source-integration commit.',f'`bare_jrnl.pdf` was rebuilt after all four citation keys resolved; the resulting survey has {sys.argv[1]} pages.')
          p.write_text(s,encoding='utf-8')
          Path('updates/2026-07-28-vehicle-reflection-lineage-pdf-validation.txt').write_text(f'Validated four-paper PDF integration; pages: {sys.argv[1]}.\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bare_jrnl.pdf updates/2026-07-28-vehicle-reflection-nlos-lineage.md updates/2026-07-28-vehicle-reflection-lineage-pdf-validation.txt
          git commit -m "Rebuild survey for automotive vehicle-reflection NLOS lineage"
          git push origin master
