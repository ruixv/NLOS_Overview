name: Synchronize diffuse-aware NLOS record

on:
  push:
    branches: [master]
    paths:
      - updates/sync_diffuse_aware_readme_20260730.trigger
  pull_request:
    branches: [master]
    paths:
      - updates/sync_diffuse_aware_readme_20260730.trigger

permissions:
  contents: write

concurrency:
  group: sync-diffuse-aware-readme-20260730
  cancel-in-progress: false

jobs:
  synchronize-build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Synchronize README
        run: |
          python3 -m py_compile scripts/sync_diffuse_aware_readme_20260730.py
          python3 scripts/sync_diffuse_aware_readme_20260730.py

      - name: Install LaTeX and PDF validation tools
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=5 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-pictures texlive-publishers \
            ghostscript poppler-utils

      - name: Cleanly rebuild survey PDF
        run: |
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex

      - name: Validate cross-artifact consistency
        shell: bash
        run: |
          set -euo pipefail
          title='Passive non-line-of-sight imaging with diffuse-aware attention-enhanced encoding'
          test "$(grep -F -c "$title" README.md)" -eq 1
          test "$(grep -F -c "$title" index.html)" -eq 1
          test "$(grep -E -c '^@article\{wangDiffuseAwarePassive2026,' egbib_merged_20260711.bib)" -eq 1
          grep -F -q 'wangDiffuseAwarePassive2026' article/3passive.tex
          grep -F -q 'wangDiffuseAwarePassive2026' bare_jrnl.aux
          grep -F -q '**Update run: 30 July 2026.**' README.md
          grep -F -q 'Last updated: 30 July 2026' index.html
          actual=$(grep -o '{cat:' index.html | wc -l)
          declared=$(grep -oP '<b>\K[0-9]+(?=</b><span>tracked latest entries</span>)' index.html)
          test "$declared" -eq "$actual"
          ! grep -E -q 'Citation .* undefined|There were undefined citations|Repeated entry' bare_jrnl.log
          pdfinfo bare_jrnl.pdf | grep -q '^Pages:'
          pdftotext -layout bare_jrnl.pdf bare_jrnl.txt
          python3 - <<'PY'
          from pathlib import Path
          text = ''.join(ch for ch in Path('bare_jrnl.txt').read_text(errors='ignore').lower() if ch.isalnum())
          needle = 'diffuseawareattentionencodingforpassivenlos'
          print('PDF semantic check:', 'ok' if needle in text else f'missing {needle}')
          if needle not in text:
              raise SystemExit(1)
          PY
          pages=$(pdfinfo bare_jrnl.pdf | awk '/^Pages:/ {print $2}')
          mkdir -p .pdf_render_check
          pdftoppm -f 1 -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/first >/dev/null 2>&1
          pdftoppm -f "$pages" -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/last >/dev/null 2>&1
          test -s .pdf_render_check/first.png
          test -s .pdf_render_check/last.png
          rm -rf .pdf_render_check bare_jrnl.txt

      - name: Remove one-run synchronization tooling
        run: |
          rm -f scripts/sync_diffuse_aware_readme_20260730.py
          rm -f .github/workflows/sync-diffuse-aware-readme-20260730.yml
          rm -f updates/sync_diffuse_aware_readme_20260730.trigger

      - name: Commit synchronized README and rebuilt PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "Synchronize diffuse-aware passive NLOS record"
          git push origin HEAD:master
