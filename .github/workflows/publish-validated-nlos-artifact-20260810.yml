name: Publish validated NLOS artifact bundle

on:
  push:
    paths:
      - '.github/workflows/publish-validated-nlos-artifact-20260810.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Download validated artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9043695201/zip" > /tmp/nlos-artifact.zip
          rm -rf /tmp/nlos-artifact
          mkdir -p /tmp/nlos-artifact
          unzip -q /tmp/nlos-artifact.zip -d /tmp/nlos-artifact

      - name: Verify exact validated files
        run: |
          set -euo pipefail
          check_blob() {
            file="$1"; expected="$2"
            actual="$(git hash-object "/tmp/nlos-artifact/$file")"
            test "$actual" = "$expected" || { echo "Blob mismatch for $file: $actual != $expected" >&2; exit 1; }
          }
          check_blob README.md 2fa96b5443401a8f732bff109a79e44be63d1f4e
          check_blob index.html 2e1d155b7bd5bedd05a8c0e7acf07db77c07e709
          check_blob bare_jrnl.tex 26f69d31448c7235a37df7d2c5e1aeea4ab2bd70
          check_blob egbib_merged_20260711.bib 0159a70d50f183a7df6d48e148c71b9067220851
          check_blob article/5newscenes.tex d37eb0127bc09363949bb212b5f915bb7969bc89
          check_blob bare_jrnl.pdf 25ce412aa2ea0a2dd9660517bf97b096a1612fd9

      - name: Publish validated public/source bundle
        run: |
          set -euo pipefail
          cp /tmp/nlos-artifact/README.md README.md
          cp /tmp/nlos-artifact/index.html index.html
          cp /tmp/nlos-artifact/bare_jrnl.tex bare_jrnl.tex
          cp /tmp/nlos-artifact/egbib_merged_20260711.bib egbib_merged_20260711.bib
          cp /tmp/nlos-artifact/article/5newscenes.tex article/5newscenes.tex
          cp /tmp/nlos-artifact/bare_jrnl.pdf bare_jrnl.pdf

          grep -Fq 'Leveraging Rough-Relay-Surface Scattering for Non-Line-of-Sight mmWave Radar Sensing' README.md
          grep -Fq 'A comprehensive study of time-of-flight non-line-of-sight imaging' index.html
          grep -Fq '274' index.html
          grep -Fq 'Hydra: Exploiting Multi-Bounce Scattering for Beyond-Field-of-View mmWave Radar' README.md
          grep -Fq 'marco2026comprehensive' egbib_merged_20260711.bib
          grep -Fq 'rough relay' article/5newscenes.tex

      - name: Record propagation and clean one-shot workflow
        run: |
          set -euo pipefail
          note='updates/2026-08-10-validated-pending-public-artifacts.md'
          marker='Validated artifact propagation completed on 10 August 2026'
          if test -f "$note" && ! grep -Fq "$marker" "$note"; then
            cat >> "$note" <<'EOF'

## Propagation completed

Validated artifact propagation completed on 10 August 2026. The exact workflow artifact from run `31333722330` / artifact `9043695201` was verified by Git blob hash and then copied atomically into `README.md`, `index.html`, `bare_jrnl.tex`, `egbib_merged_20260711.bib`, `article/5newscenes.tex`, and `bare_jrnl.pdf`. This closes the previously documented source/PDF synchronization gap for the MARMOT, N2LoS final-venue, realistic-relay mmWave, and ToF benchmark coverage represented by that artifact.
EOF
          fi
          rm -f .github/workflows/publish-validated-nlos-artifact-20260810.yml

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html bare_jrnl.tex egbib_merged_20260711.bib article/5newscenes.tex bare_jrnl.pdf updates/2026-08-10-validated-pending-public-artifacts.md .github/workflows/publish-validated-nlos-artifact-20260810.yml
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'Publish validated NLOS public artifact bundle'
          git push origin HEAD:master
