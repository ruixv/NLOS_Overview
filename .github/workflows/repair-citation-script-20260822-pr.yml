name: Repair 22 Aug citation-trace integration script

on:
  pull_request:
    branches: [master]
    paths:
      - updates/repair_citation_script_20260822.trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
      - name: Repair literal newline escape and compile-check
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('scripts/integrate_citation_trace_20260822.py')
          s=p.read_text(encoding='utf-8')
          i=s.find('old_2026_tail')
          print('diagnostic:', repr(s[i:i+500]))
          s2,n=re.subn(r'\\+n(?=new_2026_tail\s*=)', '\n', s)
          print('literal-newline replacements:', n)
          if n != 1:
              raise RuntimeError(f'Expected one broken literal newline before new_2026_tail, found {n}')
          p.write_text(s2,encoding='utf-8')
          compile(s2,str(p),'exec')
          print('compile check passed')
          PY
      - name: Commit repaired script
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/integrate_citation_trace_20260822.py
          git commit -m 'Repair citation-trace integration script'
          git push origin HEAD:master