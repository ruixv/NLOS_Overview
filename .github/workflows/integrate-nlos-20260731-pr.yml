name: Complete NLOS integration PR fallback

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  integrate-build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - run: python3 -m pip install --user bibtexparser
      - name: Apply source integration
        run: |
          python3 -m py_compile scripts/integrate_nlos_20260731_complete.py
          python3 scripts/integrate_nlos_20260731_complete.py
          python3 scripts/merge_nlos_bibliography.py
      - name: Install LaTeX
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get -o Acquire::Retries=5 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-science texlive-pictures texlive-publishers ghostscript poppler-utils
      - name: Rebuild PDF
        run: |
          old_hash=$(git hash-object bare_jrnl.pdf)
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          new_hash=$(git hash-object bare_jrnl.pdf)
          test "$new_hash" != "$old_hash"
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          for title in \
            'Contrast Adaptive Slot-Attention Network for NLoS Classification Under Temporal Truncation' \
            'Enhanced passive non-line-of-sight imaging via multi-scale polarization-guided diffusion model' \
            'Lightweight multi-scale feature fusion with attention guidance for passive non-line-of-sight imaging' \
            'Multipath Exploitation-Based Linearized Inverse Scattering Method for Non-Line-of-Sight Indoor Imaging of PEC Objects' \
            'Non-Line-of-Sight Imaging by Linearized Inverse Scattering Method Based on Physical Optics'; do
            test "$(grep -F -c "$title" README.md)" -eq 1
            test "$(grep -F -c "$title" index.html)" -eq 1
          done
          for key in linCASlotNetNLOS2025 chenLightweightMultiScalePassiveNLOS2025 jinMSPDiffPassiveNLOS2025 suenobuPhysicalOpticsNLOS2024 suenobuMultipathInverseScatteringNLOS2025; do
            test "$(grep -Ei -c "^@(article|inproceedings)\\{$key," egbib_merged_20260711.bib)" -eq 1
            grep -R -F -q "$key" article
            grep -F -q "$key" bare_jrnl.bbl
          done
          grep -F -q '10.1109/TVCG.2026.3684832' egbib_merged_20260711.bib
          actual=$(grep -o '{cat:' index.html | wc -l)
          declared=$(grep -oP '<b>\K[0-9]+(?=</b><span>tracked latest entries</span>)' index.html)
          test "$declared" -eq "$actual"
          ! grep -E -q 'Citation .* undefined|There were undefined citations|Repeated entry' bare_jrnl.log
          pdftotext -layout bare_jrnl.pdf bare_jrnl.txt
          python3 - <<'PY'
          from pathlib import Path
          text=''.join(c for c in Path('bare_jrnl.txt').read_text(errors='ignore').lower() if c.isalnum())
          needles=['contrastadaptiveslotattention','lightweightmultiscalefeaturefusion','polarizationguideddiffusion','multipathexploitationbasedlinearizedinversescattering','nonlineofsightimagingbylinearizedinversescattering','geometryconstrainednonlineofsightimaging']
          missing=[n for n in needles if n not in text]
          if missing: raise SystemExit(f'missing PDF text: {missing}')
          PY
          pages=$(pdfinfo bare_jrnl.pdf | awk '/^Pages:/ {print $2}')
          pdftoppm -f 1 -singlefile -png -r 100 bare_jrnl.pdf /tmp/nlos-first >/dev/null 2>&1
          pdftoppm -f "$pages" -singlefile -png -r 100 bare_jrnl.pdf /tmp/nlos-last >/dev/null 2>&1
          test -s /tmp/nlos-first.png && test -s /tmp/nlos-last.png
      - name: Commit integrated artifacts
        run: |
          rm -f scripts/integrate_nlos_20260731_complete.py
          rm -f .github/workflows/integrate-nlos-20260731-complete.yml
          rm -f .github/workflows/integrate-nlos-20260731-pr.yml
          rm -f updates/nlos_20260731_complete.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate pending citation-traced NLOS papers'
          git push origin HEAD:${GITHUB_HEAD_REF}
