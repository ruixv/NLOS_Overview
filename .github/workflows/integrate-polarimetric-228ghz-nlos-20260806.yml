name: Integrate polarimetric 228 GHz NLOS 20260806

on:
  pull_request:
    branches: [master]
    paths:
      - updates/run_polarimetric_228ghz_nlos_20260806.trigger

permissions:
  contents: write

concurrency:
  group: integrate-polarimetric-228ghz-nlos-20260806
  cancel-in-progress: false

jobs:
  integrate-build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply bounded source update
        run: |
          python3 -m pip install --user bibtexparser
          python3 -m py_compile scripts/integrate_polarimetric_228ghz_nlos_20260806.py
          python3 scripts/integrate_polarimetric_228ghz_nlos_20260806.py
          python3 scripts/merge_nlos_bibliography.py

      - name: Install LaTeX and PDF tools
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get -o Acquire::Retries=5 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-pictures texlive-publishers \
            ghostscript poppler-utils

      - name: Rebuild survey PDF
        shell: bash
        run: |
          set -euo pipefail
          old_hash=$(git hash-object bare_jrnl.pdf)
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          rm -f bare_jrnl.aux bare_jrnl.out bare_jrnl.toc
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          new_hash=$(git hash-object bare_jrnl.pdf)
          echo "PDF blob: $old_hash -> $new_hash"
          test "$old_hash" != "$new_hash"

      - name: Validate synchronized artifacts
        shell: bash
        run: |
          set -euo pipefail
          pdfinfo bare_jrnl.pdf | tee /tmp/bare_jrnl_pdfinfo.txt
          pdftotext -layout bare_jrnl.pdf bare_jrnl.txt
          python3 - <<'PY'
          from pathlib import Path
          import re

          title = "Rapid Indoor Mapping and Non-Line-of-Sight Imaging Using a 228-GHz FMCW Polarimetric Radar System"
          key = "alburadiPolarimetric228GHzNLOS2025"
          doi = "10.1109/TGRS.2025.3564230"
          readme = Path("README.md").read_text(errors="ignore")
          html = Path("index.html").read_text(errors="ignore")
          section = Path("article/5newscenes.tex").read_text(errors="ignore")
          tex = Path("bare_jrnl.tex").read_text(errors="ignore")
          bib = Path("egbib_merged_20260711.bib").read_text(errors="ignore")
          aux = Path("bare_jrnl.aux").read_text(errors="ignore")
          bbl = Path("bare_jrnl.bbl").read_text(errors="ignore")
          log = Path("bare_jrnl.log").read_text(errors="ignore")
          pdf = "".join(ch for ch in Path("bare_jrnl.txt").read_text(errors="ignore").lower() if ch.isalnum())

          failures = []
          for label, text in (("README", readme), ("website", html)):
              if text.count(title) != 1:
                  failures.append(f"{label} contains title {text.count(title)} times")
              if text.count(doi) != 1:
                  failures.append(f"{label} contains DOI {text.count(doi)} times")
          if section.count(key) != 1:
              failures.append(f"article/5newscenes.tex contains citation key {section.count(key)} times")
          if "6 August 2026 modality trace" not in tex:
              failures.append("bare_jrnl.tex lacks the synchronized update marker")
          entry_count = len(re.findall(rf"@\w+\s*\{{\s*{re.escape(key)}\s*,", bib, flags=re.I))
          if entry_count != 1:
              failures.append(f"merged bibliography contains {entry_count} entries for {key}")
          for label, text in (("AUX", aux), ("BBL", bbl)):
              if key not in text:
                  failures.append(f"{label} missing citation key {key}")
          for semantic in ("222228ghz", "polarizationdiscrimination", "mirrortransformation"):
              if semantic not in pdf:
                  failures.append(f"PDF text missing semantic term {semantic}")
          if re.search(r"Citation .* undefined|There were undefined citations|Repeated entry", log):
              failures.append("LaTeX log contains unresolved or repeated citations")

          actual = html.count("{cat:")
          declared = re.findall(r'<b>(\d+)</b><span>tracked latest entries</span>', html)
          if len(declared) != 1:
              failures.append(f"website entry counter matched {len(declared)} times")
          elif int(declared[0]) != actual:
              failures.append(f"website entry counter says {declared[0]} but explorer contains {actual}")

          if failures:
              raise SystemExit("Artifact validation failed:\n- " + "\n- ".join(failures))
          print(f"Validated polarimetric 228 GHz radar NLOS across public artifacts; explorer contains {actual} records")
          PY
          pages=$(awk '/^Pages:/ {print $2}' /tmp/bare_jrnl_pdfinfo.txt)
          test -n "$pages"
          mkdir -p .pdf_render_check
          pdftoppm -f 1 -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/first >/dev/null 2>&1
          pdftoppm -f "$pages" -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/last >/dev/null 2>&1
          test -s .pdf_render_check/first.png
          test -s .pdf_render_check/last.png
          rm -rf .pdf_render_check bare_jrnl.txt

      - name: Commit validated artifacts to pull-request branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          test -n "$TARGET_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git show origin/master:updates/run_polarimetric_228ghz_nlos_20260806.trigger > updates/run_polarimetric_228ghz_nlos_20260806.trigger
          git add README.md index.html article/5newscenes.tex bare_jrnl.tex \
            egbib_20260806_polarimetric_228ghz_nlos.bib egbib_merged_20260711.bib bare_jrnl.pdf \
            updates/2026-08-06-polarimetric-228ghz-nlos.md \
            updates/2026-07-11-bibliography-deduplication.md \
            updates/run_polarimetric_228ghz_nlos_20260806.trigger
          if git diff --cached --quiet; then
            echo "No public-artifact changes were generated"
            exit 1
          fi
          git commit -m "Integrate 228 GHz polarimetric radar NLOS imaging"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "Updated pull-request branch: $TARGET_BRANCH"
