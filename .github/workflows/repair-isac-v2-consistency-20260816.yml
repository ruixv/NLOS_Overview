name: Repair cellular ISAC V2 consistency

on:
  push:
    branches: [master]
    paths:
      - updates/isac_v2_consistency_20260816.trigger

permissions:
  contents: write

concurrency:
  group: repair-isac-v2-consistency-20260816
  cancel-in-progress: false

jobs:
  repair-build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply idempotent V2 consistency repair
        run: |
          python3 -m py_compile scripts/repair_isac_v2_consistency_20260816.py
          python3 scripts/repair_isac_v2_consistency_20260816.py

      - name: Install LaTeX and PDF validation tools
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get -o Acquire::Retries=5 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-pictures texlive-publishers \
            ghostscript poppler-utils

      - name: Cleanly rebuild survey PDF
        shell: bash
        run: |
          set -euo pipefail
          old_hash=$(git hash-object bare_jrnl.pdf)
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          new_hash=$(git hash-object bare_jrnl.pdf)
          echo "PDF blob: $old_hash -> $new_hash"
          test "$old_hash" != "$new_hash"

      - name: Validate cross-artifact consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          titles = [
              'Feasibility of Non-Line-of-Sight Integrated Sensing and Communication at mmWave',
              'Reliable Non-Line-of-Sight Intrusion Detection with Integrated Sensing and Communications Hardware',
          ]
          keys = ['tosiFeasibilityISACNLOS2024', 'tosiReliableISACNLOS2026']
          readme = Path('README.md').read_text(encoding='utf-8', errors='ignore')
          corpus = Path('data/papers-source.html').read_text(encoding='utf-8', errors='ignore')
          survey = Path('article/5newscenes.tex').read_text(encoding='utf-8', errors='ignore')
          bib = Path('egbib_merged_20260711.bib').read_text(encoding='utf-8', errors='ignore')
          tex = Path('bare_jrnl.tex').read_text(encoding='utf-8', errors='ignore')

          for title in titles:
              if title not in readme:
                  raise SystemExit(f'FAILED README coverage: {title}')
              n = corpus.count(f'title:"{title}"')
              if n != 1:
                  raise SystemExit(f'FAILED canonical corpus uniqueness for {title}: {n}')

          if '10.1109/SPAWC60668.2024.10694426' not in readme:
              raise SystemExit('FAILED final SPAWC DOI in README')
          if 'IEEE SPAWC 2024, 331–335' not in corpus:
              raise SystemExit('FAILED final SPAWC venue in canonical corpus')
          if '32nd International Conference on Telecommunications (ICT 2026), 25–30' not in corpus:
              raise SystemExit('FAILED final ICT venue in canonical corpus')

          for key in keys:
              if key not in survey:
                  raise SystemExit(f'FAILED survey citation: {key}')
              entries = re.findall(r'@[A-Za-z]+\{\s*' + re.escape(key) + r'\s*,', bib, flags=re.I)
              if len(entries) != 1:
                  raise SystemExit(f'FAILED bibliography uniqueness for {key}: {len(entries)}')

          if len(re.findall(r'10\.1109/SPAWC60668\.2024\.10694426', bib, flags=re.I)) < 1:
              raise SystemExit('FAILED SPAWC DOI in merged bibliography')
          if 'through 16 August 2026.' not in tex:
              raise SystemExit('FAILED survey snapshot date')
          if '\\bibliography{egbib_merged_20260711}' not in tex:
              raise SystemExit('FAILED survey bibliography source')

          m = re.search(r'<b>(\d+)</b><span>tracked latest entries</span>', corpus)
          if not m:
              raise SystemExit('FAILED tracked-entry counter')
          displayed = int(m.group(1))
          actual = len(re.findall(r'\{cat:"', corpus))
          if displayed != actual:
              raise SystemExit(f'FAILED canonical count: displayed={displayed}, actual={actual}')
          if displayed < 299:
              raise SystemExit(f'FAILED expected restored corpus size: {displayed}')
          if 'Last updated: 16 August 2026' not in corpus:
              raise SystemExit('FAILED V2 footer date')

          aux = Path('bare_jrnl.aux').read_text(encoding='utf-8', errors='ignore')
          for key in keys:
              if key not in aux:
                  raise SystemExit(f'FAILED resolved aux citation: {key}')
          log = Path('bare_jrnl.log').read_text(encoding='utf-8', errors='ignore')
          if 'There were undefined citations' in log or 'Repeated entry' in log or re.search(r'Citation .* undefined', log):
              raise SystemExit('FAILED LaTeX citation validation')
          print(f'cross-artifact source validation: ok; tracked papers={displayed}')
          PY

          pdfinfo bare_jrnl.pdf | grep -q '^Pages:'
          pdftotext -layout bare_jrnl.pdf bare_jrnl.txt
          python3 - <<'PY'
          from pathlib import Path
          text = ''.join(ch for ch in Path('bare_jrnl.txt').read_text(errors='ignore').lower() if ch.isalnum())
          needles = [
              'cellularisachardwarefornlossensing',
              'feasibilityofnonlineofsightintegratedsensingandcommunicationatmmwave',
              'reliablenonlineofsightintrusiondetectionwithintegratedsensingandcommunicationshardware',
          ]
          missing = [n for n in needles if n not in text]
          if missing:
              raise SystemExit(f'FAILED PDF semantic checks: missing {missing}')
          print('PDF semantic checks: ok')
          PY
          pages=$(pdfinfo bare_jrnl.pdf | awk '/^Pages:/ {print $2}')
          mkdir -p .pdf_render_check
          pdftoppm -f 1 -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/first >/dev/null 2>&1
          pdftoppm -f "$pages" -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/last >/dev/null 2>&1
          test -s .pdf_render_check/first.png
          test -s .pdf_render_check/last.png
          rm -rf .pdf_render_check bare_jrnl.txt

      - name: Commit validated repair and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/repair_isac_v2_consistency_20260816.py \
            .github/workflows/repair-isac-v2-consistency-20260816.yml \
            updates/isac_v2_consistency_20260816.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers-source.html bare_jrnl.tex bare_jrnl.pdf \
            updates/2026-08-08-isac-nlos-final-venue-citation-trace.md
          git add -u scripts/repair_isac_v2_consistency_20260816.py \
            .github/workflows/repair-isac-v2-consistency-20260816.yml \
            updates/isac_v2_consistency_20260816.trigger
          if git diff --cached --quiet; then
            echo "No validated consistency changes to commit"
            exit 1
          fi
          git commit -m "Restore cellular ISAC papers in V2 explorer"
          git push origin HEAD:master
