name: Synchronize RF RIS NLOS updates

on:
  push:
    branches: [automation-ris-nlos-sync-20260811]
    paths: ['.github/trigger-ris-nlos-sync-20260811']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation-ris-nlos-sync-20260811
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bibliography tooling
        run: python -m pip install --disable-pip-version-check bibtexparser
      - name: Apply bounded public updates
        run: python tools/integrate_ris_nlos_public_20260811.py
      - name: Merge and audit bibliography
        run: python scripts/merge_nlos_bibliography.py
      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-pictures texlive-publishers texlive-bibtex-extra poppler-utils
      - name: Rebuild living survey PDF
        run: |
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          test -s bare_jrnl.pdf
          ! grep -Eq 'Citation .* undefined|There were undefined references|There were undefined citations' bare_jrnl.log
      - name: Validate cross-artifact consistency
        run: |
          set -euo pipefail
          for title in \
            'Non-Line-of-Sight Human Vital-Sign Sensing Aided by Reconfigurable Intelligent Surfaces' \
            'Liquid Crystal RIS Integrated with SIL Radar for NLOS Vital Sign Monitoring' \
            'mmWave Radar-Based Non-Line-of-Sight Pedestrian Localization at T-Junctions Utilizing Road Layout Extraction via Camera' \
            'Non-Line-of-Sight Imaging Using Raster Scanning at NIR Wavelength'; do
            grep -Fq "$title" README.md
          done
          grep -Fq 'Non-Line-of-Sight Human Vital-Sign Sensing Aided by Reconfigurable Intelligent Surfaces' index.html
          grep -Fq 'Liquid Crystal RIS Integrated with SIL Radar for NLOS Vital Sign Monitoring' index.html
          grep -Fq '10.1109/IROS60139.2025.11246461' README.md
          grep -Fq '10.1109/IROS60139.2025.11246461' index.html
          grep -Fq 'liRISVitalSignNLOS2025' article/5newscenes.tex
          grep -Fq 'tripathyLCRISVitalSign2025' article/5newscenes.tex
          grep -Fq 'parkTjunctionPedestrian2025' article/5newscenes.tex
          for key in liRISVitalSignNLOS2025 tripathyLCRISVitalSign2025 yasmeenDualBeamRIS2026 parkTjunctionPedestrian2025; do
            test "$(grep -Fo "$key" egbib_merged_20260711.bib | wc -l)" -eq 1
          done
          grep -Fq '10.1109/RadarConf2559087.2025.11205052' egbib_merged_20260711.bib
          grep -Fq '10.1109/IROS60139.2025.11246461' egbib_merged_20260711.bib
          pdftotext bare_jrnl.pdf /tmp/nlos-ris.txt
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('/tmp/nlos-ris.txt').read_text(encoding='utf-8', errors='ignore')
          norm=lambda s: re.sub(r'[\s\-‐‑‒–—]+','',s).lower()
          compact=norm(text)
          for token in ['reconfigurable propagation for physiological NLOS sensing','liquid-crystal RIS','vital-sign','T-junction']:
              assert norm(token) in compact, f'missing PDF token: {token}'
          print('PDF semantic checks passed.')
          PY
          pages=$(pdfinfo bare_jrnl.pdf | awk '/^Pages:/ {print $2}')
          test "$pages" -gt 10
          ris_page=''
          for p in $(seq 1 "$pages"); do
            if pdftotext -f "$p" -l "$p" bare_jrnl.pdf - | grep -Fiq 'physiological NLOS'; then ris_page="$p"; break; fi
          done
          test -n "$ris_page"
          pdftoppm -png -f 1 -singlefile -r 100 bare_jrnl.pdf /tmp/nlos-first
          pdftoppm -png -f "$ris_page" -singlefile -r 100 bare_jrnl.pdf /tmp/nlos-ris-page
          test -s /tmp/nlos-first.png
          test -s /tmp/nlos-ris-page.png
      - name: Commit synchronized public artifacts and remove temporary integration helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/integrate-ris-nlos-sync-20260811.yml .github/trigger-ris-nlos-sync-20260811 tools/integrate_ris_nlos_public_20260811.py
          git add README.md index.html article/5newscenes.tex bare_jrnl.tex egbib_merged_20260711.bib bare_jrnl.pdf updates/2026-08-11-ris-nlos-synchronized.md updates/2026-07-11-bibliography-deduplication.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Synchronize verified RF RIS NLOS updates'
            git push origin HEAD:automation-ris-nlos-sync-20260811
          fi
