name: Integrate NLOS citation and consistency update

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: integrate-nlos-consistency-20260806
  cancel-in-progress: false

jobs:
  update-build-validate:
    if: github.event.pull_request.head.ref == 'automation/nlos-consistency-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply bounded source updates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/integrate_nlos_consistency_20260806.py
          python3 scripts/integrate_nlos_consistency_20260806.py

      - name: Install LaTeX and PDF validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get -o Acquire::Retries=5 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-pictures texlive-publishers \
            ghostscript poppler-utils

      - name: Rebuild updated survey PDF
        shell: bash
        run: |
          set -euo pipefail
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc bare_jrnl.txt
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex

      - name: Validate all public artifacts and rendered survey
        shell: bash
        run: |
          set -euo pipefail
          pdfinfo bare_jrnl.pdf | tee /tmp/bare_pdfinfo.txt
          pdftotext -layout bare_jrnl.pdf bare_jrnl.txt
          python3 - <<'PY'
          from pathlib import Path
          import re

          titles = [
              'Non-line-of-sight imaging via physics-informed cascade learning',
              'Passive acoustic non-line-of-sight localization without a relay surface',
              'Towards passive non-line-of-sight acoustic localization around corners using uncontrolled random noise sources',
              'Rapid Indoor Mapping and Non-Line-of-Sight Imaging Using a 228-GHz FMCW Polarimetric Radar System',
          ]
          keys = [
              'zhaoPICL2026',
              'sommerPassiveAcousticNLOS2026',
              'bogerLombardPassiveAcousticCorners2023',
              'alburadiPolarimetricRadarNLOS2025',
          ]
          readme = Path('README.md').read_text(errors='ignore')
          html = Path('index.html').read_text(errors='ignore')
          article4 = Path('article/4datadriven.tex').read_text(errors='ignore')
          article5 = Path('article/5newscenes.tex').read_text(errors='ignore')
          tex = Path('bare_jrnl.tex').read_text(errors='ignore')
          bib = Path('egbib_merged_20260711.bib').read_text(errors='ignore')
          aux = Path('bare_jrnl.aux').read_text(errors='ignore')
          bbl = Path('bare_jrnl.bbl').read_text(errors='ignore')
          log = Path('bare_jrnl.log').read_text(errors='ignore')
          pdf = ''.join(c for c in Path('bare_jrnl.txt').read_text(errors='ignore').lower() if c.isalnum())
          errors = []
          for title in titles:
              if title not in readme: errors.append(f'README missing {title}')
              if title not in html: errors.append(f'website missing {title}')
          if 'ICCV 2025, 25040–25049' not in readme or 'ICCV 2025, 25040–25049' not in html:
              errors.append('Generalizable NLOS final ICCV metadata missing')
          if keys[0] not in article4: errors.append('PICL survey citation missing')
          for key in keys[1:]:
              if key not in article5: errors.append(f'survey citation missing {key}')
          for key in keys:
              if key not in aux or key not in bbl: errors.append(f'compiled citation missing {key}')
              count = len(re.findall(rf'@[A-Za-z]+\s*\{{\s*{re.escape(key)}\s*,', bib, re.I))
              if count != 1: errors.append(f'bibliography entry count for {key}: {count}')
          if 'Boger-Lombard, Jeremy and Slobodkin, Yevgeny and Katz, Ori' not in bib or 'pages = {4952}' not in bib:
              errors.append('corrected Scientific Reports metadata missing')
          if 'through 6 August 2026' not in tex: errors.append('survey coverage date missing')
          normalized_terms = [
              'physicsinformedcascadelearning',
              'passiveacousticnonlineofsightlocalization',
              'uncontrolledrandomnoisesources',
              'rapidindoormappingandnonlineofsightimagingusinga228ghz',
          ]
          for term in normalized_terms:
              if term not in pdf: errors.append(f'PDF missing normalized term {term}')
          if re.search(r'Citation .* undefined|There were undefined citations|Repeated entry', log):
              errors.append('LaTeX log contains undefined or repeated citations')
          actual = html.count('{cat:')
          declared = re.findall(r'<b>(\d+)</b><span>tracked latest entries</span>', html)
          if len(declared) != 1 or int(declared[0]) != actual:
              errors.append(f'website counter mismatch: {declared} versus {actual}')
          if errors:
              raise SystemExit('Validation failed:\n- ' + '\n- '.join(errors))
          print(f'Validated {actual} website records, survey sources, bibliography, and PDF')
          PY
          pages=$(awk '/^Pages:/ {print $2}' /tmp/bare_pdfinfo.txt)
          test -n "$pages"
          mkdir -p .pdf_render_check
          pdftoppm -f 1 -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/first >/dev/null 2>&1
          pdftoppm -f "$pages" -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/last >/dev/null 2>&1
          test -s .pdf_render_check/first.png
          test -s .pdf_render_check/last.png
          rm -rf .pdf_render_check bare_jrnl.txt

      - name: Persist only validated public artifacts
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/integrate_nlos_consistency_20260806.py
          rm -f .github/workflows/integrate-nlos-consistency-20260806.yml
          rm -f .github/workflows/*picl*20260806*.yml
          rm -f scripts/*picl*20260806*.sh scripts/*picl*20260806*.py
          rm -f updates/run_picl_public_sync_20260806.trigger updates/run_nlos_consistency_20260806.trigger
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc
          git add -A
          git diff --cached --stat
          git commit -m 'Synchronize citation-traced NLOS records and survey artifacts'
          git push origin HEAD:"$HEAD_BRANCH"
