name: Diagnose vector-optics NLOS LaTeX build

on:
  pull_request:
    branches: [master]
    paths:
      - updates/vector_optics_nlos_20260729_pr.trigger

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply source integration
        run: python3 scripts/run_vector_optics_nlos_20260729_v2.py
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-pictures poppler-utils
      - name: Run build and preserve diagnostics
        shell: bash
        run: |
          set +e
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex > build-1.stdout 2>&1
          s1=$?
          if [ $s1 -eq 0 ]; then bibtex bare_jrnl > bibtex.stdout 2>&1; sb=$?; else sb=99; fi
          if [ $s1 -eq 0 ] && [ $sb -eq 0 ]; then pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex > build-2.stdout 2>&1; s2=$?; else s2=99; fi
          if [ $s1 -eq 0 ] && [ $sb -eq 0 ] && [ $s2 -eq 0 ]; then pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex > build-3.stdout 2>&1; s3=$?; else s3=99; fi
          printf 'pdflatex1=%s bibtex=%s pdflatex2=%s pdflatex3=%s\n' "$s1" "$sb" "$s2" "$s3" > build-status.txt
          cat build-status.txt
          tail -n 100 build-1.stdout || true
          exit 0
      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: vector-optics-latex-diagnostic
          path: |
            build-status.txt
            build-1.stdout
            build-2.stdout
            build-3.stdout
            bibtex.stdout
            bare_jrnl.log
            bare_jrnl.blg
          if-no-files-found: warn
          retention-days: 2
