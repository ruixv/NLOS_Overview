name: Integrate vector and planar optics NLOS lineage

on:
  push:
    branches: [master]
    paths:
      - updates/vector_optics_nlos_20260728.trigger
      - .github/workflows/integrate-vector-optics-nlos-20260728.yml

permissions:
  contents: write

concurrency:
  group: integrate-vector-optics-nlos-20260728
  cancel-in-progress: false

jobs:
  integrate-build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded source integration
        run: python3 scripts/integrate_vector_optics_nlos_20260728.py

      - name: Install LaTeX and PDF validation tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-pictures \
            ghostscript poppler-utils

      - name: Cleanly rebuild survey PDF
        run: |
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex

      - name: Validate citations and public artifacts
        run: |
          set -euo pipefail
          for doi in \
            10.1515/nanoph-2023-0655 \
            10.1002/lpor.202300909 \
            10.1016/j.eng.2024.11.013; do
            test "$(grep -F -c "$doi" README.md)" -eq 1
            test "$(grep -F -c "$doi" index.html)" -eq 1
            test "$(grep -F -c "$doi" egbib_merged_20260711.bib)" -eq 1
          done
          for key in \
            zhaoLCPlanarNLOS2024 \
            wangVectorialMultiviewNLOS2024 \
            guoVectorialDigitelligentNLOS2025; do
            test "$(grep -F -c "$key" article/2active.tex)" -eq 2
            test "$(grep -F -c "@article{$key," egbib_merged_20260711.bib)" -eq 1
            grep -F -q "$key" bare_jrnl.aux
          done
          test "$(grep -o '{cat:' index.html | wc -l)" -eq 235
          ! grep -E -q 'Citation .* undefined|There were undefined citations|Repeated entry' bare_jrnl.log
          pdfinfo bare_jrnl.pdf | grep -q '^Pages:'
          pdftotext bare_jrnl.pdf bare_jrnl.txt
          grep -F -q 'Vectorial Digitelligent Optics' bare_jrnl.txt
          grep -F -q 'Liquid Crystal Planar Optical Elements' bare_jrnl.txt
          grep -F -q 'Vectorial-Optics-Enabled Multi-View' bare_jrnl.txt
          rm -f bare_jrnl.txt

      - name: Remove one-run integration tooling
        run: |
          rm -f scripts/integrate_vector_optics_nlos_20260728.py
          rm -f .github/workflows/integrate-vector-optics-nlos-20260728.yml
          rm -f updates/vector_optics_nlos_20260728.trigger

      - name: Commit synchronized sources and rebuilt PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html article/2active.tex bare_jrnl.tex \
            egbib_merged_20260711.bib bare_jrnl.pdf \
            updates/2026-07-28-vector-optics-nlos-lineage.md \
            scripts/integrate_vector_optics_nlos_20260728.py \
            .github/workflows/integrate-vector-optics-nlos-20260728.yml \
            updates/vector_optics_nlos_20260728.trigger
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "Integrate vector and planar optics NLOS lineage"
          git push origin HEAD:master
