name: Integrate 22 Aug NLOS citation-trace updates

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/integrate-citation-trace-20260822.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Apply citation-trace integration
        run: |
          python3 scripts/integrate_citation_trace_20260822.py

      - name: Validate source synchronization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          readme=Path('README.md').read_text(encoding='utf-8')
          corpus=Path('data/papers-source.html').read_text(encoding='utf-8')
          passive=Path('article/3passive.tex').read_text(encoding='utf-8')
          data=Path('article/4datadriven.tex').read_text(encoding='utf-8')
          bib=Path('egbib_merged_20260711.bib').read_text(encoding='utf-8')
          tex=Path('bare_jrnl.tex').read_text(encoding='utf-8')
          records=[
            ('10.1007/s44267-026-00125-1','shenMARMOT2025','MARMOT: Masked Autoencoder for Modeling Transient Imaging'),
            ('10.1117/12.3055610','liHyperspectralAutoencoderNLOS2025','Passive Non-Line-of-Sight Imaging via Hyperspectral Autoencoder Net'),
            ('10.37188/OPE.20263409.1496','yuEnhancedReflectionUNet2026','Enhanced reflection U-Net reconstruction for passive Non-Line-of-Sight imaging'),
            ('10.1117/12.3049350','wangPassiveHiddenTargetDetection2024','Passive non-line-of-sight imaging for hidden target detection'),
          ]
          failures=[]
          for doi,key,title in records:
            tests=[
              (doi in readme, f'README DOI {doi}'),
              (doi in corpus, f'V2 DOI {doi}'),
              (doi.lower() in bib.lower(), f'Bib DOI {doi}'),
              (bib.lower().count('{'+key.lower()+',')==1, f'unique Bib key {key}'),
            ]
            for ok,msg in tests:
              print(('PASS: ' if ok else 'FAIL: ')+msg)
              if not ok: failures.append(msg)
          for key in ['liHyperspectralAutoencoderNLOS2025','yuEnhancedReflectionUNet2026','wangPassiveHiddenTargetDetection2024']:
            ok=key in passive
            print(('PASS: ' if ok else 'FAIL: ')+'passive survey cites '+key)
            if not ok: failures.append('passive survey '+key)
          ok='shenMARMOT2025' in data and 'one million confocal NLOS transients' in data
          print(('PASS: ' if ok else 'FAIL: ')+'MARMOT final-version survey prose')
          if not ok: failures.append('MARMOT survey prose')
          marmot_start=bib.find('@article{shenMARMOT2025')
          marmot_slice=bib[marmot_start:marmot_start+1100] if marmot_start>=0 else ''
          tests=[
            ('Visual Intelligence 4, 22 (2026)' in readme,'README MARMOT final venue'),
            ('Visual Intelligence 4, 22 (2026)' in corpus,'V2 MARMOT final venue'),
            ('journal = {Visual Intelligence}' in bib,'Bib MARMOT final venue'),
            ('Sun, Qilin' in marmot_slice and 'Xia, Suan' not in marmot_slice,'MARMOT final author list'),
            ('<b>317</b><span>tracked latest entries</span>' in corpus,'V2 tracked count 317'),
            ('22 August 2026' in tex,'survey provenance date'),
          ]
          for ok,msg in tests:
            print(('PASS: ' if ok else 'FAIL: ')+msg)
            if not ok: failures.append(msg)
          if failures: raise AssertionError('; '.join(failures))
          PY

      - name: Add LaTeX compatibility shim
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bare_jrnl.tex'); s=p.read_text(encoding='utf-8')
          shim="\\makeatletter\n\\providecommand{\\HyperLocalCurrentHref}{\\@currentHref}\n\\makeatother\n"
          anchor="\\usepackage{hyperref}\n"
          if shim not in s:
            if s.count(anchor)!=1: raise RuntimeError('hyperref anchor not unique')
            p.write_text(s.replace(anchor,anchor+shim,1),encoding='utf-8')
          PY

      - name: Build survey PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: bare_jrnl.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Validate citations and rebuilt PDF
        run: |
          set -euo pipefail
          test -s bare_jrnl.pdf
          python3 - <<'PY'
          from pathlib import Path
          aux=Path('bare_jrnl.aux').read_text(encoding='utf-8',errors='ignore')
          bbl=Path('bare_jrnl.bbl').read_text(encoding='utf-8',errors='ignore')
          keys=['shenMARMOT2025','liHyperspectralAutoencoderNLOS2025','yuEnhancedReflectionUNet2026','wangPassiveHiddenTargetDetection2024']
          for key in keys:
            if key not in aux: raise AssertionError('citation key missing from aux: '+key)
            if key not in bbl: raise AssertionError('bibliography key missing from bbl: '+key)
          if Path('bare_jrnl.pdf').stat().st_size < 100000:
            raise AssertionError('rebuilt PDF unexpectedly small')
          PY
          pdftotext bare_jrnl.pdf /tmp/nlos.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          txt=Path('/tmp/nlos.txt').read_text(encoding='utf-8',errors='ignore').lower()
          norm=re.sub(r'[^a-z0-9]+',' ',txt)
          groups={
            'MARMOT':['marmot','visual intelligence','transverse'],
            'HAENet':['hyperspectral autoencoder','spatial spectral'],
            'enhanced U-Net':['enhanced reflection','passive non line of sight'],
            'hidden target detection':['hidden target detection','passive non line of sight'],
          }
          for label,toks in groups.items():
            if not all(re.sub(r'[^a-z0-9]+',' ',t.lower()).strip() in norm for t in toks):
              raise AssertionError('PDF semantic tokens missing for '+label)
          PY

      - name: Render PDF endpoints
        run: |
          set -euo pipefail
          pages=$(pdfinfo bare_jrnl.pdf | awk '/^Pages:/ {print $2}')
          test -n "$pages"
          mkdir -p /tmp/render
          pdftoppm -f 1 -singlefile -png -r 100 bare_jrnl.pdf /tmp/render/first
          pdftoppm -f "$pages" -singlefile -png -r 100 bare_jrnl.pdf /tmp/render/last
          test -s /tmp/render/first.png
          test -s /tmp/render/last.png

      - name: Record update note
        run: |
          cat > updates/2026-08-22-marmot-passive-citation-trace.md <<'EOF'
          # MARMOT final venue and passive-NLOS citation-trace gaps — 22 August 2026

          This guarded update performs two kinds of maintenance discovered in the same literature pass.

          1. MARMOT is upgraded from the 2025 arXiv record to its final Visual Intelligence publication: volume 4, article 22 (2026), DOI 10.1007/s44267-026-00125-1, published 18 August 2026. The final author list replaces Suan Xia with Qilin Sun; the publisher acknowledgements thank Xia for data-acquisition support rather than listing him as an author. The arXiv identifier remains auxiliary metadata.
          2. Three citation-traced passive-NLOS gaps are added: Li et al., hyperspectral autoencoder / HAENet (Proc. SPIE 13542, 135421R, 2025, DOI 10.1117/12.3055610); Wang et al., passive hidden-target detection (Proc. SPIE 13282, 132820R, 2024, DOI 10.1117/12.3049350); and Yu et al., enhanced-reflection U-Net reconstruction (Optics and Precision Engineering 34(9), 1496–1506, 2026, DOI 10.37188/OPE.20263409.1496).

          README, the canonical V2 paper explorer/timeline, passive/data-driven survey prose, merged bibliography, LaTeX source, and rebuilt PDF were validated together before commit. The V2 tracked-entry count changes from 314 to 317 because MARMOT already existed and only its venue/metadata changed.
          EOF

      - name: Commit synchronized artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/integrate-citation-trace-20260822.yml scripts/integrate_citation_trace_20260822.py
          git add README.md data/papers-source.html article/3passive.tex article/4datadriven.tex egbib_merged_20260711.bib bare_jrnl.tex bare_jrnl.pdf updates/2026-08-22-marmot-passive-citation-trace.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalize MARMOT venue and close passive NLOS gaps'
          git push origin HEAD:master