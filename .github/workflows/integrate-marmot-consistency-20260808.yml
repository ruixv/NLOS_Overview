name: Finalize NLOS citation-trace artifacts

on:
  push:
    branches: [automation-isac-nlos-20260808]
    paths: ['.github/trigger-marmot-consistency-20260808']
  pull_request:
    branches: [master]
    paths: ['.github/trigger-marmot-consistency-20260808']

permissions:
  contents: write

jobs:
  integrate:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation-isac-nlos-20260808
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded source updates
        run: |
          python tools/integrate_marmot_consistency_20260808.py
          python tools/integrate_rough_relay_mmwave_20260809.py
      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-pictures texlive-publishers texlive-bibtex-extra poppler-utils
      - name: Rebuild survey PDF
        run: |
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          test -s bare_jrnl.pdf
          ! grep -Eq 'Citation .* undefined|There were undefined references|There were undefined citations' bare_jrnl.log
      - name: Validate source and PDF consistency
        run: |
          grep -Fq 'MARMOT: Masked Autoencoder for Modeling Transient Imaging' README.md
          grep -Fq 'shenMARMOT2025' article/5newscenes.tex
          grep -Fq 'Masked transient pretraining' article/5newscenes.tex
          test "$(grep -Fo 'shenMARMOT2025' egbib_merged_20260711.bib | wc -l)" -eq 1
          grep -Fq 'Feasibility of Non-Line-of-Sight Integrated Sensing and Communication at mmWave' README.md
          grep -Fq 'International Conference on Telecommunications (ICT 2026), 25–30' README.md
          grep -Fq 'tosiFeasibilityISACNLOS2024' article/5newscenes.tex
          grep -Fq 'tosiReliableISACNLOS2026' article/5newscenes.tex
          grep -Fq 'IEEE Transactions on Mobile Computing 25(5), 6002–6016 (2026)' README.md
          grep -Fq '10.1109/TMC.2025.3634623' README.md
          grep -Fq 'IEEE TMC 25(5), 6002–6016 (2026)' index.html
          grep -Fq 'final journal record appears in IEEE Transactions on Mobile Computing' article/5newscenes.tex
          test "$(grep -Fo 'shiN2LoS2025' egbib_merged_20260711.bib | wc -l)" -eq 1
          grep -Fq 'Cheng, Qingqing and Yuan, Weijie' egbib_merged_20260711.bib
          grep -Fq 'doi = {10.1109/TMC.2025.3634623}' egbib_merged_20260711.bib
          grep -Fq 'pages = {6002--6016}' egbib_merged_20260711.bib
          grep -Fq 'through 9 August 2026' bare_jrnl.tex
          grep -Fq '**Update run: 9 August 2026.**' README.md
          grep -Fq 'Updated 9 August 2026' index.html
          grep -Fq '<div class="stat"><b>274</b><span>tracked latest entries</span></div>' index.html
          test -s updates/2026-08-09-marmot-n2los-final-venue.md

          grep -Fq 'Leveraging Rough-Relay-Surface Scattering for Non-Line-of-Sight mmWave Radar Sensing' README.md
          grep -Fq 'Double Sparse Structure-Enhanced mmWave NLOS Imaging Under Multiangle Relay Surface' README.md
          grep -Fq 'Bayesian Compressive Sensing for NLOS mmWave Imaging Under Imprecisely Multiangle Surfaces' README.md
          grep -Fq 'mmWave-Based Relay Reflector Reconstruction for LiDAR-Free Around-Corner Human Sensing' README.md
          grep -Fq 'Hydra: Exploiting Multi-Bounce Scattering for Beyond-Field-of-View mmWave Radar' README.md
          grep -Fq 'MmWave NLOS Sensing under Rough Relay Surface: Challenges and Solutions' README.md
          grep -Fq 'Rough, uncertain, and unknown relay geometry in mmWave NLOS' article/5newscenes.tex
          for key in xuRoughRelayMmWave2024 xuDoubleSparseMmWave2024 xuBayesianMmWave2025 lvRelayReflector2025 mehrotraHydra2024 liuRoughRelaySurvey2026; do
            test "$(grep -Fo "$key" egbib_merged_20260711.bib | wc -l)" -eq 1
            grep -Fq "$key" article/5newscenes.tex
          done
          test -s updates/2026-08-09-rough-relay-mmwave-citation-trace.md

          pdftotext bare_jrnl.pdf /tmp/nlos.txt
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('/tmp/nlos.txt').read_text(encoding='utf-8',errors='ignore')
          norm=lambda s: re.sub(r'[\s\-‐‑‒–—]+','',s).lower()
          compact=norm(text)
          required=[
            'MARMOT',
            'masked transient pretraining',
            'Feasibility of Non-Line-of-Sight Integrated Sensing and Communication at mmWave',
            'Reliable Non-Line-of-Sight Intrusion Detection with Integrated Sensing and Communications Hardware',
            'Single-Tag mmWave Backscatter for Robust Non-Line-of-Sight Localization',
            '10.1109/TMC.2025.3634623',
            'Leveraging Rough-Relay-Surface Scattering for Non-Line-of-Sight mmWave Radar Sensing',
            'Double Sparse Structure-Enhanced mmWave NLOS Imaging Under Multiangle Relay Surface',
            'Bayesian Compressive Sensing for NLOS mmWave Imaging Under Imprecisely Multiangle Surfaces',
            'mmWave-Based Relay Reflector Reconstruction for LiDAR-Free Around-Corner Human Sensing',
            'Hydra: Exploiting Multi-Bounce Scattering for Beyond-Field-of-View mmWave Radar',
            'MmWave NLOS Sensing under Rough Relay Surface: Challenges and Solutions']
          for token in required:
              assert norm(token) in compact, f'missing PDF token: {token}'
          assert re.search(r'IEEE\s+Transactions\s+on\s+Mobile\s+Computing',text,re.I)
          assert re.search(r'6002\s*[–-]+\s*6016',text)
          print('PDF semantic checks passed.')
          PY
          pages=$(pdfinfo bare_jrnl.pdf | awk '/^Pages:/ {print $2}')
          pdftoppm -png -f 1 -singlefile -r 120 bare_jrnl.pdf /tmp/nlos-first
          radar_page=''
          for p in $(seq 1 "$pages"); do
            if pdftotext -f "$p" -l "$p" bare_jrnl.pdf - | grep -Fq 'rough relay'; then radar_page="$p"; break; fi
          done
          test -n "$radar_page"
          pdftoppm -png -f "$radar_page" -singlefile -r 120 bare_jrnl.pdf /tmp/nlos-radar
          python - <<'PY'
          import os,struct
          for path in ['/tmp/nlos-first.png','/tmp/nlos-radar.png']:
              assert os.path.getsize(path)>10000
              with open(path,'rb') as f: sig=f.read(24)
              assert sig[:8]==b'\x89PNG\r\n\x1a\n'
              w,h=struct.unpack('>II',sig[16:24]); assert w>500 and h>500
          print('Rendered-page structural checks passed.')
          PY
      - name: Commit validated public artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html article/5newscenes.tex bare_jrnl.tex egbib_merged_20260711.bib bare_jrnl.pdf updates/2026-08-09-marmot-n2los-final-venue.md updates/2026-08-08-isac-nlos-final-venue-citation-trace.md updates/2026-08-09-rough-relay-mmwave-citation-trace.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate rough-relay mmWave citation-trace papers'
            git push origin HEAD:automation-isac-nlos-20260808
          fi
