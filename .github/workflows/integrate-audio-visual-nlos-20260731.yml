name: Integrate audio-visual acoustic NLOS vehicle detection

on:
  push:
    branches: [master]
    paths:
      - updates/audio_visual_nlos_20260731.trigger
  pull_request:
    branches: [master]
    paths:
      - updates/audio_visual_nlos_20260731.pr-trigger

permissions:
  contents: write

concurrency:
  group: integrate-audio-visual-nlos-20260731
  cancel-in-progress: false

jobs:
  integrate-build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Install Python bibliography dependency
        run: python3 -m pip install --user bibtexparser

      - name: Apply synchronized source integration
        run: |
          python3 -m py_compile scripts/integrate_audio_visual_nlos_20260731.py
          python3 scripts/integrate_audio_visual_nlos_20260731.py
          python3 scripts/merge_nlos_bibliography.py

      - name: Install LaTeX and PDF validation tools
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get -o Acquire::Retries=5 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-pictures texlive-publishers \
            ghostscript poppler-utils

      - name: Cleanly rebuild survey PDF
        run: |
          old_hash=$(git hash-object bare_jrnl.pdf)
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          new_hash=$(git hash-object bare_jrnl.pdf)
          if [ "$new_hash" = "$old_hash" ]; then
            echo "PDF rebuild is byte-identical after successful compilation: $new_hash"
          else
            echo "PDF blob: $old_hash -> $new_hash"
          fi

      - name: Validate synchronized sources, citations, website, and PDF
        shell: bash
        run: |
          set -euo pipefail
          readme_row='| 2026 | [Non-line-of-sight vehicle detection via audio-visual fusion](https://doi.org/10.1109/ICASSP55912.2026.11465095)'
          index_title='title:"Non-line-of-sight vehicle detection via audio-visual fusion"'
          key='wangAudioVisualNLOS2026'
          test "$(grep -F -c "$readme_row" README.md)" -eq 1
          test "$(grep -F -c "$index_title" index.html)" -eq 1
          test "$(grep -E -c "^@inproceedings\\{$key," egbib_merged_20260711.bib)" -eq 1
          test "$(grep -F -c "$key" article/5newscenes.tex)" -eq 1
          grep -F -q "$key" bare_jrnl.aux
          grep -F -q "$key" bare_jrnl.bbl
          grep -F -q 'scene-aware audio-visual acoustic NLOS vehicle detection synchronized' bare_jrnl.tex
          actual=$(grep -o '{cat:' index.html | wc -l)
          declared=$(grep -oP '<b>\K[0-9]+(?=</b><span>tracked latest entries</span>)' index.html)
          test "$declared" -eq "$actual"
          ! grep -E -q 'Citation .* undefined|There were undefined citations|Repeated entry' bare_jrnl.log
          pdfinfo bare_jrnl.pdf | grep -q '^Pages:'
          pdftotext -layout bare_jrnl.pdf bare_jrnl.txt
          python3 - <<'PY'
          from pathlib import Path
          text = ''.join(ch for ch in Path('bare_jrnl.txt').read_text(errors='ignore').lower() if ch.isalnum())
          needles = [
              'nonlineofsightvehicledetectionviaaudiovisualfusion',
              'sceneawarenetwork',
              'fullyoccluded',
          ]
          missing = [needle for needle in needles if needle not in text]
          print('PDF semantic checks:', 'ok' if not missing else f'missing {missing}')
          if missing:
              raise SystemExit(1)
          PY
          pages=$(pdfinfo bare_jrnl.pdf | awk '/^Pages:/ {print $2}')
          mkdir -p .pdf_render_check
          pdftoppm -f 1 -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/first >/dev/null 2>&1
          pdftoppm -f "$pages" -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/last >/dev/null 2>&1
          test -s .pdf_render_check/first.png
          test -s .pdf_render_check/last.png
          rm -rf .pdf_render_check bare_jrnl.txt

      - name: Remove one-run integration tooling
        run: |
          rm -f scripts/integrate_audio_visual_nlos_20260731.py
          rm -f .github/workflows/integrate-audio-visual-nlos-20260731.yml
          rm -f updates/audio_visual_nlos_20260731.trigger
          rm -f updates/audio_visual_nlos_20260731.pr-trigger

      - name: Commit, rebase, and push synchronized artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "Integrate audio-visual acoustic NLOS vehicle detection"
          for attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            readme_row='| 2026 | [Non-line-of-sight vehicle detection via audio-visual fusion](https://doi.org/10.1109/ICASSP55912.2026.11465095)'
            index_title='title:"Non-line-of-sight vehicle detection via audio-visual fusion"'
            key='wangAudioVisualNLOS2026'
            test "$(grep -F -c "$readme_row" README.md)" -eq 1
            test "$(grep -F -c "$index_title" index.html)" -eq 1
            test "$(grep -E -c "^@inproceedings\\{$key," egbib_merged_20260711.bib)" -eq 1
            test "$(grep -F -c "$key" article/5newscenes.tex)" -eq 1
            actual=$(grep -o '{cat:' index.html | wc -l)
            declared=$(grep -oP '<b>\K[0-9]+(?=</b><span>tracked latest entries</span>)' index.html)
            test "$declared" -eq "$actual"
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push raced with another master update; retrying after rebase ($attempt/3)."
            sleep 5
          done
          exit 1
