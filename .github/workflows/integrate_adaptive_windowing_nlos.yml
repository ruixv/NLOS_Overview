name: Integrate adaptive-windowing NLOS paper

on:
  push:
    branches: [master]
    paths:
      - updates/TRIGGER_2026-07-27_ADAPTIVE_WINDOWING.md
  pull_request:
    branches: [master]
    paths:
      - updates/TRIGGER_2026-07-27_ADAPTIVE_WINDOWING.md

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Stop cleanly when trigger has already been removed
        id: guard
        shell: bash
        run: |
          if [[ -f updates/TRIGGER_2026-07-27_ADAPTIVE_WINDOWING.md ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install bibliography and LaTeX dependencies
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install bibtexparser
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra poppler-utils

      - name: Integrate verified paper across public and survey artifacts
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          title = "Adaptive windowing for photon-efficient non-line-of-sight imaging under high ambient light"
          doi = "10.1364/OE.575419"
          key = "miaoAdaptiveWindowingNLOS2025"

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          assert title not in readme, "README already contains the paper"
          all_day_row = "| 2026 | [All-day non-line-of-sight imaging based on Si-SPAD and phase-congruency-based structured ε-regularization]"
          assert all_day_row in readme, "README insertion anchor is missing"
          new_row = (
              "| 2025 | [Adaptive windowing for photon-efficient non-line-of-sight imaging under high ambient light]"
              "(https://doi.org/10.1364/OE.575419) — Miao et al. | Optics Express 2025 | "
              "Models signal and background photon arrivals, clusters correlated pixels to estimate matched-filter windows, "
              "and applies per-pixel short temporal gates with total-variation reconstruction. AW-NLOS remains effective at "
              "SBR 2.12 and 0.02 detected signal photons per pixel, improving SSIM by approximately 0.5 at 42 mW laser power. |\n"
          )
          readme = readme.replace(all_day_row, new_row + all_day_row, 1)
          timeline_anchor = "2026 ── Yin et al.: Si-SPAD and phase-congruency regularization enable 200 m all-day active NLOS under 94,314 lx sunlight [Optics and Lasers in Engineering]"
          assert timeline_anchor in readme, "README timeline anchor is missing"
          timeline_line = "   │     Miao et al.: adaptive photon-arrival windowing suppresses overwhelming daylight background before TV-regularized transient reconstruction [Optics Express]\n"
          readme = readme.replace(timeline_anchor, timeline_line + timeline_anchor, 1)
          readme_path.write_text(readme, encoding="utf-8")

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          assert title not in index, "website already contains the paper"
          index_anchor = '{cat:"latest active",title:"All-day non-line-of-sight imaging based on Si-SPAD and phase-congruency-based structured ε-regularization"'
          assert index_anchor in index, "website paper-object anchor is missing"
          new_object = (
              '      {cat:"latest active",title:"Adaptive windowing for photon-efficient non-line-of-sight imaging under high ambient light",'
              'authors:"Miao et al.",year:2025,venue:"Optics Express 2025",url:"https://doi.org/10.1364/OE.575419",'
              'key:"AW-NLOS uses probabilistic signal/background models, spatio-temporal pixel clustering, matched-filter window estimation, per-pixel short temporal gates, and TV regularization to recover hidden geometry under extreme ambient light and photon starvation."},\n'
          )
          index = index.replace(index_anchor, new_object + "      " + index_anchor, 1)
          pattern = re.compile(r'(<div class="tl"><div class="year">2025</div><div class="tl-body"><strong>.*?<p>)(.*?)(</p></div></div>)', re.S)
          match = pattern.search(index)
          assert match, "website 2025 timeline block is missing"
          timeline_sentence = " Miao et al. added probabilistic adaptive temporal windowing that suppresses ambient detections before TV-regularized transient inversion, strengthening the photon-efficient daylight branch."
          index = index[:match.start(2)] + match.group(2) + timeline_sentence + index[match.end(2):]
          count = len(re.findall(r'\{cat:"', index))
          index, substitutions = re.subn(
              r'<div class="stat"><b>\d+</b><span>tracked latest entries</span></div>',
              f'<div class="stat"><b>{count}</b><span>tracked latest entries</span></div>',
              index,
              count=1,
          )
          assert substitutions == 1, "website tracked-entry counter was not updated"
          index_path.write_text(index, encoding="utf-8")

          active_path = Path("article/2active.tex")
          active = active_path.read_text(encoding="utf-8")
          assert key not in active, "active survey already cites the paper"
          assert "yinAllDayNLOS2026" in active, "active-table citation anchor is missing"
          active = active.replace("yinAllDayNLOS2026", key + ",yinAllDayNLOS2026", 1)
          heading = r"\noindent \textbf{All-day SPAD NLOS imaging.}"
          assert heading in active, "all-day survey paragraph anchor is missing"
          paragraph = r"""\noindent \textbf{Adaptive photon-arrival windowing under high ambient light.}
          Miao~\etal~address the acquisition-side failure mode in which a weak three-bounce response is overwhelmed by temporally broad background detections~\cite{miaoAdaptiveWindowingNLOS2025}. AW-NLOS first models the arrival statistics of signal and noise, then amplifies correlated weak events through spatio-temporal pixel clustering so that a matched filter can estimate a target-dependent temporal support. Per-pixel short-duration range windows reject most ambient photons before total-variation-regularized hidden-volume reconstruction. Measured experiments report recovery at an SBR of 2.12 and only 0.02 signal photons per pixel, together with an approximately 0.5 SSIM improvement over conventional processing at 42~mW illumination. This work forms an acquisition-aware bridge between photon-efficient single-photon statistics and the subsequent detector/regularizer co-design for all-day, long-range NLOS.

\vspace{0.8mm}
"""
          active = active.replace(heading, paragraph + heading, 1)
          active_path.write_text(active, encoding="utf-8")

          bib_path = Path("egbib_20260727_adaptive_windowing.bib")
          assert not bib_path.exists(), "dated bibliography supplement already exists"
          bib_path.write_text(r"""@article{miaoAdaptiveWindowingNLOS2025,
            author = {Miao, Jinye and Cai, Fuyao and Qin, Taotao and Bai, Lianfa and Guo, Enlai and Shi, Yingjie and Han, Jing},
            title = {Adaptive Windowing for Photon-Efficient Non-Line-of-Sight Imaging under High Ambient Light},
            journal = {Optics Express},
            volume = {33},
            number = {21},
            pages = {44522--44542},
            year = {2025},
            month = {October},
            publisher = {Optica Publishing Group},
            doi = {10.1364/OE.575419},
            url = {https://doi.org/10.1364/OE.575419}
          }
""", encoding="utf-8")

          tex_path = Path("bare_jrnl.tex")
          tex = tex_path.read_text(encoding="utf-8")
          marker = "% 27 July 2026 citation trace: adaptive photon-arrival windowing for high-ambient-light NLOS synchronized.\n"
          assert marker not in tex
          tex = tex.replace("%% bare_jrnl.tex\n", "%% bare_jrnl.tex\n" + marker, 1)
          tex_path.write_text(tex, encoding="utf-8")

          note = Path("updates/2026-07-27-adaptive-windowing-nlos.md")
          note.write_text("""# Adaptive-windowing NLOS citation trace — 27 July 2026

Integrated the DOI-verified Optics Express paper **Adaptive windowing for photon-efficient non-line-of-sight imaging under high ambient light** (Miao et al., 2025, DOI `10.1364/OE.575419`).

The paper is direct active transient NLOS reconstruction rather than incidental photon-processing work. It cites the Velten, LCT, and f-k milestones and contributes probabilistic signal/background modeling, spatio-temporal weak-event clustering, matched-filter window estimation, per-pixel temporal gating, and TV-regularized reconstruction for extreme ambient-light and photon-starved conditions.

Updated README, website explorer and 2025 timeline, active-system table and literature review, dated BibTeX source, consolidated bibliography, survey marker, and rebuilt PDF.
""", encoding="utf-8")
          PY

          python scripts/merge_nlos_bibliography.py
          git checkout -- updates/2026-07-11-bibliography-deduplication.md

      - name: Clean build and validate the survey PDF
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc bare_jrnl.pdf
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          doi = "10.1364/OE.575419"
          key = "miaoAdaptiveWindowingNLOS2025"
          files = {
              "README": Path("README.md").read_text(encoding="utf-8"),
              "website": Path("index.html").read_text(encoding="utf-8"),
              "active": Path("article/2active.tex").read_text(encoding="utf-8"),
              "bib": Path("egbib_merged_20260711.bib").read_text(encoding="utf-8"),
              "bbl": Path("bare_jrnl.bbl").read_text(encoding="utf-8", errors="ignore"),
              "log": Path("bare_jrnl.log").read_text(encoding="utf-8", errors="ignore"),
          }
          assert files["README"].count(doi) == 1
          assert files["website"].count(doi) == 1
          assert files["active"].count(key) >= 2
          assert files["bib"].count(doi) == 1
          assert key in files["bbl"] or "Adaptive Windowing" in files["bbl"]
          assert not re.search(r"Citation.*undefined|undefined citations", files["log"], re.I)
          count = len(re.findall(r'\{cat:"', files["website"]))
          assert f'<div class="stat"><b>{count}</b><span>tracked latest entries</span></div>' in files["website"]
          assert Path("bare_jrnl.pdf").stat().st_size > 100000
          subprocess.run(["pdfinfo", "bare_jrnl.pdf"], check=True, stdout=subprocess.PIPE, text=True)
          subprocess.run(["pdftotext", "bare_jrnl.pdf", "bare_jrnl.txt"], check=True)
          pdf_text = Path("bare_jrnl.txt").read_text(encoding="utf-8", errors="ignore")
          assert "Adaptive windowing" in pdf_text or "Adaptive Windowing" in pdf_text
          pages = int(re.search(r"Pages:\s+(\d+)", subprocess.check_output(["pdfinfo", "bare_jrnl.pdf"], text=True)).group(1))
          Path("_renders").mkdir(exist_ok=True)
          subprocess.run(["pdftoppm", "-f", "1", "-singlefile", "-png", "-r", "110", "bare_jrnl.pdf", "_renders/first"], check=True)
          subprocess.run(["pdftoppm", "-f", str(pages), "-singlefile", "-png", "-r", "110", "bare_jrnl.pdf", "_renders/last"], check=True)
          assert Path("_renders/first.png").stat().st_size > 10000
          assert Path("_renders/last.png").stat().st_size > 10000
          print(f"Adaptive-windowing integration validated; website tracks {count} entries; PDF has {pages} pages")
          PY
          rm -rf _renders bare_jrnl.txt

      - name: Commit synchronized sources and rebuilt PDF
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html article/2active.tex bare_jrnl.tex \
            egbib_20260727_adaptive_windowing.bib egbib_merged_20260711.bib \
            updates/2026-07-27-adaptive-windowing-nlos.md bare_jrnl.pdf
          git commit -m "Integrate adaptive-windowing NLOS under ambient light"
          git push origin master

      - name: Remove one-shot workflow and trigger
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          git pull --ff-only origin master
          git rm -f updates/TRIGGER_2026-07-27_ADAPTIVE_WINDOWING.md .github/workflows/integrate_adaptive_windowing_nlos.yml
          git commit -m "Remove completed adaptive-windowing integration trigger"
          git push origin master
