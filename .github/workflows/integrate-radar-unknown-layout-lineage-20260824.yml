name: Integrate radar unknown-layout NLOS lineage

on:
  pull_request:
    branches: [master]
    paths:
      - updates/.trigger-radar-unknown-layout-lineage-20260824
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Apply verified radar lineage integration
        run: |
          python3 scripts/integrate_radar_unknown_layout_lineage_20260824.py
          git diff --check

      - name: Repair escaped survey newlines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('article/5newscenes.tex')
          s=p.read_text(encoding='utf-8')
          bad='methods below.\\n\\n'
          if bad in s:
            s=s.replace(bad, 'methods below.\n\n', 1)
          start=s.find('From assumed relay geometry to joint environment and target inference.')
          section=s[start:start+5000] if start >= 0 else ''
          if r'\n\n' in section:
            raise RuntimeError('literal escaped paragraph newline remains in inserted radar lineage prose')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Add LaTeX compatibility shim if needed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bare_jrnl.tex'); s=p.read_text(encoding='utf-8')
          shim="\\makeatletter\n\\providecommand{\\HyperLocalCurrentHref}{\\@currentHref}\n\\makeatother\n"
          anchor="\\usepackage{hyperref}\n"
          if shim not in s:
            if s.count(anchor)!=1: raise RuntimeError('hyperref anchor not unique')
            p.write_text(s.replace(anchor,anchor+shim,1),encoding='utf-8')
          PY

      - name: Validate synchronized source artifacts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          papers=[
            ('chenJointNLOSLayoutTargets2022','10.1109/TGRS.2022.3182429'),
            ('wuAssociationHypothesisNLOS2023','10.1109/TGRS.2023.3250831'),
            ('zhuDoDDoANLOS2023','10.1109/TIM.2023.3323003'),
            ('xuMultiDomainFeaturesNLOS2023','10.1109/JSEN.2023.3325976'),
            ('chenDriverAssistanceNLOS2023','10.1109/TVT.2022.3227971'),
            ('xuMultiDomainAssociationNLOS2025','10.1007/978-981-96-3576-4_29'),
            ('zhouNLOSBuildingLayoutInSAR2025','10.1109/IGARSS55030.2025.11244088'),
          ]
          readme=Path('README.md').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          corpus=Path('data/papers-source.html').read_text(encoding='utf-8')
          radar=Path('article/5newscenes.tex').read_text(encoding='utf-8')
          bib=Path('egbib_merged_20260711.bib').read_text(encoding='utf-8')
          tex=Path('bare_jrnl.tex').read_text(encoding='utf-8')
          bad=[]
          for key,doi in papers:
            checks=[
              (doi.lower() in readme.lower(),f'{doi} README'),
              (doi.lower() in corpus.lower(),f'{doi} V2 corpus'),
              (key in radar,f'{key} survey citation'),
              (len(re.findall(r'@[A-Za-z]+\{'+re.escape(key)+r',',bib,flags=re.I))==1,f'{key} unique BibTeX key'),
              (len(re.findall(r'(?mi)^\s*doi\s*=\s*\{'+re.escape(doi)+r'\}\s*,?\s*$',bib))==1,f'{doi} unique DOI field'),
            ]
            for ok,msg in checks:
              print(('PASS: ' if ok else 'FAIL: ')+msg)
              if not ok: bad.append(msg)
          arr_start=corpus.find('    const papers=['); arr_end=corpus.find('\n    ];',arr_start)
          if arr_start<0 or arr_end<0: bad.append('canonical V2 paper array boundaries')
          else:
            tracked=corpus[arr_start:arr_end].count('{cat:')
            m=re.search(r'<div class="stat"><b>(\d+)</b><span>tracked latest entries</span>',corpus)
            displayed=int(m.group(1)) if m else -1
            ok=(tracked==displayed and tracked>0)
            print(('PASS: ' if ok else 'FAIL: ')+f'V2 tracked count {displayed} vs {tracked}')
            if not ok: bad.append('V2 tracked-entry count mismatch')
          date_checks=[
            ('**Update run: 24 August 2026.**' in readme,'README update date'),
            ('Updated 24 Aug 2026' in index,'index living-survey date'),
            ('Updated 24 August 2026' in corpus and 'Last updated: 24 August 2026' in corpus,'V2 date markers'),
            ('24 August 2026 radar citation trace' in tex,'survey provenance date'),
          ]
          for ok,msg in date_checks:
            print(('PASS: ' if ok else 'FAIL: ')+msg)
            if not ok: bad.append(msg)
          if bad: raise AssertionError('; '.join(bad))
          PY

      - name: Build survey PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: bare_jrnl.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Validate citations and rebuilt PDF
        run: |
          set -euo pipefail
          test -s bare_jrnl.pdf
          python3 - <<'PY'
          from pathlib import Path
          keys=[
            'chenJointNLOSLayoutTargets2022',
            'wuAssociationHypothesisNLOS2023',
            'zhuDoDDoANLOS2023',
            'xuMultiDomainFeaturesNLOS2023',
            'chenDriverAssistanceNLOS2023',
            'xuMultiDomainAssociationNLOS2025',
            'zhouNLOSBuildingLayoutInSAR2025',
          ]
          aux=Path('bare_jrnl.aux').read_text(encoding='utf-8',errors='ignore')
          bbl=Path('bare_jrnl.bbl').read_text(encoding='utf-8',errors='ignore')
          bad=[]
          for key in keys:
            ok=key in aux
            print(('PASS: ' if ok else 'FAIL: ')+key+' in AUX')
            if not ok: bad.append(key+' AUX')
            ok=key in bbl
            print(('PASS: ' if ok else 'FAIL: ')+key+' in BBL')
            if not ok: bad.append(key+' BBL')
          if Path('bare_jrnl.pdf').stat().st_size <= 100000:
            bad.append('rebuilt PDF size')
          if bad: raise AssertionError('; '.join(bad))
          PY
          pdftotext bare_jrnl.pdf /tmp/nlos.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          txt=Path('/tmp/nlos.txt').read_text(encoding='utf-8',errors='ignore').lower()
          txt=txt.replace('‐','-').replace('‑','-').replace('–','-')
          txt=re.sub(r'-\s+', '', txt)
          txt=re.sub(r'\s+',' ',txt)
          groups=[
            ['sparsitydriven','sparsity driven'],
            ['association and hypothesis','association'],
            ['dod','doa'],
            ['multidomain','multi domain'],
            ['matrixpencil','matrix pencil'],
            ['layout relocation','relocation','tomosar'],
          ]
          missing=[]
          for alts in groups:
            if not any(a in txt for a in alts): missing.append('/'.join(alts))
          if missing: raise AssertionError('rebuilt PDF missing radar-lineage semantics: '+', '.join(missing))
          PY

      - name: Render PDF endpoints
        run: |
          set -euo pipefail
          pages=$(pdfinfo bare_jrnl.pdf | awk '/^Pages:/ {print $2}')
          mkdir -p /tmp/render
          pdftoppm -f 1 -singlefile -png -r 100 bare_jrnl.pdf /tmp/render/first
          pdftoppm -f "$pages" -singlefile -png -r 100 bare_jrnl.pdf /tmp/render/last
          test -s /tmp/render/first.png && test -s /tmp/render/last.png

      - name: Record literature update note
        run: |
          cat > updates/2026-08-24-radar-unknown-layout-lineage.md <<'EOF'
          # Radar unknown-layout / multi-domain NLOS lineage synchronized — 24 August 2026

          A forward-citation and predecessor-tracing pass around the repository's radar/mmWave NLOS milestones exposed a missing 2022–2025 lineage that precedes the already catalogued reflective-surface estimation, ghost-correlation, diffraction, distributed tracking, and joint environment/target work.

          Integrated final published records:
          - Chen et al., “Joint Estimation of NLOS Building Layout and Targets via Sparsity-Driven Approach,” IEEE TGRS 60 (2022), DOI 10.1109/TGRS.2022.3182429.
          - Wu et al., “NLOS Positioning for Building Layout and Target Based on Association and Hypothesis Method,” IEEE TGRS 61 (2023), DOI 10.1109/TGRS.2023.3250831.
          - Zhu et al., “Non-Line-of-Sight Targets Localization Algorithm via Joint Estimation of DoD and DoA,” IEEE TIM 72 (2023), DOI 10.1109/TIM.2023.3323003.
          - Xu et al., “Multi-Domain Features-Based NLOS Target Localization Method for MIMO UWB Radar,” IEEE Sensors Journal 23(23) (2023), DOI 10.1109/JSEN.2023.3325976.
          - Chen et al., “Non-Line-of-Sight Multi-Target Localization Algorithm for Driver-Assistance Radar System,” IEEE TVT 72(4) (2023), DOI 10.1109/TVT.2022.3227971.
          - Xu et al., “Joint Estimation of NLOS Building Layout and Target Position Based on Multi-domain Association,” Springer LNEE 1379 / 4th ICAUS 2024 proceedings (published 2025), DOI 10.1007/978-981-96-3576-4_29.
          - Zhou et al., “On the NLOS Building Layout Relocation in Array InSAR 3D Imaging,” IEEE IGARSS 2025, DOI 10.1109/IGARSS55030.2025.11244088.

          Survey trajectory: known-layout multipath localization → joint sparse layout/target estimation → association/hypothesis and multi-domain path recognition → DoD/DoA and driver-assistance multi-target inference → spatial/time-domain joint layout recovery → array-InSAR NLOS layout relocation → the repository's existing 2025–2026 unknown-reflector and joint environment/target methods.

          README, V2 corpus/timeline, radar survey prose, merged BibTeX, LaTeX source, rebuilt PDF, citation resolution, PDF semantic text, and endpoint rendering were validated together before commit.
          EOF

      - name: Commit synchronized public artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html data/papers-source.html article/5newscenes.tex bare_jrnl.tex bare_jrnl.pdf egbib_merged_20260711.bib updates/2026-08-24-radar-unknown-layout-lineage.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Integrate radar unknown-layout and multi-domain NLOS lineage'
          git push origin HEAD:master