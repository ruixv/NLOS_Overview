name: Integrate pending NLOS citation traces 20260803

on:
  push:
    branches: [master]
    paths:
      - updates/run_pending_nlos_20260803.trigger

permissions:
  contents: write

concurrency:
  group: integrate-pending-nlos-20260803
  cancel-in-progress: false

jobs:
  integrate-build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply bounded source updates
        run: |
          python3 -m pip install --user bibtexparser
          python3 -m py_compile scripts/integrate_audio_visual_nlos_20260731.py
          python3 -m py_compile scripts/integrate_frequency_domain_reconstruction_20260801.py
          python3 scripts/integrate_audio_visual_nlos_20260731.py
          python3 scripts/integrate_frequency_domain_reconstruction_20260801.py
          python3 scripts/merge_nlos_bibliography.py

      - name: Install LaTeX and PDF tools
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get -o Acquire::Retries=5 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-pictures texlive-publishers \
            ghostscript poppler-utils

      - name: Rebuild survey PDF
        run: |
          old_hash=$(git hash-object bare_jrnl.pdf)
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          rm -f bare_jrnl.aux bare_jrnl.out bare_jrnl.toc
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          new_hash=$(git hash-object bare_jrnl.pdf)
          echo "PDF blob: $old_hash -> $new_hash"
          test "$old_hash" != "$new_hash"

      - name: Validate synchronized artifacts
        shell: bash
        run: |
          set -euo pipefail
          pdfinfo bare_jrnl.pdf | tee /tmp/bare_jrnl_pdfinfo.txt
          pdftotext -layout bare_jrnl.pdf bare_jrnl.txt
          python3 - <<'PY'
          from pathlib import Path
          import re

          records = [
              {
                  "title": "Non-line-of-sight vehicle detection via audio-visual fusion",
                  "key": "wangAudioVisualNLOS2026",
                  "section": "article/5newscenes.tex",
                  "pdf_terms": ["audiovisualfusion"],
              },
              {
                  "title": "Non-Line-of-Sight Imaging Using Raster Scanning at NIR Wavelength",
                  "key": "roueinfarNIRRaster2025",
                  "section": "article/2active.tex",
                  "pdf_terms": ["rasterscanningatnirwavelength"],
              },
              {
                  "title": "Fast non-line-of-sight imaging based on product-convolution expansions",
                  "key": "xuProductConvolutionNLOS2022",
                  "section": "article/2active.tex",
                  "pdf_terms": ["productconvolutionexpansions"],
              },
              {
                  "title": "Non-line-of-sight virtual modulated range migration imaging based on super-resolution histograms",
                  "key": "tianVirtualRMAHistograms2025",
                  "section": "article/2active.tex",
                  "pdf_terms": ["virtualmodulatedrangemigration"],
              },
          ]

          readme = Path("README.md").read_text(errors="ignore")
          html = Path("index.html").read_text(errors="ignore")
          bib = Path("egbib_merged_20260711.bib").read_text(errors="ignore")
          aux = Path("bare_jrnl.aux").read_text(errors="ignore")
          bbl = Path("bare_jrnl.bbl").read_text(errors="ignore")
          log = Path("bare_jrnl.log").read_text(errors="ignore")
          pdf = "".join(ch for ch in Path("bare_jrnl.txt").read_text(errors="ignore").lower() if ch.isalnum())

          failures = []
          for record in records:
              title, key = record["title"], record["key"]
              for label, text in (("README", readme), ("website", html)):
                  if title not in text:
                      failures.append(f"{label} missing title: {title}")
              entry_count = len(re.findall(rf"@\w+\s*\{{\s*{re.escape(key)}\s*,", bib, flags=re.I))
              if entry_count != 1:
                  failures.append(f"merged bibliography has {entry_count} entries for {key}")
              for label, text in (("AUX", aux), ("BBL", bbl)):
                  if key not in text:
                      failures.append(f"{label} missing citation key: {key}")
              section = Path(record["section"]).read_text(errors="ignore")
              if key not in section:
                  failures.append(f"{record['section']} missing citation key: {key}")
              for term in record["pdf_terms"]:
                  if term not in pdf:
                      failures.append(f"PDF text missing semantic term: {term}")

          if re.search(r"Citation .* undefined|There were undefined citations|Repeated entry", log):
              failures.append("LaTeX log contains unresolved or repeated citations")

          actual = html.count("{cat:")
          declared = re.findall(r"<b>(\d+)</b><span>tracked latest entries</span>", html)
          if len(declared) != 1:
              failures.append(f"website entry counter matched {len(declared)} times")
          elif int(declared[0]) != actual:
              failures.append(f"website entry counter says {declared[0]} but explorer contains {actual}")

          if failures:
              raise SystemExit("Artifact validation failed:\n- " + "\n- ".join(failures))
          print(f"Validated {len(records)} synchronized papers and {actual} website entries")
          PY
          pages=$(awk '/^Pages:/ {print $2}' /tmp/bare_jrnl_pdfinfo.txt)
          test -n "$pages"
          mkdir -p .pdf_render_check
          pdftoppm -f 1 -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/first >/dev/null 2>&1
          pdftoppm -f "$pages" -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/last >/dev/null 2>&1
          test -s .pdf_render_check/first.png
          test -s .pdf_render_check/last.png
          rm -rf .pdf_render_check bare_jrnl.txt

      - name: Commit validated public artifacts to integration branch
        shell: bash
        env:
          OUTPUT_BRANCH: automation/generated-pending-nlos-${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html article/2active.tex article/5newscenes.tex \
            bare_jrnl.tex egbib_merged_20260711.bib bare_jrnl.pdf \
            updates/2026-07-31-audio-visual-and-nir-nlos.md \
            updates/2026-08-01-frequency-domain-reconstruction.md
          if git diff --cached --quiet; then
            echo "No public-artifact changes were generated"
            exit 1
          fi
          git checkout -b "$OUTPUT_BRANCH"
          git commit -m "Integrate pending NLOS citation traces"
          git push origin "$OUTPUT_BRANCH"
          echo "Generated branch: $OUTPUT_BRANCH"
