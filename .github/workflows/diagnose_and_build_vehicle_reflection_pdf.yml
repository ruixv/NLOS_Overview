name: Diagnose and build vehicle-reflection survey PDF
on:
  push:
    branches: [master]
    paths:
      - updates/TRIGGER_2026-07-28_VEHICLE_REFLECTION_PDF_DIAGNOSTIC.md
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: latex
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: bare_jrnl.tex
          latexmk_use_xelatex: false
      - if: always()
        shell: bash
        env:
          LATEX_OUTCOME: ${{ steps.latex.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if test -s bare_jrnl.pdf && test -f bare_jrnl.bbl && grep -q "takatoriReflectedImageNLOS2020" bare_jrnl.bbl && grep -q "shengVehicleReflectionObstacle2026" bare_jrnl.bbl; then
            python - <<'PY'
          from pathlib import Path
          p=Path('updates/2026-07-28-vehicle-reflection-nlos-lineage.md')
          s=p.read_text(encoding='utf-8').replace('PDF compilation is staged separately and is not claimed by this source-integration commit.','`bare_jrnl.pdf` was rebuilt after all four automotive vehicle-reflection citation keys resolved.')
          p.write_text(s,encoding='utf-8')
          Path('updates/2026-07-28-vehicle-reflection-lineage-pdf-validation.txt').write_text('LaTeX action succeeded; all four lineage citation keys resolved in the generated bibliography.\n',encoding='utf-8')
          PY
            git add bare_jrnl.pdf updates/2026-07-28-vehicle-reflection-nlos-lineage.md updates/2026-07-28-vehicle-reflection-lineage-pdf-validation.txt
            git commit -m "Rebuild survey for automotive vehicle-reflection NLOS lineage"
          else
            printf 'latex_action_outcome=%s\npdf_exists=%s\nbbl_exists=%s\n' "$LATEX_OUTCOME" "$(test -s bare_jrnl.pdf && echo yes || echo no)" "$(test -f bare_jrnl.bbl && echo yes || echo no)" > updates/2026-07-28-vehicle-reflection-pdf-diagnostic.txt
            test -f bare_jrnl.log && tail -n 120 bare_jrnl.log >> updates/2026-07-28-vehicle-reflection-pdf-diagnostic.txt || true
            git add updates/2026-07-28-vehicle-reflection-pdf-diagnostic.txt
            git commit -m "Record vehicle-reflection PDF build diagnostic"
          fi
          git push origin master
