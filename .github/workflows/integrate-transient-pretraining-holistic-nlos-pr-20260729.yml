name: PR-dispatch transient pretraining and holistic NLOS integration

on:
  pull_request:
    branches: [master]
    paths:
      - updates/transient_pretraining_holistic_nlos_20260729_pr.trigger

permissions:
  contents: write

concurrency:
  group: integrate-transient-pretraining-holistic-nlos-20260729
  cancel-in-progress: false

jobs:
  integrate-build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply guarded source integration
        run: python3 scripts/run_transient_pretraining_holistic_nlos_20260729.py

      - name: Install LaTeX and PDF validation tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-pictures texlive-publishers \
            ghostscript poppler-utils

      - name: Cleanly rebuild survey PDF
        run: |
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex

      - name: Validate public artifacts, citations, and PDF
        shell: bash
        run: |
          set -euo pipefail
          for title in \
            'Real-Time and High-Fidelity Non-Line-of-Sight Imaging' \
            'MARMOT: Masked Autoencoder for Modeling Transient Imaging' \
            'HOLI-1-to-3: Transient-Enhanced Holistic Image-to-3D Generation'; do
            test "$(grep -F -c "$title" README.md)" -eq 1
          done
          test "$(grep -F -c 'Real-Time and High-Fidelity Non-Line-of-Sight Imaging' index.html)" -eq 1
          test "$(grep -F -c 'MARMOT: Masked Autoencoder for Modeling Transient Imaging' index.html)" -eq 1
          test "$(grep -F -c 'HOLI-1-to-3: Transient-Enhanced Holistic Image-to-3D Generation' index.html)" -eq 1
          for doi in \
            10.21203/rs.3.rs-8336286/v1 \
            10.48550/arXiv.2506.08470 \
            10.1109/TPAMI.2024.3463875; do
            test "$(grep -F -c "$doi" egbib_merged_20260711.bib)" -eq 2
          done
          for key in jiUnifiedRealTimeNLOS2026 shenMARMOT2025 shenHOLI1to3TPAMI2025; do
            test "$(grep -E -c "^@(article|misc)\\{$key," egbib_merged_20260711.bib)" -eq 1
            grep -F -q "$key" bare_jrnl.aux
          done
          test "$(grep -F -c 'jiUnifiedRealTimeNLOS2026' article/2active.tex)" -eq 1
          test "$(grep -F -c 'shenMARMOT2025' article/4datadriven.tex)" -eq 1
          test "$(grep -F -c 'shenHOLI1to3TPAMI2025' article/4datadriven.tex)" -eq 1
          actual=$(grep -o '{cat:' index.html | wc -l)
          declared=$(grep -oP '<b>\K[0-9]+(?=</b><span>tracked latest entries</span>)' index.html)
          test "$declared" -eq "$actual"
          grep -F -q '**Update run: 29 July 2026.**' README.md
          grep -F -q 'Last updated: 29 July 2026' index.html
          ! grep -E -q 'Citation .* undefined|There were undefined citations|Repeated entry' bare_jrnl.log
          pdfinfo bare_jrnl.pdf | grep -q '^Pages:'
          pdftotext -layout bare_jrnl.pdf bare_jrnl.txt
          python3 - <<'PY'
          from pathlib import Path
          text = ''.join(ch for ch in Path('bare_jrnl.txt').read_text(errors='ignore').lower() if ch.isalnum())
          needles = [
              'maskedtransientpretraining',
              'holi1to3',
              'unifiedreconstructionacrossnlosscenarioclasses',
          ]
          missing = [n for n in needles if n not in text]
          print('PDF semantic checks:', 'ok' if not missing else f'missing {missing}')
          if missing:
              raise SystemExit(1)
          PY
          pages=$(pdfinfo bare_jrnl.pdf | awk '/^Pages:/ {print $2}')
          mkdir -p .pdf_render_check
          pdftoppm -f 1 -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/first >/dev/null 2>&1
          pdftoppm -f "$pages" -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/last >/dev/null 2>&1
          test -s .pdf_render_check/first.png
          test -s .pdf_render_check/last.png
          rm -rf .pdf_render_check bare_jrnl.txt

      - name: Remove one-run integration tooling
        run: |
          rm -f scripts/integrate_transient_pretraining_holistic_nlos_20260729.py
          rm -f scripts/run_transient_pretraining_holistic_nlos_20260729.py
          rm -f .github/workflows/integrate-transient-pretraining-holistic-nlos-20260729.yml
          rm -f .github/workflows/integrate-transient-pretraining-holistic-nlos-pr-20260729.yml
          rm -f updates/transient_pretraining_holistic_nlos_20260729.trigger
          rm -f updates/transient_pretraining_holistic_nlos_20260729_pr.trigger

      - name: Commit synchronized sources and rebuilt PDF to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "Integrate transient pretraining and holistic NLOS lineage"
          git push origin HEAD:master
