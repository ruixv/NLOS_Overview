name: Validate all-day SPAD NLOS public-artifact synchronization

on:
  pull_request:
    branches: [master]
    paths:
      - updates/2026-07-26-all-day-spad-public-trigger.md

permissions:
  contents: write

jobs:
  synchronize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/all-day-spad-public-20260726
          fetch-depth: 0

      - name: Install PDF text validator
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y poppler-utils

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Synchronize README and website
        run: python3 scripts/sync_all_day_spad_public_20260726.py

      - name: Validate website JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          assert '<script>' in html and '</script>' in html
          Path('/tmp/nlos-index.js').write_text(html.split('<script>', 1)[1].split('</script>', 1)[0], encoding='utf-8')
          PY
          node --check /tmp/nlos-index.js

      - name: Verify existing survey and PDF coverage
        run: |
          grep -Fq 'yinAllDayNLOS2026' article/2active.tex
          grep -Fq '@article{yinAllDayNLOS2026' egbib_merged_20260711.bib
          test -s bare_jrnl.pdf
          pdftotext bare_jrnl.pdf /tmp/survey.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = re.sub(r'\s+', ' ', Path('/tmp/survey.txt').read_text(encoding='utf-8', errors='ignore')).lower()
          assert 'all-day spad nlos imaging' in text
          assert '94,314' in text
          print('Survey PDF already contains the all-day SPAD milestone.')
          PY

      - name: Commit synchronized public artifacts to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html
          if git diff --cached --quiet; then
            echo 'No public-artifact changes were needed.'
            exit 0
          fi
          git commit -m 'Expose all-day SPAD NLOS milestone in public artifacts [skip ci]'
          git push origin HEAD:automation/all-day-spad-public-20260726
