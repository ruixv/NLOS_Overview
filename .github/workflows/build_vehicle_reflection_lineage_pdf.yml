name: Build vehicle-reflection lineage survey PDF
on:
  push:
    branches: [master]
    paths:
      - updates/TRIGGER_2026-07-28_VEHICLE_REFLECTION_PDF.md
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra poppler-utils
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc bare_jrnl.pdf
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdftotext bare_jrnl.pdf bare_jrnl.txt
          grep -q "Vehicle-body reflections as opportunistic automotive NLOS sensors" bare_jrnl.txt
          grep -q "NLOS Obstacle Position Estimation from Reflected Image" bare_jrnl.txt
          grep -q "Object Detection Method for Non-Line-of-Sight Obstacles" bare_jrnl.txt
          pdfinfo bare_jrnl.pdf | grep -q "Pages:"
          pages=$(pdfinfo bare_jrnl.pdf | awk '/Pages:/ {print $2}')
          python - "$pages" <<'PY'
          from pathlib import Path
          import sys
          p=Path('updates/2026-07-28-vehicle-reflection-nlos-lineage.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('PDF compilation is staged separately and is not claimed by this source-integration commit.',f'`bare_jrnl.pdf` was cleanly rebuilt after all four citation keys resolved; the resulting survey has {sys.argv[1]} pages.')
          p.write_text(s,encoding='utf-8')
          Path('updates/2026-07-28-vehicle-reflection-lineage-pdf-validation.txt').write_text(f'Validated four-paper PDF integration; pages: {sys.argv[1]}.\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bare_jrnl.pdf updates/2026-07-28-vehicle-reflection-nlos-lineage.md updates/2026-07-28-vehicle-reflection-lineage-pdf-validation.txt
          git commit -m "Rebuild survey for automotive vehicle-reflection NLOS lineage"
          git push origin master
