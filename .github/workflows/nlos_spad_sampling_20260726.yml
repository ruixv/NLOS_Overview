name: Integrate SPAD timing and low-sampling NLOS papers

on:
  push:
    branches: [master]
    paths:
      - "tools/integrate_spad_sampling_20260726.py"
      - ".github/workflows/nlos_spad_sampling_20260726.yml"
      - ".github/nlos_spad_sampling_20260726.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nlos-spad-sampling-20260726
  cancel-in-progress: false

jobs:
  integrate-build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Integrate verified records
        run: python tools/integrate_spad_sampling_20260726.py

      - name: Install LaTeX and PDF validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            texlive-science texlive-publishers texlive-bibtex-extra poppler-utils

      - name: Clean-build survey PDF
        run: |
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log \
                bare_jrnl.out bare_jrnl.toc bare_jrnl.lof bare_jrnl.lot
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex

      - name: Validate LaTeX, bibliography, and PDF
        shell: bash
        run: |
          set -euo pipefail
          test -s bare_jrnl.pdf
          ! grep -Eiq "undefined citations|Citation .* undefined|There were undefined references|multiply defined" bare_jrnl.log
          ! grep -Eiq "Repeated entry|already defined" bare_jrnl.blg
          pdfinfo bare_jrnl.pdf | tee /tmp/pdfinfo.txt
          pages=$(awk '/^Pages:/ {print $2}' /tmp/pdfinfo.txt)
          test -n "$pages" && test "$pages" -gt 0
          pdftotext bare_jrnl.pdf /tmp/bare_jrnl.txt
          grep -Fiq "SPAD-array timing calibration" /tmp/bare_jrnl.txt
          grep -Fiq "Poisson optimization and semantic scan allocation" /tmp/bare_jrnl.txt
          grep -Fiq "Semantic-guided under sampling" /tmp/bare_jrnl.txt
          grep -Fiq "10.1364/OE.584776" egbib_merged_20260711.bib
          grep -Fiq "10.1117/12.3091668" egbib_merged_20260711.bib
          grep -Fiq "10.1117/12.3094245" egbib_merged_20260711.bib

      - name: Verify updater is idempotent
        run: |
          python tools/integrate_spad_sampling_20260726.py
          git diff --exit-code -- README.md index.html article/2active.tex article/0abstract.tex bare_jrnl.tex egbib_merged_20260711.bib

      - name: Commit synchronized public artifacts and rebuilt PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html article/2active.tex article/0abstract.tex \
                  bare_jrnl.tex egbib_merged_20260711.bib bare_jrnl.pdf
          if git diff --cached --quiet; then
            echo "No synchronized source or PDF changes were needed."
            exit 0
          fi
          git commit -m "Integrate SPAD timing and low-sampling NLOS lineage"
          git push origin HEAD:master
