name: Integrate vehicle-reflection NLOS obstacle localization

on:
  push:
    branches: [master]
    paths:
      - updates/TRIGGER_2026-07-28_VEHICLE_REFLECTION_OBSTACLE.md

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop cleanly when trigger has already been removed
        id: guard
        shell: bash
        run: |
          if [[ -f updates/TRIGGER_2026-07-28_VEHICLE_REFLECTION_OBSTACLE.md ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install bibliography and LaTeX dependencies
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install bibtexparser
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra poppler-utils

      - name: Integrate verified paper across public and survey artifacts
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          title = "Feasibility study of non-line-of-sight obstacle location estimation using reflected images from in-vehicle sensors"
          doi = "10.1016/j.iatssr.2026.02.007"
          key = "shengVehicleReflectionObstacle2026"
          kozawa_title = "Estimating the 3D Position of Hidden Humans Using Reflections on Vehicle Bodies"

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          assert title not in readme and doi not in readme, "README already contains the paper"
          lines = readme.splitlines(keepends=True)
          kozawa_idx = next((i for i, line in enumerate(lines) if kozawa_title in line and line.startswith("| 2026 |")), None)
          assert kozawa_idx is not None, "README Kozawa insertion anchor is missing"
          new_row = (
              "| 2026 | [Feasibility study of non-line-of-sight obstacle location estimation using reflected images from in-vehicle sensors]"
              "(https://doi.org/10.1016/j.iatssr.2026.02.007) — Sheng, Takatori | IATSS Research 2026 | "
              "Uses stereo observations of virtual obstacle images reflected by adjacent vehicle bodies, estimates the virtual-image position, and geometrically folds it across the reflective surface to recover the hidden obstacle location. Real-world reflection-frequency observations and 1/6-scale experiments report 4.3 cm mean localization error at 1.7–3.7 m; this is passive/specular NLOS localization rather than hidden-scene reconstruction. |\n"
          )
          lines.insert(kozawa_idx + 1, new_row)
          readme = "".join(lines)
          timeline_lines = readme.splitlines(keepends=True)
          timeline_idx = next((i for i, line in enumerate(timeline_lines) if "Kozawa et al." in line and "vehicle" in line.lower()), None)
          if timeline_idx is not None:
              timeline_line = "   │     Sheng and Takatori: stereo vehicle-body reflections provide feasibility-validated passive NLOS obstacle localization for intelligent transportation [IATSS Research]\n"
              timeline_lines.insert(timeline_idx + 1, timeline_line)
              readme = "".join(timeline_lines)
          else:
              year_anchor = next((i for i, line in enumerate(timeline_lines) if line.startswith("2026 ──")), None)
              assert year_anchor is not None, "README 2026 timeline anchor is missing"
              timeline_lines.insert(year_anchor + 1, "   │     Sheng and Takatori: stereo vehicle-body reflections provide feasibility-validated passive NLOS obstacle localization for intelligent transportation [IATSS Research]\n")
              readme = "".join(timeline_lines)
          readme_path.write_text(readme, encoding="utf-8")

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          assert title not in index and doi not in index, "website already contains the paper"
          index_lines = index.splitlines(keepends=True)
          object_idx = next((i for i, line in enumerate(index_lines) if kozawa_title in line and "{cat:" in line), None)
          assert object_idx is not None, "website Kozawa paper-object anchor is missing"
          new_object = (
              '      {cat:"latest passive localization specular automotive",title:"Feasibility study of non-line-of-sight obstacle location estimation using reflected images from in-vehicle sensors",'
              'authors:"Sheng and Takatori",year:2026,venue:"IATSS Research 2026",url:"https://doi.org/10.1016/j.iatssr.2026.02.007",'
              'key:"Stereo observations of vehicle-body reflections recover a virtual-image position and fold it across the estimated reflective surface to localize hidden road obstacles. Real-world reflection-frequency observations and 1/6-scale experiments report 4.3 cm mean error; this is passive/specular localization rather than hidden-scene reconstruction."},\n'
          )
          index_lines.insert(object_idx + 1, new_object)
          index = "".join(index_lines)
          pattern = re.compile(r'(<div class="tl"><div class="year">2026</div><div class="tl-body"><strong>.*?<p>)(.*?)(</p></div></div>)', re.S)
          match = pattern.search(index)
          assert match, "website 2026 timeline block is missing"
          sentence = " Sheng and Takatori further showed that stereo observations of reflections on adjacent vehicles can localize NLOS road obstacles by estimating and geometrically unfolding their virtual images, expanding passive specular NLOS toward traffic safety."
          index = index[:match.start(2)] + match.group(2) + sentence + index[match.end(2):]
          count = len(re.findall(r'\{cat:"', index))
          index, substitutions = re.subn(
              r'<div class="stat"><b>\d+</b><span>tracked latest entries</span></div>',
              f'<div class="stat"><b>{count}</b><span>tracked latest entries</span></div>',
              index,
              count=1,
          )
          assert substitutions == 1, "website tracked-entry counter was not updated"
          index_path.write_text(index, encoding="utf-8")

          passive_path = Path("article/3passive.tex")
          passive = passive_path.read_text(encoding="utf-8")
          assert key not in passive, "passive survey already cites the paper"
          anchor = "The output is task-oriented passive NLOS localization rather than a complete hidden image or surface reconstruction."
          assert anchor in passive, "passive survey vehicle-reflection anchor is missing"
          paragraph = r"""

\vspace{0.8mm}
\noindent \textbf{Stereo vehicle-reflection obstacle localization.}
Sheng and Takatori studied whether reflections already present on adjacent vehicles can act as opportunistic NLOS sensors for an ego vehicle~\cite{shengVehicleReflectionObstacle2026}. A stereo camera estimates the three-dimensional position of a virtual obstacle image and then geometrically folds that estimate across the reflective surface to recover the hidden obstacle location. Real-world observation and microscopic traffic simulation quantify how often usable reflections occur, while $1/6$-scale experiments report a mean error of 4.3~cm for targets 1.7--3.7~m ahead and an approximately 45~mm RMS error under reflective-surface orientation changes. This feasibility study complements reflection-based hidden-pedestrian localization by explicitly analyzing traffic availability and scale, but its output remains obstacle position rather than hidden appearance or complete geometry.
"""
          passive = passive.replace(anchor, anchor + paragraph, 1)
          passive_path.write_text(passive, encoding="utf-8")

          bib_path = Path("egbib_20260728_vehicle_reflection_obstacle.bib")
          assert not bib_path.exists(), "dated bibliography supplement already exists"
          bib_path.write_text(r"""@article{shengVehicleReflectionObstacle2026,
  author = {Sheng, Baili and Takatori, Yusuke},
  title = {Feasibility Study of Non-Line-of-Sight Obstacle Location Estimation Using Reflected Images from In-Vehicle Sensors},
  journal = {IATSS Research},
  volume = {50},
  number = {1},
  pages = {777--785},
  year = {2026},
  month = {April},
  publisher = {Elsevier},
  doi = {10.1016/j.iatssr.2026.02.007},
  url = {https://doi.org/10.1016/j.iatssr.2026.02.007}
}
""", encoding="utf-8")

          tex_path = Path("bare_jrnl.tex")
          tex = tex_path.read_text(encoding="utf-8")
          marker = "% 28 July 2026 citation/keyword trace: stereo vehicle-reflection NLOS obstacle localization synchronized.\n"
          assert marker not in tex
          tex = tex.replace("%% bare_jrnl.tex\n", "%% bare_jrnl.tex\n" + marker, 1)
          tex_path.write_text(tex, encoding="utf-8")

          note = Path("updates/2026-07-28-vehicle-reflection-obstacle-localization.md")
          note.write_text("""# Vehicle-reflection NLOS obstacle localization — 28 July 2026

Integrated the DOI-verified IATSS Research paper **Feasibility study of non-line-of-sight obstacle location estimation using reflected images from in-vehicle sensors** (Baili Sheng and Yusuke Takatori, 2026, DOI `10.1016/j.iatssr.2026.02.007`).

The paper is tightly adjacent passive/specular NLOS sensing rather than an incidental transportation citation. A stereo in-vehicle camera observes virtual obstacle images reflected by adjacent vehicles, estimates the virtual-image position, and geometrically folds it across the reflective surface to recover the hidden obstacle location. Real-world observation and traffic simulation analyze reflection availability; 1/6-scale experiments report 4.3 cm mean error for targets at 1.7–3.7 m and approximately 45 mm RMS error under surface-angle changes.

Updated README, website explorer and 2026 timeline, passive survey prose, dated and consolidated BibTeX, survey trace marker, and rebuilt PDF. The work is categorized as localization rather than hidden-scene reconstruction.
""", encoding="utf-8")
          PY

          python scripts/merge_nlos_bibliography.py
          git checkout -- updates/2026-07-11-bibliography-deduplication.md || true

      - name: Clean build and validate the survey PDF
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc bare_jrnl.pdf
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          doi = "10.1016/j.iatssr.2026.02.007"
          key = "shengVehicleReflectionObstacle2026"
          files = {
              "README": Path("README.md").read_text(encoding="utf-8"),
              "website": Path("index.html").read_text(encoding="utf-8"),
              "passive": Path("article/3passive.tex").read_text(encoding="utf-8"),
              "bib": Path("egbib_merged_20260711.bib").read_text(encoding="utf-8"),
              "bbl": Path("bare_jrnl.bbl").read_text(encoding="utf-8", errors="ignore"),
              "log": Path("bare_jrnl.log").read_text(encoding="utf-8", errors="ignore"),
          }
          assert files["README"].count(doi) == 1
          assert files["website"].count(doi) == 1
          assert files["passive"].count(key) == 1
          assert files["bib"].count(doi) == 1
          assert key in files["bbl"] or "Feasibility Study" in files["bbl"]
          assert not re.search(r"Citation.*undefined|undefined citations", files["log"], re.I)
          count = len(re.findall(r'\{cat:"', files["website"]))
          assert f'<div class="stat"><b>{count}</b><span>tracked latest entries</span></div>' in files["website"]
          assert Path("bare_jrnl.pdf").stat().st_size > 100000
          info = subprocess.check_output(["pdfinfo", "bare_jrnl.pdf"], text=True)
          pages = int(re.search(r"Pages:\s+(\d+)", info).group(1))
          subprocess.run(["pdftotext", "bare_jrnl.pdf", "bare_jrnl.txt"], check=True)
          pdf_text = Path("bare_jrnl.txt").read_text(encoding="utf-8", errors="ignore")
          assert "vehicle-reflection obstacle localization" in pdf_text.lower() or "stereo vehicle-reflection" in pdf_text.lower()
          assert "Feasibility Study of Non-Line-of-Sight Obstacle" in pdf_text or "Feasibility study of non-line-of-sight obstacle" in pdf_text
          Path("_renders").mkdir(exist_ok=True)
          subprocess.run(["pdftoppm", "-f", "1", "-singlefile", "-png", "-r", "110", "bare_jrnl.pdf", "_renders/first"], check=True)
          subprocess.run(["pdftoppm", "-f", str(pages), "-singlefile", "-png", "-r", "110", "bare_jrnl.pdf", "_renders/last"], check=True)
          assert Path("_renders/first.png").stat().st_size > 10000
          assert Path("_renders/last.png").stat().st_size > 10000
          print(f"Vehicle-reflection integration validated; website tracks {count} entries; PDF has {pages} pages")
          PY
          rm -rf _renders bare_jrnl.txt

      - name: Commit synchronized sources and rebuilt PDF
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html article/3passive.tex bare_jrnl.tex \
            egbib_20260728_vehicle_reflection_obstacle.bib egbib_merged_20260711.bib \
            updates/2026-07-28-vehicle-reflection-obstacle-localization.md bare_jrnl.pdf
          git commit -m "Integrate vehicle-reflection NLOS obstacle localization"
          git push origin master

      - name: Remove one-shot workflow and trigger
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          git pull --ff-only origin master
          git rm -f updates/TRIGGER_2026-07-28_VEHICLE_REFLECTION_OBSTACLE.md .github/workflows/integrate_vehicle_reflection_obstacle.yml
          git commit -m "Remove completed vehicle-reflection integration trigger"
          git push origin master
