name: Integrate 8 August NLOS forward-citation audit

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/integrate-forward-citation-20260808.yml
      - scripts/sync_forward_citation_cluster_20260808.py

permissions:
  contents: write

concurrency:
  group: nlos-forward-citation-20260808
  cancel-in-progress: false

jobs:
  integrate-build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: automation/nlos-forward-citation-20260808
          fetch-depth: 0

      - name: Apply guarded source updates
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/sync_forward_citation_cluster_20260808.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/sync_forward_citation_cluster_20260808.py')
          s = p.read_text()
          old = 'pattern = rf"(?m)^    {year} ── .+$"'
          new = 'pattern = rf"(?m)^{year} ── .+$"'
          if s.count(old) != 1:
              raise SystemExit(f'timeline-regex patch expected one match, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 scripts/sync_forward_citation_cluster_20260808.py

      - name: Install LaTeX and PDF validation tools
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get -o Acquire::Retries=5 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-pictures texlive-publishers \
            ghostscript poppler-utils

      - name: Rebuild survey PDF
        run: |
          set -euo pipefail
          old_hash=$(git hash-object bare_jrnl.pdf)
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc bare_jrnl.txt
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          new_hash=$(git hash-object bare_jrnl.pdf)
          echo "PDF blob: $old_hash -> $new_hash"
          test "$old_hash" != "$new_hash"

      - name: Validate cross-artifact consistency
        run: |
          set -euo pipefail
          pdftotext -layout bare_jrnl.pdf bare_jrnl.txt
          pdfinfo bare_jrnl.pdf | tee /tmp/pdfinfo.txt
          python3 - <<'PY'
          from pathlib import Path
          import re

          titles = [
              "Non-line-of-sight sound source localization based on block sparse Bayesian learning and second-order edge diffraction",
              "Non-Line-of-Sight Multi-Target Localization in T-Junctions Using Ray Tracing of mmWave Radar",
              "BiScalar-AA: BiScalar Attentive Amplifier Network for NLOS Object Detection and Tracking Using Millimeter-Wave Radar",
              "Two-Stage Attention Network for NLOS Object Detection and Tracking Using mmWave Radar",
              "CornerRadar: RF-Based Indoor Localization Around Corners",
              "Mosaic: Leveraging Diverse Reflector Geometries for Omnidirectional Around-Corner Automotive Radar",
              "Around the Corner mmWave Imaging in Practical Environments",
              "Non-Line-of-Sight 3D Object Reconstruction via mmWave Surface Normal Estimation",
              "Wave-Former: Through-Occlusion 3D Reconstruction via Wireless Shape Completion",
              "RISE: Single Static Radar-based Indoor Scene Understanding",
          ]
          keys = [
              "zhaiSecondOrderAcousticNLOS2025", "jeonTJunctionMmWaveNLOS2025", "yuBiScalarAA2025",
              "yuTSANNLOS2025", "yueCornerRadar2022", "woodfordMosaic2022", "doddsRFlect2024",
              "doddsMmNorm2025", "doddsWaveFormer2026", "zhouRISE2026",
          ]
          readme = Path('README.md').read_text(errors='ignore')
          html = Path('index.html').read_text(errors='ignore')
          article = Path('article/5newscenes.tex').read_text(errors='ignore')
          tex = Path('bare_jrnl.tex').read_text(errors='ignore')
          bib = Path('egbib_merged_20260711.bib').read_text(errors='ignore')
          aux = Path('bare_jrnl.aux').read_text(errors='ignore')
          bbl = Path('bare_jrnl.bbl').read_text(errors='ignore')
          log = Path('bare_jrnl.log').read_text(errors='ignore')
          pdf = ''.join(c for c in Path('bare_jrnl.txt').read_text(errors='ignore').lower() if c.isalnum())
          errors=[]
          for title in titles:
              if readme.count(title) != 1:
                  errors.append(f'README title count for {title!r}: {readme.count(title)}')
              if html.count(title) != 1:
                  errors.append(f'website title count for {title!r}: {html.count(title)}')
          for key in keys:
              if article.count(key) != 1:
                  errors.append(f'survey citation count for {key}: {article.count(key)}')
              if len(re.findall(r'@[A-Za-z]+\s*\{\s*'+re.escape(key)+r'\s*,', bib, re.I)) != 1:
                  errors.append(f'bibliography count for {key} is not one')
              if key not in aux or key not in bbl:
                  errors.append(f'compiled citation missing for {key}')
          if '**Update run: 8 August 2026.**' not in readme:
              errors.append('README update date was not advanced')
          if 'Updated 8 August 2026' not in html:
              errors.append('website update date was not advanced')
          if '8 August 2026 forward-citation trace' not in tex:
              errors.append('bare_jrnl audit comment missing')
          if re.search(r'Citation .* undefined|There were undefined citations|Repeated entry', log):
              errors.append('LaTeX log contains unresolved or repeated citations')
          actual = html.count('{cat:')
          declared = re.findall(r'<b>(\d+)</b><span>tracked latest entries</span>', html)
          if len(declared) != 1 or int(declared[0]) != actual:
              errors.append(f'website counter mismatch declared={declared}, actual={actual}')
          if actual != 267:
              errors.append(f'expected 267 website paper records after direct additions, found {actual}')
          checks = [
              ('README DG-NLOS', readme, '10.1609/aaai.v39i7.32757'),
              ('README ICRA navigation', readme, '10.1109/ICRA55743.2025.11128292'),
              ('README TransiT final', readme, 'ICCV 2025, 27542–27551'),
              ('README NLOS-NeuS final', readme, 'ICCV 2023, 10532–10541'),
              ('website DG-NLOS', html, 'AAAI 2025, 39(7), 7051–7059'),
              ('website ICRA navigation', html, 'IEEE ICRA 2025, 4907–4914'),
          ]
          for label, data, needle in checks:
              if needle not in data:
                  errors.append(f'{label} missing {needle}')
          for needle in [
              'cornerradarrfbasedindoorlocalizationaroundcorners',
              'aroundthecornermmwaveimaginginpracticalenvironments',
              'waveformerthroughocclusion3dreconstructionviawirelessshapecompletion',
              'secondorderregimeariseswhenboththedirectpathandfirstorderdiffractionareunavailable',
          ]:
              if needle not in pdf:
                  errors.append(f'PDF semantic text missing {needle}')
          if errors:
              raise SystemExit('Validation failed:\n- ' + '\n- '.join(errors))
          print(f'Validated 10 additions and venue corrections across {actual} website records')
          PY
          pages=$(awk '/^Pages:/ {print $2}' /tmp/pdfinfo.txt)
          test -n "$pages"
          mkdir -p .pdf_render_check
          pdftoppm -f 1 -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/first >/dev/null 2>&1
          pdftoppm -f "$pages" -singlefile -png -r 120 bare_jrnl.pdf .pdf_render_check/last >/dev/null 2>&1
          test -s .pdf_render_check/first.png
          test -s .pdf_render_check/last.png
          rm -rf .pdf_render_check bare_jrnl.txt

      - name: Commit validated artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/sync_forward_citation_cluster_20260808.py
          rm -f .github/workflows/integrate-forward-citation-20260808.yml
          git add -A README.md index.html article/5newscenes.tex bare_jrnl.tex bare_jrnl.pdf \
            egbib_merged_20260711.bib updates/2026-08-08-forward-citation-rf-acoustic-integration.md \
            scripts/sync_forward_citation_cluster_20260808.py \
            .github/workflows/integrate-forward-citation-20260808.yml
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No generated changes' >&2
            exit 1
          fi
          git commit -m 'Integrate citation-traced RF and acoustic NLOS lineage'
          git push origin HEAD:automation/nlos-forward-citation-20260808
