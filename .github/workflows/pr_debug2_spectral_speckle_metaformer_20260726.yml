name: Compact diagnose spectral NLOS synchronizer

on:
  pull_request:
    branches: [master]
    paths:
      - updates/2026-07-26-spectral-speckle-metaformer-debug2-trigger.md

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/spectral-speckle-metaformer-20260726
          fetch-depth: 1
          show-progress: false
      - name: Run synchronizer
        run: python3 scripts/sync_nlos_spectral_memory_20260726.py
