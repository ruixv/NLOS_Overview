name: Integrate laser-acoustic NLOS orientation sensing

on:
  push:
    branches: [master]
    paths:
      - updates/TRIGGER_2026-07-28_LASER_ACOUSTIC_ORIENTATION.md

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize public sources
        run: python scripts/integrate_laser_acoustic_orientation.py

      - name: Validate synchronized sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          title = "Early fusion of laser and acoustic features for human orientation detection in non-line-of-sight environments"
          doi = "10.1038/s41598-026-52682-6"
          key = "doganLaserAcousticOrientationNLOS2026"

          readme = Path("README.md").read_text(encoding="utf-8")
          index = Path("index.html").read_text(encoding="utf-8")
          section = Path("article/5newscenes.tex").read_text(encoding="utf-8")
          bib = Path("egbib_merged_20260711.bib").read_text(encoding="utf-8")
          main = Path("bare_jrnl.tex").read_text(encoding="utf-8")

          assert readme.count(title) == 1
          assert readme.count(doi) == 1
          assert index.count(title) == 1
          assert index.count(doi) == 1
          assert section.count(key) == 1
          assert bib.count("@article{" + key + ",") == 1
          assert bib.count(doi) == 2  # DOI and URL fields in one BibTeX record
          assert "laser--acoustic hidden-human orientation sensing synchronized" in main

          object_count = len(re.findall(r'\{cat:"', index))
          match = re.search(r'<div class="stat"><b>(\d+)</b><span>tracked latest entries</span></div>', index)
          assert match and int(match.group(1)) == object_count
          print(f"validated {object_count} website paper objects")
          PY

      - name: Build survey PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: bare_jrnl.tex
          latexmk_use_xelatex: false

      - name: Validate PDF and commit integration
        shell: bash
        run: |
          set -euo pipefail
          test -s bare_jrnl.pdf
          test -f bare_jrnl.bbl
          grep -q "doganLaserAcousticOrientationNLOS2026" bare_jrnl.bbl
          ! grep -Eq "Citation.*undefined|There were undefined references" bare_jrnl.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html article/5newscenes.tex bare_jrnl.tex \
            egbib_merged_20260711.bib bare_jrnl.pdf \
            updates/2026-07-28-laser-acoustic-orientation.md
          git commit -m "Integrate laser-acoustic NLOS orientation sensing"
          git push origin master
