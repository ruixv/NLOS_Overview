name: Integrate Aug 12 radar NLOS geometry gap

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/integrate-radar-geometry-gap-20260812.yml
      - scripts/sync_radar_geometry_gap_20260812.py

permissions:
  contents: write

concurrency:
  group: nlos-radar-geometry-gap-20260812
  cancel-in-progress: false

jobs:
  integrate-build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out reviewed integration branch
        uses: actions/checkout@v4
        with:
          ref: automation/radar-geometry-gap-20260812
          fetch-depth: 0

      - name: Detect already-integrated state
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'zhuMultipathEnvironmentNLOS2026' egbib_merged_20260711.bib \
             && grep -q 'Multipath Exploitation-Based 3-D Environmental Perception and NLOS Moving Target Reconstruction for mmWave MIMO Imaging Radar' README.md \
             && grep -q 'From assumed relay geometry to joint environment and target inference.' article/5newscenes.tex; then
            echo 'done=true' >> "$GITHUB_OUTPUT"
            echo 'Validated public integration is already committed; skipping regeneration.'
          else
            echo 'done=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply bounded public-artifact updates
        if: steps.guard.outputs.done != 'true'
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/sync_radar_geometry_gap_20260812.py
          python3 scripts/sync_radar_geometry_gap_20260812.py

      - name: Validate synchronized source state
        if: steps.guard.outputs.done != 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          readme = Path('README.md').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')
          a5 = Path('article/5newscenes.tex').read_text(encoding='utf-8')
          bare = Path('bare_jrnl.tex').read_text(encoding='utf-8')
          bib = Path('egbib_merged_20260711.bib').read_text(encoding='utf-8')
          titles = [
              'Multipath Exploitation-Based 3-D Environmental Perception and NLOS Moving Target Reconstruction for mmWave MIMO Imaging Radar',
              'NLOS Building Layout and Target Estimation in an L-Shaped Corner with Complex Geometries',
              'A Two-Stage NLOS Target Positioning Method Based on 0-1 Non-Coherent Binary Accumulation',
              'A Reflective Surface Estimation Method Based on Multipath Utilization',
              'NLOS Tracking with Distributed Radar Using Multipath-Assisted JPDA',
              'Non-Line-of-Sight Target Localization in Unknown L-Shaped Corridor Based UWB MIMO Radar',
          ]
          keys = [
              'zhuMultipathEnvironmentNLOS2026','xueNLOSBuildingLayout2025','wuTwoStageNLOSPositioning2025',
              'luoReflectiveSurfaceMultipath2025','xuDistributedRadarNLOSTracking2025','jiaUnknownCorridorNLOS2025'
          ]
          dois = [
              '10.1109/TAES.2025.3647422','10.1109/TIM.2024.3522427','10.1109/TVT.2025.3542117',
              '10.1109/TIM.2025.3541688','10.1109/IGARSS55030.2025.11242772','10.23919/JSEE.2025.000021'
          ]
          errors = []
          for title in titles:
              if readme.count(title) != 1: errors.append(f'README title count {title!r} = {readme.count(title)}')
              if html.count(title) != 1: errors.append(f'index title count {title!r} = {html.count(title)}')
          for key in keys:
              if a5.count(key) != 1: errors.append(f'article citation {key} count = {a5.count(key)}')
              if len(re.findall(r'^@\w+\s*\{\s*' + re.escape(key) + r'\s*,', bib, re.M)) != 1:
                  errors.append(f'bibliography key {key} not unique')
          for doi in dois:
              if bib.lower().count(doi.lower()) != 1: errors.append(f'bibliography DOI {doi} not unique')
          if '**Update run: 12 August 2026.**' not in readme: errors.append('README date not advanced')
          if 'Updated 12 August 2026 · 210+ papers' not in html: errors.append('website date not advanced')
          if 'From assumed relay geometry to joint environment and target inference.' not in a5: errors.append('survey trajectory paragraph missing')
          if not bare.startswith('% 12 August 2026 radar citation trace:'): errors.append('bare_jrnl maintenance trace missing')
          if '\\input{article/5newscenes.tex}' not in bare: errors.append('bare_jrnl no longer inputs article/5newscenes.tex')
          if errors: raise SystemExit('Source validation failed:\n- ' + '\n- '.join(errors))
          print('Source synchronization validated.')
          PY

      - name: Install LaTeX and PDF validation tools
        if: steps.guard.outputs.done != 'true'
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get -o Acquire::Retries=5 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-pictures texlive-publishers \
            ghostscript poppler-utils

      - name: Rebuild survey PDF
        if: steps.guard.outputs.done != 'true'
        run: |
          set -euo pipefail
          old_hash=$(git hash-object bare_jrnl.pdf)
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc bare_jrnl.txt
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          new_hash=$(git hash-object bare_jrnl.pdf)
          echo "PDF blob: $old_hash -> $new_hash"
          test "$old_hash" != "$new_hash"

      - name: Validate compiled citations and PDF
        if: steps.guard.outputs.done != 'true'
        run: |
          set -euo pipefail
          pdftotext -layout bare_jrnl.pdf bare_jrnl.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path('bare_jrnl.log').read_text(errors='ignore')
          aux = Path('bare_jrnl.aux').read_text(errors='ignore')
          bbl = Path('bare_jrnl.bbl').read_text(errors='ignore')
          raw = Path('bare_jrnl.txt').read_text(errors='ignore').lower()
          pdf = ''.join(c for c in raw if c.isalnum())
          keys = [
              'zhuMultipathEnvironmentNLOS2026','xueNLOSBuildingLayout2025','wuTwoStageNLOSPositioning2025',
              'luoReflectiveSurfaceMultipath2025','xuDistributedRadarNLOSTracking2025','jiaUnknownCorridorNLOS2025'
          ]
          errors = []
          for key in keys:
              if key not in aux or key not in bbl: errors.append('compiled citation missing for ' + key)
          if re.search(r'Citation .* undefined|There were undefined citations|There were undefined references|Repeated entry', log):
              errors.append('LaTeX/BibTeX log has unresolved references or repeated entries')
          for term in ['reflectivesurface','unknownlshapedcorridor','distributedradar','environmentalperception','multipathassistedjpda']:
              if term not in pdf: errors.append('PDF text missing ' + term)
          if errors: raise SystemExit('Compiled validation failed:\n- ' + '\n- '.join(errors))
          print('Compiled survey validation passed.')
          PY
          pages=$(pdfinfo bare_jrnl.pdf | awk '/^Pages:/ {print $2}')
          test -n "$pages"
          mkdir -p .pdf_render_check
          pdftoppm -f 1 -singlefile -png -r 100 bare_jrnl.pdf .pdf_render_check/first >/dev/null 2>&1
          pdftoppm -f "$pages" -singlefile -png -r 100 bare_jrnl.pdf .pdf_render_check/last >/dev/null 2>&1
          test -s .pdf_render_check/first.png
          test -s .pdf_render_check/last.png
          rm -rf .pdf_render_check bare_jrnl.txt

      - name: Commit validated public artifacts
        if: steps.guard.outputs.done != 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html article/5newscenes.tex bare_jrnl.tex egbib_merged_20260711.bib updates/2026-08-12-radar-geometry-gap-synchronized.md
          git add -f bare_jrnl.pdf
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated changes to commit' >&2
            exit 1
          fi
          git commit -m 'Integrate radar NLOS unknown-geometry lineage'
          git push origin HEAD:automation/radar-geometry-gap-20260812
