name: Synchronize measured multipath radar recognition papers

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/sync_radar_recognition_20260726.yml
      - scripts/sync_nlos_radar_recognition_20260726.py
      - updates/2026-07-26-radar-recognition-citation-trace.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize-build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Install LaTeX, JavaScript, and PDF validation tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            texlive-publishers texlive-science texlive-bibtex-extra poppler-utils

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run fail-closed source synchronization
        run: python3 scripts/sync_nlos_radar_recognition_20260726.py

      - name: Validate website JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          if '<script>' not in html or '</script>' not in html:
              raise SystemExit('index.html script block missing')
          js = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/nlos-index.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/nlos-index.js

      - name: Validate synchronized source coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          papers = [
              ('Non-Line-of-Sight Target Recognition Method Based on Multi-Scale Feature Fusion', '10.12466/xhcl.2026.03.006', 'zengMultipathFeatureFusionNLOS2026'),
              ('Multipath Contrastive Learning for Non-line-of-sight Human Activity Recognition Using an Ultrawideband Radar', '10.12000/JR25241', 'zhongMultipathContrastiveNLOS2026'),
          ]
          readme = Path('README.md').read_text(encoding='utf-8').lower()
          index = Path('index.html').read_text(encoding='utf-8').lower()
          newscenes = Path('article/5newscenes.tex').read_text(encoding='utf-8')
          learning = Path('article/4datadriven.tex').read_text(encoding='utf-8')
          bib = Path('egbib_merged_20260711.bib').read_text(encoding='utf-8').lower()
          for title, doi, key in papers:
              assert readme.count(title.lower()) == 1, title
              assert index.count(title.lower()) == 1, title
              assert bib.count(doi.lower()) == 1, doi
              assert ('{' + key.lower() + ',') in bib, key
              assert key in newscenes, key
              assert key in learning, key
          print('Source coverage validation passed.')
          PY

      - name: Clean-build survey
        run: |
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc bare_jrnl.pdf
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex

      - name: Validate PDF text, metadata, and rendered pages
        run: |
          test -s bare_jrnl.pdf
          test -s bare_jrnl.bbl
          ! grep -Eq 'Citation .* undefined|There were undefined citations|multiply defined|There were undefined references' bare_jrnl.log
          pdfinfo bare_jrnl.pdf | tee /tmp/pdfinfo.txt
          pages=$(awk '/^Pages:/ {print $2}' /tmp/pdfinfo.txt)
          test -n "$pages" && test "$pages" -gt 0
          pdftotext bare_jrnl.pdf /tmp/survey.txt
          test -s /tmp/survey.txt
          grep -Fqi 'MuPhyCoNet' /tmp/survey.txt
          grep -Fqi 'Measured multipath radar recognition' /tmp/survey.txt
          grep -Fqi 'Physics-informed semantic learning from multipath radar' /tmp/survey.txt
          mkdir -p /tmp/rendered
          pdftoppm -f 1 -l 1 -png -r 120 bare_jrnl.pdf /tmp/rendered/first >/dev/null 2>&1
          pdftoppm -f "$pages" -l "$pages" -png -r 120 bare_jrnl.pdf /tmp/rendered/last >/dev/null 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import struct
          files = sorted(Path('/tmp/rendered').glob('*.png'))
          assert len(files) == 2, files
          for path in files:
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', path
              width, height = struct.unpack('>II', data[16:24])
              assert width > 500 and height > 500, (path, width, height)
              assert len(data) > 10000, (path, len(data))
              print(path.name, width, height, len(data))
          PY

      - name: Commit synchronized sources and regenerated PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html article/5newscenes.tex article/4datadriven.tex \
            bare_jrnl.tex egbib_merged_20260711.bib bare_jrnl.pdf
          if git diff --cached --quiet; then
            echo 'No source or PDF changes were needed.'
            exit 0
          fi
          git commit -m 'Integrate measured multipath radar recognition lineage [skip ci]'
          git push origin HEAD:master
