name: Diagnose spectral NLOS synchronizer

on:
  pull_request:
    branches: [master]
    paths:
      - scripts/sync_nlos_spectral_memory_20260726.py
      - updates/2026-07-26-spectral-speckle-metaformer-pr-trigger.md

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/spectral-speckle-metaformer-20260726
          fetch-depth: 0
      - name: Run synchronizer and retain diagnostics
        id: sync
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/sync_nlos_spectral_memory_20260726.py 2>&1 | tee /tmp/spectral-sync.log
      - name: Commit failure diagnostic
        if: steps.sync.outcome == 'failure'
        run: |
          cp /tmp/spectral-sync.log updates/2026-07-26-spectral-speckle-metaformer-failure.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/2026-07-26-spectral-speckle-metaformer-failure.log
          git commit -m 'Record spectral synchronizer failure [skip ci]' || true
          git push origin HEAD:automation/spectral-speckle-metaformer-20260726
          exit 1
      - name: Confirm synchronizer success
        if: steps.sync.outcome == 'success'
        run: echo 'Synchronizer completed without failure.'
