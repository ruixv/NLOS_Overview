name: Correct Quasi-Fresnel Optica DOI and rebuild survey PDF

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - updates/trigger-quasi-fresnel-doi-20260725.txt

permissions:
  contents: write

concurrency:
  group: correct-quasi-fresnel-doi-20260725
  cancel-in-progress: true

jobs:
  correct-build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            texlive-publishers texlive-science texlive-bibtex-extra poppler-utils

      - name: Apply final DOI correction
        run: python3 scripts/correct_quasi_fresnel_final_doi_20260725.py

      - name: Validate source metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          title = 'Fast and Memory-efficient Non-line-of-sight Imaging with Quasi-Fresnel Transform'
          doi = '10.1364/OPTICA.604217'
          readme = Path('README.md').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')
          bib = Path('egbib_merged_20260711.bib').read_text(encoding='utf-8')
          assert readme.lower().count(title.lower()) == 1
          assert index.lower().count(title.lower()) == 1
          assert 'https://doi.org/' + doi in readme
          assert 'https://doi.org/' + doi in index
          assert bib.lower().count(doi.lower()) == 2
          assert 'journal = {Optica}' in bib
          assert 'Accepted for publication; also available as arXiv:2508.02003' in bib
          print('Quasi-Fresnel DOI metadata validation passed.')
          PY

      - name: Clean-build survey
        run: |
          rm -f bare_jrnl.aux bare_jrnl.bbl bare_jrnl.blg bare_jrnl.log bare_jrnl.out bare_jrnl.toc bare_jrnl.pdf
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          bibtex bare_jrnl
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex
          pdflatex -interaction=nonstopmode -halt-on-error bare_jrnl.tex

      - name: Validate PDF and citation
        run: |
          test -s bare_jrnl.pdf
          grep -Fq '\\bibitem{weiQuasiFresnel2026}' bare_jrnl.bbl
          grep -Fq '10.1364/OPTICA.604217' bare_jrnl.bbl
          ! grep -Eq 'Citation .* undefined|There were undefined citations|multiply defined' bare_jrnl.log
          pdfinfo bare_jrnl.pdf | tee /tmp/pdfinfo.txt
          pages=$(awk '/^Pages:/ {print $2}' /tmp/pdfinfo.txt)
          test -n "$pages" && test "$pages" -gt 0
          pdftotext bare_jrnl.pdf /tmp/survey.txt
          grep -Fqi 'Quasi-Fresnel' /tmp/survey.txt
          rm -rf /tmp/render && mkdir -p /tmp/render
          pdftoppm -png -r 60 bare_jrnl.pdf /tmp/render/page >/dev/null 2>&1
          rendered=$(find /tmp/render -type f -name 'page-*.png' -size +0c | wc -l)
          test "$rendered" -eq "$pages"

      - name: Commit correction and regenerated PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html egbib_merged_20260711.bib bare_jrnl.tex bare_jrnl.pdf updates/2026-07-25-quasi-fresnel-final-doi.md
          if git diff --cached --quiet; then
            echo 'No correction was needed.'
            exit 0
          fi
          git commit -m 'Correct Quasi-Fresnel Optica DOI [skip ci]'
          git push origin HEAD:master
